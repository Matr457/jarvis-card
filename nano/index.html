<style>/* Питч NANO для инвесторов — телефон первым (iPhone 390×844), космос + индиго + лавандовая туманность (канон стиля 08.11). */
:root{
  --bg:#0b0820;--bg2:#150e38;--ink:#f6f2ff;--ink2:#d4cbf3;--ink3:#a197cc;--line:rgba(255,255,255,.13);
  --acc:#c4a6ff;--pink:#f9a8d4;--gold:#fde047;--sky:#7dd3fc;--green:#4ade80;--r:22px;
  --top:calc(58px + env(safe-area-inset-top));--sb:env(safe-area-inset-bottom);
  --glass:rgba(24,16,62,.62);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:var(--top);-webkit-text-size-adjust:100%;background:var(--bg)}
body{min-height:100vh;color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  background:radial-gradient(900px 600px at 80% -10%,rgba(181,124,245,.30),transparent 60%),
             radial-gradient(800px 700px at -10% 40%,rgba(249,168,212,.14),transparent 60%),
             radial-gradient(900px 800px at 110% 85%,rgba(59,91,219,.22),transparent 60%),var(--bg);
  background-attachment:fixed;overflow-x:hidden}
#cosmos{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(239,68,68,0)}}

/* вход: короткая вспышка, не держит дольше 1,4 с */
.intro{position:fixed;inset:0;z-index:60;background:#05030f;display:grid;place-items:center;pointer-events:none;animation:introOut .7s .75s ease forwards}
.intro i{width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 40px 12px #c4a6ff,0 0 120px 40px rgba(181,124,245,.6);animation:introPop 1.2s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes introPop{0%{transform:scale(.2);opacity:0}35%{opacity:1}100%{transform:scale(60);opacity:0}}
@keyframes introOut{to{opacity:0;visibility:hidden}}

/* верхняя панель */
.top{position:fixed;top:0;left:0;right:0;z-index:30;height:var(--top);padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,rgba(11,8,32,.92),rgba(11,8,32,.55));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.16em;font-size:15px}
.brand img{border-radius:9px;box-shadow:0 0 14px rgba(196,166,255,.5)}
.seg{flex:1;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);max-width:300px;margin:0 auto}
.seg a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:34px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink3);white-space:nowrap;transition:background .3s,color .3s}
.seg a em{font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:rgba(255,255,255,.1)}
.seg a.on{background:linear-gradient(135deg,#d9c7ff,#f9a8d4);color:#1a1040}
.seg a.on em{background:rgba(26,16,64,.15)}
.lang{all:unset;cursor:pointer;height:34px;min-width:40px;padding:0 10px;border-radius:999px;display:grid;place-items:center;font-size:13px;font-weight:800;border:1px solid var(--line);background:rgba(255,255,255,.06);flex:none}
.seg,.seg a{min-width:0}
@media (max-width:420px){
  .top{gap:8px}.brand b{display:none}
  .seg a{font-size:12.5px;gap:5px}.seg a em{width:16px;height:16px;font-size:10px}
}

main{max-width:560px;margin:0 auto;overflow-x:hidden;overflow-x:clip} /* бейджи хаоса и свечения не раздувают ширину страницы на iPhone */
.sec{padding:76px 20px 28px;position:relative}
.kick{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:10px}
h2{font-size:31px;line-height:1.12;letter-spacing:-.01em;font-weight:800;margin-bottom:18px;text-wrap:balance}
h3{font-size:21px;line-height:1.2;font-weight:800;margin:26px 0 10px}
.lead{font-size:18px;color:var(--ink2);margin:16px 0 0}
.lead.strong{color:var(--ink);font-weight:700}
.price{margin-top:16px;display:inline-flex;padding:10px 16px;border-radius:14px;font-weight:800;font-size:15px;color:#1a1040;background:linear-gradient(135deg,#fde68a,#f9a8d4)}
.panel{position:relative;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);padding:16px;margin-top:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 24px 50px -24px rgba(0,0,0,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

/* кнопки */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:16px;
  font-weight:800;font-size:16px;color:#1a1040;background:linear-gradient(135deg,#efe6ff,#c4a6ff);box-shadow:0 10px 30px -10px rgba(196,166,255,.7);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);box-shadow:none}
.btn.play{width:100%;min-height:64px;justify-content:flex-start;gap:14px;padding:0 14px;font-size:18px;
  background:linear-gradient(120deg,#fde68a 0%,#f9a8d4 45%,#c4a6ff 100%);background-size:200% 100%;animation:sheenBtn 5s ease-in-out infinite}
.btn.play small{display:block;font-size:13px;font-weight:700;opacity:.7}
.btn.play .pi{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#1a1040;color:#fde68a;box-shadow:0 0 0 6px rgba(26,16,64,.12);animation:ring 2s infinite}
.btn.play .pi svg{fill:currentColor;stroke:none;margin-left:3px}
.btn.wide{justify-content:center;margin-top:20px}
@keyframes sheenBtn{50%{background-position:100% 0}}
@keyframes ring{50%{box-shadow:0 0 0 12px rgba(26,16,64,0)}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.row2 .btn{font-size:14px;padding:0 8px;gap:6px;white-space:nowrap}
.row2 .btn svg{width:18px;height:18px}

/* ── визитка ── */
.hero{position:relative;min-height:100vh;min-height:100svh;padding:calc(var(--top) + 4px) 16px 64px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
#galaxy{position:absolute;left:50%;top:0;width:100vw;max-width:none;height:100%;transform:translateX(-50%);pointer-events:none}
.hero-img{position:absolute;left:50%;top:calc(var(--top) - 8px);height:min(50svh,520px);width:auto;transform:translateX(-50%);
  filter:drop-shadow(0 0 30px rgba(196,166,255,.45)) drop-shadow(0 30px 40px rgba(0,0,0,.5));animation:float 6s ease-in-out infinite,heroIn 1.4s .5s both cubic-bezier(.2,.8,.2,1)}
/* низ портрета растворён в самой картинке (make.py faded): маска CSS резала свечение прямоугольником */
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -10px}}
@keyframes heroIn{from{opacity:0;transform:translateX(-50%) translateY(40px) scale(.94);filter:blur(8px)}}
.card3d{position:relative;z-index:2;display:grid;perspective:1200px;margin-top:min(38svh,380px);animation:rise 1s 1s both}
.back .row2{grid-template-columns:1.4fr 1fr}
.card3d .face{grid-area:1/1;position:relative;border-radius:26px;padding:18px 16px 16px;overflow:hidden;
  background:linear-gradient(160deg,rgba(40,26,96,.78),rgba(18,11,48,.86));border:1px solid rgba(255,255,255,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 30px 60px -20px rgba(0,0,0,.85),0 0 0 1px rgba(196,166,255,.08);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);-webkit-backface-visibility:hidden;backface-visibility:hidden;
  transition:transform .8s cubic-bezier(.3,1.3,.4,1);transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.card3d .back{transform:rotateY(180deg)}
.card3d.flip .front{transform:rotateY(-180deg)}
.card3d.flip .back{transform:rotateY(0)}
.foil{position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:screen;opacity:.9;
  background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.16) 44%,rgba(249,168,212,.18) 50%,rgba(125,211,252,.16) 56%,transparent 68%);
  background-size:260% 100%;animation:foil 7s ease-in-out infinite}
@keyframes foil{0%,100%{background-position:110% 0}50%{background-position:-10% 0}}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--acc)}
.hero h1{font-size:34px;line-height:1.05;font-weight:850;margin:6px 0 8px;letter-spacing:-.01em;
  background:linear-gradient(90deg,#fff,#f3e8ff 40%,#f9a8d4 70%,#fde68a);-webkit-background-clip:text;background-clip:text;color:transparent}
.role{font-size:16px;color:var(--ink2);line-height:1.45}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 14px}
.badges span{font-size:12.5px;font-weight:800;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.back h2{font-size:26px;margin:6px 0 12px}
.clist{display:flex;flex-direction:column;gap:8px}
.ci{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:50px;padding:0 14px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:700;font-size:15.5px;overflow:hidden}
.ci span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{position:absolute;left:50%;bottom:calc(14px + var(--sb));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ink3);animation:rise 1s 2s both}
.hint i{width:18px;height:28px;border:2px solid var(--ink3);border-radius:10px;position:relative}
.hint i::after{content:"";position:absolute;left:50%;top:5px;width:3px;height:6px;margin-left:-1.5px;border-radius:2px;background:var(--ink2);animation:wheel 1.6s infinite}
@keyframes wheel{60%{transform:translateY(8px);opacity:0}}

/* ── проблема: хаос приложений → один шар ── */
.chaos{position:relative;height:230px;margin:6px 0 4px}
.chaos .app{position:absolute;padding:8px 12px;border-radius:12px;font-size:13px;font-weight:800;white-space:nowrap;
  background:rgba(255,255,255,.08);border:1px solid var(--line);transform:translate(-50%,-50%) rotate(var(--rot));
  transition:left 1.1s cubic-bezier(.6,-0.2,.3,1),top 1.1s cubic-bezier(.6,-0.2,.3,1),transform 1.1s,opacity .9s;animation:jit 3s ease-in-out infinite;animation-delay:var(--d)}
.chaos .app b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--c)}
.chaos .app i{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:10px;background:#ef4444;color:#fff;font:800 11px/20px system-ui;text-align:center;font-style:normal;padding:0 5px}
@keyframes jit{50%{margin-top:-6px}}
.chaos .orb{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#fff 0,#e9d8ff 18%,#b57cf5 55%,#3b1f86 100%);box-shadow:0 0 60px 10px rgba(196,166,255,.55),0 0 140px 30px rgba(249,168,212,.25);
  transform:scale(0);opacity:0;transition:transform 1s cubic-bezier(.2,1.4,.4,1) .7s,opacity .6s .7s}
.chaos .orb img{width:70px;height:70px;border-radius:50%}
.chaos.merge .app{left:50%!important;top:50%!important;transform:translate(-50%,-50%) scale(.2) rotate(0);opacity:0;animation:none}
.chaos.merge .orb{transform:scale(1);opacity:1;animation:orb 3s 1.8s ease-in-out infinite}
@keyframes orb{50%{box-shadow:0 0 80px 18px rgba(196,166,255,.7),0 0 160px 40px rgba(249,168,212,.35)}}

/* ── один дом ── */
.tg{padding:14px 16px}
.tg-h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3);margin-bottom:6px}
.tg-h .dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399}
.tg p{font-size:16.5px;font-weight:700}
.dropbox{padding:0;overflow:hidden}
#mini,#mini2{display:block;width:100%;height:230px}
.nano-say{position:absolute;left:12px;right:12px;top:12px;padding:10px 14px;border-radius:16px 16px 16px 6px;background:rgba(17,11,46,.88);border:1px solid var(--line);
  font-size:15px;font-weight:600;opacity:0;transform:translateY(-6px);transition:opacity .35s,transform .35s;pointer-events:none}
.nano-say.on{opacity:1;transform:none}
.nano-say b{color:var(--acc)}
.try{padding:12px 16px 0;font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--ink3);text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px 0}
.chip{all:unset;cursor:pointer;padding:9px 13px;border-radius:999px;font-size:14.5px;font-weight:700;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.chip:active{transform:scale(.97)}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--c)}
.dropform{display:flex;gap:8px;padding:12px 16px 16px}
.dropform input{flex:1;min-width:0;height:50px;padding:0 14px;border-radius:14px;background:rgba(5,3,20,.55);border:1px solid var(--line);outline:none;font-size:16px}
.dropform .btn{min-height:50px}
.fly{position:fixed;z-index:40;padding:8px 13px;border-radius:999px;font-size:14px;font-weight:800;color:#1a1040;background:var(--c);pointer-events:none;
  box-shadow:0 0 30px var(--c);transition:left .9s cubic-bezier(.5,0,.3,1),top .9s cubic-bezier(.5,-0.4,.3,1),transform .9s,opacity .9s}

/* ── CEO: очередь Approve ── */
.q-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:14px;color:var(--ink2)}
.q-h em{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.08);color:var(--ink3)}
.q-list{display:flex;flex-direction:column;gap:8px;min-height:60px}
.qi{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--line);
  transition:transform .6s cubic-bezier(.5,-0.3,.4,1),opacity .5s,max-height .5s .3s,padding .5s .3s,margin .5s .3s;max-height:120px}
.qi .tx{flex:1;min-width:0}.qi .tx b{display:block;font-size:15.5px;line-height:1.3}.qi .tx small{font-size:12.5px;color:var(--ink3)}
.qi .btn{min-height:44px;padding:0 14px;font-size:14.5px;background:linear-gradient(135deg,#bbf7d0,#4ade80);box-shadow:0 8px 24px -10px rgba(74,222,128,.8)}
.qi.ok{transform:translateX(110%) rotate(4deg);opacity:0;max-height:0;padding-top:0;padding-bottom:0;margin-top:-8px}
.q-done{padding:14px;border-radius:16px;font-weight:800;background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.4);animation:rise .5s both}
.q-f{margin-top:12px;font-size:14px;color:var(--ink3)}.q-f b{font-size:20px;color:var(--green)}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.facts span{font-size:13.5px;font-weight:700;padding:7px 12px;border-radius:999px;background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.3)}
.facts span::before{content:"✓ ";color:var(--green)}

/* ── Teacher ── */
.ladder4{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.ladder4 li{position:relative;padding:22px 2px 8px;border-radius:12px;text-align:center;font-size:11.5px;font-weight:800;line-height:1.15;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink3);transition:all .5s}
.ladder4 li::before{content:attr(data-n);position:absolute;top:5px;left:0;right:0;font-size:11px;opacity:.6}
.ladder4 li.on{color:#1a1040;background:linear-gradient(160deg,#bbf7d0,#4ade80);border-color:transparent;box-shadow:0 0 20px rgba(74,222,128,.45)}
.qq{font-size:17px;font-weight:700;margin-bottom:10px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qa button{all:unset;cursor:pointer;text-align:center;padding:14px 4px;border-radius:14px;font-weight:800;font-size:15px;background:rgba(255,255,255,.07);border:1px solid var(--line);transition:background .3s}
.qa button.yes{background:rgba(74,222,128,.25);border-color:var(--green)}
.qa button.no{background:rgba(239,68,68,.2);border-color:#ef4444}
.qr{min-height:44px;margin-top:10px;font-size:15px;color:var(--ink2)}
.race b{display:block;margin-bottom:10px}
.bar{position:relative;height:38px;border-radius:12px;background:rgba(255,255,255,.05);margin-bottom:8px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:12px;transition:width 2.4s cubic-bezier(.3,.7,.2,1)}
.bar.was i{background:linear-gradient(90deg,#7f1d1d,#ef4444)}.bar.now i{background:linear-gradient(90deg,#166534,#4ade80);transition-duration:.6s}
.bar span{position:relative;line-height:38px;padding-left:12px;font-weight:800;font-size:15px}.bar em{font-style:normal;font-weight:600;opacity:.8}
.race.go .was i{width:100%}.race.go .now i{width:12.4%}
.race strong{display:block;margin-top:6px;font-size:26px;color:var(--green)}

/* ── мой день ── */
.day{list-style:none;margin-top:18px;position:relative}
.day::before{content:"";position:absolute;left:58px;top:8px;bottom:8px;width:2px;background:linear-gradient(180deg,#c4a6ff,#f9a8d4,#7dd3fc)}
.day li{display:grid;grid-template-columns:48px 20px 1fr;gap:6px;align-items:start;padding:8px 0}
.day time{font-weight:800;font-size:14px;color:var(--ink3);padding-top:1px}
.day li i{width:14px;height:14px;margin:4px 0 0 3px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);position:relative;z-index:1}
.day li span{font-size:16px;font-weight:600}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.duo div{padding:14px;border-radius:18px;background:var(--glass);border:1px solid var(--line)}
.duo b{display:block;font-size:30px;font-weight:850;background:linear-gradient(90deg,#fde68a,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent}
.duo span{font-size:13.5px;color:var(--ink2)}

/* ── глава 2 ── */
.chapter{margin:40px 20px 0;padding:22px;border-radius:24px;text-align:center;background:linear-gradient(135deg,rgba(253,230,138,.14),rgba(249,168,212,.14),rgba(196,166,255,.18));border:1px solid var(--line)}
.chapter span{display:block;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3)}
.chapter b{font-size:28px;font-weight:850}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px;border-radius:18px;background:var(--glass);border:1px solid var(--line);min-height:104px}
.tile b{display:block;font-size:29px;line-height:1.1;font-weight:850;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,#fff,#e9d8ff 50%,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent}
.tile span{display:block;margin-top:6px;font-size:13.5px;line-height:1.3;color:var(--ink2)}
.galbox b{display:block;font-size:15px}
.legend{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13.5px;color:var(--ink2)}
.legend li{display:flex;align-items:center;gap:8px}.legend i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.legend em{margin-left:auto;font-style:normal;font-weight:800;color:var(--ink)}
.awards{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:14px}
.awards li{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);font-weight:700;font-size:15.5px}
.awards li::before{content:"★";color:var(--gold);font-size:18px;text-shadow:0 0 10px rgba(253,224,71,.7)}

.prod{position:relative;margin-top:14px;padding:18px;border-radius:24px;background:var(--glass);border:1px solid var(--line);overflow:hidden}
.prod::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;filter:blur(40px);opacity:.45;background:var(--c)}
.prod.b2c{--c:#c4a6ff}.prod.b2b{--c:#ef4444}.prod.edu{--c:#4ade80}
.prod em{font-style:normal;font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.prod h3{margin:4px 0 10px;position:relative;z-index:1}
.prod .big{font-size:38px;font-weight:850;line-height:1.05;position:relative;z-index:1}
.prod p{position:relative;z-index:1;color:var(--ink2);font-size:15px}
.tiers{display:grid;gap:8px;position:relative;z-index:1}
.tier{display:grid;grid-template-columns:70px auto 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.tier b{font-size:14px;color:var(--ink3);font-weight:800}.tier strong{font-size:22px;font-weight:850;white-space:nowrap}.tier span{font-size:13px;color:var(--ink2);line-height:1.3}
.tier.hot{border-color:rgba(249,168,212,.6);background:rgba(249,168,212,.1)}

.paper{margin-top:12px;padding:16px;border-radius:20px;background:var(--glass);border:1px solid var(--line);border-left:4px solid var(--c)}
.paper em{font-style:normal;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.paper b{display:block;font-size:18px;line-height:1.25;margin:6px 0}
.paper p{font-size:14.5px;color:var(--ink2)}

/* ── сделка ── */
.deal{position:relative;overflow:hidden;text-align:center;padding:26px 16px;border-radius:28px;
  background:linear-gradient(160deg,rgba(253,230,138,.18),rgba(249,168,212,.14) 50%,rgba(196,166,255,.2));border:1px solid rgba(253,230,138,.4);
  box-shadow:0 0 60px -10px rgba(253,224,71,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.deal .sum{font-size:56px;line-height:1;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff8d6,#fde047 55%,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(253,224,71,.45))}
.deal .for{font-size:26px;font-weight:850;margin-top:4px}
.deal .val{font-size:15px;color:var(--ink2);margin-top:6px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end;height:250px;margin-top:22px;padding:0 4px}
.step{position:relative;height:var(--h);display:flex;flex-direction:column;justify-content:flex-start;align-items:center;text-align:center;
  border-radius:16px 16px 6px 6px;background:linear-gradient(180deg,var(--c),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);
  transform-origin:bottom;transform:scaleY(0);transition:transform 1.1s cubic-bezier(.2,1.2,.3,1)}
.steps.go .step{transform:scaleY(1)}
.steps.go .step:nth-child(2){transition-delay:.35s}.steps.go .step:nth-child(3){transition-delay:.7s}
.step strong{position:absolute;bottom:calc(100% + 6px);left:-6px;right:-6px;font-size:22px;font-weight:900;white-space:nowrap}
.step:nth-child(3) strong{font-size:26px;color:var(--gold);text-shadow:0 0 18px rgba(253,224,71,.6)}
.step b{margin-top:10px;font-size:13.5px;font-weight:850;color:#1a1040}
.step small{font-size:11.5px;font-weight:700;color:rgba(26,16,64,.75);padding:0 4px;line-height:1.2}
.step.now::after{content:"";position:absolute;inset:-4px;border-radius:18px 18px 8px 8px;border:2px solid #fde047;animation:nowp 1.6s infinite}
@keyframes nowp{50%{opacity:.2}}
.rocket{position:relative;margin-top:46px}
.rocket svg{position:absolute;left:4px;right:4px;top:0;width:calc(100% - 8px);height:250px;overflow:visible;pointer-events:none;z-index:3}
.rocket path{fill:none;stroke:#fde047;stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:100;stroke-dashoffset:100;
  filter:drop-shadow(0 0 6px rgba(253,224,71,.9));transition:stroke-dashoffset 2.2s .3s cubic-bezier(.5,0,.3,1)}
.rocket.go path{stroke-dashoffset:0}
.rocket .steps{margin-top:0}
.rv.in>li,.rv.in>.tile,.rv.in>.tier,.rv.in>.paper{animation:rise .6s both;animation-delay:calc(var(--i,0)*70ms)}
.note{margin-top:42px;padding:12px 14px;border-radius:14px;font-size:14.5px;color:var(--ink2);background:rgba(255,255,255,.05);border:1px dashed var(--line)}
.funds{list-style:none;counter-reset:f;display:flex;flex-direction:column;gap:8px}
.funds li{counter-increment:f;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);font-weight:700;font-size:15.5px}
.funds li::before{content:counter(f);flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#1a1040;background:linear-gradient(135deg,#fde68a,#f9a8d4)}

/* ── контакты ── */
.me{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.me .ava{border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px rgba(196,166,255,.5),0 0 24px rgba(196,166,255,.5)}
.me b{display:block;font-size:20px}.me small{color:var(--ink3);font-size:13px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:14px;min-height:100px;border-radius:18px;background:var(--glass);border:1px solid var(--line);overflow:hidden}
.cbtn svg{width:26px;height:26px;color:var(--acc)}.cbtn b{font-size:16px}.cbtn small{font-size:12.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cvs{margin-top:10px}
.made{margin:26px 0 calc(90px + var(--sb));font-size:13px;color:var(--ink3);text-align:center}

/* ── док интервью ── */
.dock{position:fixed;left:8px;right:8px;bottom:calc(8px + var(--sb));z-index:35;max-width:560px;margin:0 auto;padding:12px 14px 10px;border-radius:24px;
  background:rgba(14,9,40,.93);border:1px solid rgba(196,166,255,.35);box-shadow:0 -10px 60px -10px rgba(0,0,0,.8),0 0 40px -10px rgba(196,166,255,.5);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transform:translateY(130%);transition:transform .5s cubic-bezier(.2,1,.3,1)}
.dock.on{transform:none}
.prog{display:flex;gap:4px;margin-bottom:10px}
.prog i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;position:relative}
.prog i.done{background:var(--acc)}
.prog i.cur::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#fde68a,#f9a8d4);transform-origin:left;transform:scaleX(var(--p,0))}
.line b{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.line.inv{padding-left:2px;margin-bottom:8px}.line.inv b{color:var(--ink3)}.line.inv p{font-size:15px;color:var(--ink2);font-style:italic;min-height:22px}
.line.nan{display:flex;gap:10px;align-items:flex-start}
.dava{flex:none;width:44px;height:44px;border-radius:50%;background:#2a1f5e 50% 20%/cover no-repeat;box-shadow:0 0 0 2px rgba(196,166,255,.6),0 0 16px rgba(196,166,255,.6)}
.dock.talk .dava{animation:talk .5s ease-in-out infinite alternate}
@keyframes talk{to{box-shadow:0 0 0 3px #f9a8d4,0 0 26px rgba(249,168,212,.9)}}
.line.nan b{color:var(--acc)}.line.nan p{font-size:16.5px;line-height:1.42;font-weight:600;min-height:70px;max-height:34svh;overflow-y:auto}
.ctl{display:flex;gap:6px;margin-top:10px}
.cb{all:unset;cursor:pointer;box-sizing:border-box;height:42px;min-width:42px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.cb.wide{flex:1;padding:0 10px;font-weight:800;font-size:14px}
.cb.off{opacity:.4}
body.pitching .nc-fab,body.pitching .hint{display:none}
body.on-card .nc-fab{opacity:0;pointer-events:none;transform:scale(.6)}
body.pitching .made{margin-bottom:60svh}

.toast{position:fixed;left:50%;top:calc(var(--top) + 10px);z-index:50;transform:translate(-50%,-20px);opacity:0;padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;
  color:#1a1040;background:linear-gradient(135deg,#efe6ff,#c4a6ff);transition:all .35s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.flash{animation:flash 1.4s}
@keyframes flash{30%{box-shadow:0 0 0 3px var(--acc),0 0 40px rgba(196,166,255,.6)}}

/* чат NANO: кнопка выше нижнего края iPhone */
.nc-fab{bottom:calc(16px + var(--sb))}
@media (max-width:560px){.nc-fab{bottom:calc(12px + var(--sb))}.nc-pane{bottom:calc(8px + var(--sb))}}

@media (min-width:900px){
  .hero{padding-bottom:80px}
  .hero-img{height:min(64vh,620px)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
<style>/* Окно разговора с NANO — стиль визиток (стекло на индиго, акцент визитки --acc) */
.nc-ava{display:block;flex:none;width:44px;height:44px;border-radius:50%;background:#2a1f5e 47% 9%/250% no-repeat;
  box-shadow:0 0 0 2px rgba(255,255,255,.12),0 0 18px color-mix(in srgb,var(--acc) 45%,transparent)}
.nc-fab{all:unset;cursor:pointer;position:fixed;right:20px;bottom:20px;z-index:20;display:flex;align-items:center;gap:10px;padding:6px 18px 6px 6px;
  border-radius:999px;background:rgba(22,15,56,.85);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 18px 40px -12px rgba(5,2,25,.7);font-weight:800;font-size:14px;color:var(--ink);transition:transform .25s,opacity .25s}
.nc-fab:hover{transform:translateY(-2px)}
.nc-fab .nc-ava{width:48px;height:48px;animation:ncring 2.6s ease-in-out infinite}
@keyframes ncring{50%{box-shadow:0 0 0 2px rgba(255,255,255,.12),0 0 0 8px color-mix(in srgb,var(--acc) 18%,transparent),0 0 24px color-mix(in srgb,var(--acc) 55%,transparent)}}
.nc-fab.hide{opacity:0;pointer-events:none;transform:scale(.9)}
.nc-pane{position:fixed;right:20px;bottom:20px;z-index:21;width:min(400px,calc(100vw - 32px));height:min(600px,calc(100svh - 110px));
  display:flex;flex-direction:column;border-radius:26px;overflow:hidden;background:rgba(17,11,46,.92);border:1px solid var(--line);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 80px -20px rgba(0,0,0,.8);
  opacity:0;pointer-events:none;transform:translateY(16px) scale(.98);transform-origin:bottom right;transition:opacity .25s,transform .25s}
.nc-pane.on{opacity:1;pointer-events:auto;transform:none}
.nc-head{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 12%,transparent),transparent)}
.nc-head div{flex:1;min-width:0}.nc-head b{display:block;font-size:15px;letter-spacing:.08em}
.nc-head small{font-size:12px;color:var(--ink3)}
.nc-head small::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:#34d399;box-shadow:0 0 8px #34d399;vertical-align:1px}
.nc-ib{all:unset;cursor:pointer;flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);transition:background .2s,color .2s}
.nc-ib:hover{background:rgba(255,255,255,.07);color:var(--ink)}
.nc-ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nc-snd.off{opacity:.4}
.nc-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.nc-msg{max-width:86%;padding:11px 14px;border-radius:18px;font-size:14.5px;line-height:1.5;animation:rise .3s ease both}
.nc-msg.bot{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid var(--line);border-bottom-left-radius:6px}
.nc-msg.me{align-self:flex-end;color:#170f35;font-weight:600;background:var(--acc);border-bottom-right-radius:6px}
.nc-msg.typing{display:flex;gap:5px;padding:14px 16px}
.nc-msg.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink2);animation:ncdot 1s infinite}
.nc-msg.typing i:nth-child(2){animation-delay:.15s}.nc-msg.typing i:nth-child(3){animation-delay:.3s}
@keyframes ncdot{50%{opacity:.25;transform:translateY(-3px)}}
.nc-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.nc-chip{all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--ink2);
  border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);background:color-mix(in srgb,var(--acc) 7%,transparent);transition:background .2s,color .2s}
.nc-chip:hover{color:var(--ink);background:color-mix(in srgb,var(--acc) 18%,transparent)}
.nc-form{display:flex;gap:6px;align-items:center;padding:10px 10px 12px 14px;border-top:1px solid var(--line)}
.nc-in{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--ink);background:rgba(10,6,30,.6);border:1px solid var(--line);border-radius:14px;padding:11px 14px;outline:none}
.nc-in:focus{border-color:color-mix(in srgb,var(--acc) 60%,transparent)}
.nc-go{color:#170f35;background:var(--acc)}.nc-go:hover{color:#170f35;background:var(--acc);filter:brightness(1.08)}
.nc-mic.rec{color:#fff;background:#ef4444;animation:pulse 1.2s infinite}
.nc-flash{outline:2px solid var(--acc);outline-offset:6px;border-radius:var(--r);transition:outline-color 1s}
@media (max-width:560px){
  .nc-fab{right:12px;bottom:12px;padding:5px}.nc-fab-t{display:none}
  .nc-pane{right:8px;left:8px;bottom:8px;width:auto;height:min(78svh,640px)}
}
</style>
</head>

    function resize() {

      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); seed(); if (still) draw(0);
    }
    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      for (const s of stars) {
        const tw = still ? 1 : .55 + .45 * Math.sin(t * s.sp + s.ph);
        const x = s.x + mx * s.L * par / 3, y = s.y + my * s.L * par / 3;
        if (s.big) { const d = s.r * 9 * (.8 + .2 * tw); ctx.globalAlpha = s.a * tw; ctx.drawImage(glow, x - d / 2, y - d / 2, d, d); }
        ctx.globalAlpha = s.a * tw; ctx.fillStyle = s.big ? '#f3efff' : '#d8d2ff';
        ctx.beginPath(); ctx.arc(x, y, s.r, 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    function loop(now) { mx += (tx - mx) * .04; my += (ty - my) * .04; draw(now / 1000); raf = requestAnimationFrame(loop); }
    addEventListener('resize', resize); resize();
    if (!still) {
      addEventListener('mousemove', e => { tx = e.clientX / W - .5; ty = e.clientY / H - .5; });
      raf = requestAnimationFrame(loop);
    }
    return { destroy() { cancelAnimationFrame(raf); removeEventListener('resize', resize); } };
  }
  return { mount };
})();
</script>
<script>// Галактики мозга NANO на canvas: 8 цветов-тем, звёзд ∝ числу заметок (FACTS.counts), мосты между темами с бегущими импульсами.
// GALAXY.mount(canvas, opts) → {add(name), flare(name), pos(name), setLabels(map)}; рисует только когда canvas на экране.
// opts: cx, cy — центр кольца (доли); rx, ry — радиусы кольца (доли ширины/высоты); size — масштаб галактик; perNote — звёзд на заметку;
//       intro — звёзды разлетаются из центра; flashLabel — подпись темы, пока она вспыхивает.
window.GALAXY = (() => {
  const TAU = Math.PI * 2, sprites = {};
  const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
  function sprite(hex) {
    if (sprites[hex]) return sprites[hex];
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.16, rgba(hex, 1)); gr.addColorStop(.42, rgba(hex, .32)); gr.addColorStop(1, rgba(hex, 0));
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return (sprites[hex] = c);
  }
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);

  function mount(canvas, o = {}) {
    const ctx = canvas.getContext('2d'), F = window.FACTS || {}; if (!ctx || !F.colors) return null;
    const order = F.order, still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let W = 0, H = 0, cl = [], stars = [], links = [], born = [], flash = {}, labels = o.labels || {}, raf = 0, vis = false, t0 = 0, lastW = 0, lastH = 0;
    const total = order.reduce((s, n) => s + (F.counts[n] || 1), 0);

    function layout() {
      const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
      W = r.width; H = r.height; if (!W || !H) return;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const R = rng(7), cx = W * (o.cx ?? .5), cy = H * (o.cy ?? .5), rx = W * (o.rx ?? .38), ry = H * (o.ry ?? .34), m = Math.min(W, H);
      cl = order.map((n, i) => {
        const a = -Math.PI / 2 + (i + .5) / order.length * TAU, cnt = F.counts[n] || 1;
        return {n, hex: F.colors[n], x: cx + Math.cos(a) * rx, y: cy + Math.sin(a) * ry, rad: Math.max(m * .05, Math.sqrt(cnt / total) * m * (o.size ?? .34)), cnt};
      });
      stars = [];
      cl.forEach((c, ci) => {
        const k = Math.max(14, Math.round(c.cnt * (o.perNote ?? .2))), arms = 2 + ci % 2, twist = 2.4 + R(), rot = R() * TAU, dir = ci % 2 ? 1 : -1;
        for (let j = 0; j < k; j++) {
          const d = Math.pow(R(), .75), ang = rot + (j % arms) / arms * TAU + d * twist + (R() - .5) * .8 * (1 - d * .4);
          stars.push({c: ci, d: d * c.rad, ang, sp: (.04 + .14 * (1 - d)) * dir, s: (.6 + R() * 1.3) * (1 - d * .45) + (R() < .035 ? 1.4 : 0), ph: R() * TAU, tw: .6 + R() * 1.6});
        }
      });
      links = [];
      for (let i = 0; i < cl.length; i++) { links.push([i, (i + 1) % cl.length, R()]); if (i % 2 === 0) links.push([i, (i + 3) % cl.length, R()]); }
      if (still) draw(performance.now());
    }

    function bez(a, b, p) { // кривая через центр: мост между темами гнётся к ядру
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, kx = mx + (W * (o.cx ?? .5) - mx) * .45, ky = my + (H * (o.cy ?? .5) - my) * .45, q = 1 - p;
      return [q * q * a.x + 2 * q * p * kx + p * p * b.x, q * q * a.y + 2 * q * p * ky + p * p * b.y, kx, ky];
    }

    function draw(now) {
      const t = now / 1000, e = o.intro && !still ? ease((now - t0 - 250) / 1700) : 1;
      ctx.clearRect(0, 0, W, H); ctx.globalCompositeOperation = 'lighter';
      const C = W * (o.cx ?? .5), M = H * (o.cy ?? .5);
      const px = c => C + (c.x - C) * e, py = c => M + (c.y - M) * e;
      for (const c of cl) { // свечение ядра темы (+ вспышка)
        const f = flash[c.n] ? Math.max(0, 1 - (now - flash[c.n]) / 1800) : 0, x = px(c), y = py(c), r = c.rad * (1.5 + f * .9);
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, rgba(c.hex, .30 + f * .5)); g.addColorStop(.5, rgba(c.hex, .08 + f * .2)); g.addColorStop(1, rgba(c.hex, 0));
        ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
        if (f > 0) { ctx.strokeStyle = rgba(c.hex, f * .8); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, c.rad * (1.6 - f * .9), 0, TAU); ctx.stroke(); }
      }
      ctx.lineWidth = 1;
      for (const [i, j, ph] of links) { // мосты + импульс
        const a = {x: px(cl[i]), y: py(cl[i])}, b = {x: px(cl[j]), y: py(cl[j])}, k = bez(a, b, 0);
        ctx.strokeStyle = 'rgba(210,200,255,' + (.07 * e) + ')'; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(k[2], k[3], b.x, b.y); ctx.stroke();
        const p = (t * (.09 + ph * .08) + ph) % 1, [qx, qy] = bez(a, b, p), s = 10 * Math.sin(p * Math.PI) * e;
        if (s > .5) ctx.drawImage(sprite(p < .5 ? cl[i].hex : cl[j].hex), qx - s / 2, qy - s / 2, s, s);
      }
      for (const s of stars) {
        const c = cl[s.c], ang = s.ang + (still ? 0 : t * s.sp) + (1 - e) * 2.5, d = s.d * (.25 + .75 * e);
        const x = px(c) + Math.cos(ang) * d, y = py(c) + Math.sin(ang) * d * .82;
        const tw = still ? 1 : .55 + .45 * Math.sin(t * s.tw + s.ph), z = s.s * 5 * (.75 + .25 * tw);
        ctx.globalAlpha = (.35 + .65 * tw) * e; ctx.drawImage(sprite(c.hex), x - z / 2, y - z / 2, z, z);
      }
      ctx.globalAlpha = 1;
      for (const c of cl) { const z = c.rad * .55 * (.9 + .1 * Math.sin(t * 1.3 + c.x)); ctx.drawImage(sprite(c.hex), px(c) - z / 2, py(c) - z / 2, z, z); }
      for (const b of born) { // новые мысли: яркая звезда с кольцом, оседает в галактике
        const c = cl[b.c], age = (now - b.at) / 1000, ang = b.ang + age * .25, x = px(c) + Math.cos(ang) * b.d, y = py(c) + Math.sin(ang) * b.d * .82;
        const z = 16 + 14 * Math.max(0, 1 - age / 2.5); ctx.drawImage(sprite(c.hex), x - z / 2, y - z / 2, z, z);
        if (age < 2.5) { ctx.strokeStyle = rgba('#ffffff', .7 * (1 - age / 2.5)); ctx.beginPath(); ctx.arc(x, y, 6 + age * 14, 0, TAU); ctx.stroke(); }
      }
      ctx.globalCompositeOperation = 'source-over';
      for (const c of cl) { // подписи: вспыхнувшая тема (или все, если labels.all)
        const f = flash[c.n] ? Math.max(0, 1 - (now - flash[c.n]) / 2600) : 0, a = o.allLabels ? .85 : (o.flashLabel ? f : 0);
        if (a <= 0 || !labels[c.n]) continue;
        ctx.globalAlpha = a; ctx.font = '700 12px -apple-system,system-ui,sans-serif'; ctx.textAlign = 'center';
        ctx.fillStyle = '#0b0820'; const tx = labels[c.n] + (c.plus ? ' +' + c.plus : ''), w = ctx.measureText(tx).width + 14, ly = py(c) + c.rad * .5 + 16;
        ctx.beginPath(); ctx.roundRect ? ctx.roundRect(px(c) - w / 2, ly - 13, w, 20, 10) : ctx.rect(px(c) - w / 2, ly - 13, w, 20); ctx.fill();
        ctx.fillStyle = c.hex; ctx.fillText(tx, px(c), ly + 1);
      }
      ctx.globalAlpha = 1;
    }
    function loop(now) { draw(now); raf = vis ? requestAnimationFrame(loop) : 0; }
    function wake() { if (!raf && vis && !still) raf = requestAnimationFrame(loop); }

    const ro = new ResizeObserver(() => { const r = canvas.getBoundingClientRect(); if (Math.abs(r.width - lastW) > 1 || Math.abs(r.height - lastH) > 80) { lastW = r.width; lastH = r.height; layout(); } });
    ro.observe(canvas);
    new IntersectionObserver(es => { vis = es[0].isIntersecting; if (vis && !t0) t0 = performance.now(); wake(); if (still && vis) draw(performance.now()); }).observe(canvas);
    layout();

    const find = n => cl.findIndex(c => c.n === n);
    return {
      pos(n) { const c = cl[find(n)], r = canvas.getBoundingClientRect(); return c ? {x: r.left + c.x, y: r.top + c.y} : {x: r.left + W / 2, y: r.top + H / 2}; },
      flare(n) { flash[n] = performance.now(); if (still) draw(flash[n]); },
      add(n) {
        const i = find(n); if (i < 0) return; const c = cl[i];
        c.plus = (c.plus || 0) + 1; born.push({c: i, at: performance.now(), d: c.rad * (.3 + Math.random() * .5), ang: Math.random() * TAU});
        if (born.length > 24) born.shift(); this.flare(n);
      },
      setLabels(map) { labels = map || {}; if (still) draw(performance.now()); },
    };
  }
  return {mount};
})();
</script>
<script>// Страница питча: язык RU/EN и тексты из I18N с живыми числами FACTS, списки глав, появление блоков и счётчики,
// визитка (переворот, наклон), контакты (vCard, копирование, «поделиться»), подсветка главы в шапке. Демо — demos.js, интервью — pitch.js.
window.PAGE = (() => {
  const F = window.FACTS, I = window.I18N, $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const store = {get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }};
  const qs = new URLSearchParams(location.search);
  let L = ['ru', 'en'].includes(qs.get('lang')) ? qs.get('lang') : (store.get('nano-pitch-lang') === 'en' ? 'en' : 'ru');
  const t = () => I[L];
  const fmt = n => Number(n).toLocaleString(L === 'ru' ? 'ru-RU' : 'en-US');
  const tok = s => String(s).replace(/\{COMMITS\}/g, fmt(F.commits)).replace(/\{NOTES\}/g, fmt(F.notes)).replace(/\{LINKS\}/g, fmt(F.links)).replace(/\{DATE\}/g, F.date[L]);
  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const NUM = {'{COMMITS}': 'commits', '{NOTES}': 'notes', '{LINKS}': 'links'};

  let toastT = 0;
  function toast(msg) { const n = $('#toast'); n.textContent = msg; n.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => n.classList.remove('on'), 1800); }

  // ── списки глав (перерисовка на смене языка) ──
  function lists() {
    const T = t();
    $('#day').replaceChildren(...T.day.map(([tm, c, tx], i) => { const li = el('li', '', `<time>${tm}</time><i></i><span>${esc(tx)}</span>`); li.style.setProperty('--c', F.colors[c]); li.style.setProperty('--i', i); return li; }));
    $('#tiles').replaceChildren(...T.tiles.map(([v, lb], i) => {
      const d = el('div', 'tile'), key = NUM[v]; d.style.setProperty('--i', i);
      d.innerHTML = key ? `<b data-count="${F[key]}">${fmt(F[key])}</b>` : `<b>${esc(v)}</b>`; d.append(el('span', '', esc(lb))); return d;
    }));
    $('#legend').replaceChildren(...F.order.map(n => { const li = el('li', '', `<i></i>${esc(T.gal[n])}<em>${fmt(F.counts[n])}</em>`); li.style.setProperty('--c', F.colors[n]); return li; }));
    $('#awards').replaceChildren(...T.awards.map((a, i) => { const li = el('li', '', esc(a)); li.style.setProperty('--i', i); return li; }));
    $('#tiers').replaceChildren(...T.tiers.map(([n, p, s], i) => { const d = el('div', 'tier' + (i === 1 ? ' hot' : ''), `<b>${n}</b><strong>${p}</strong><span>${esc(s)}</span>`); d.style.setProperty('--i', i); return d; }));
    const PC = [F.colors.GREEN, F.colors.LIGHT_BLUE];
    $('#papers').replaceChildren(...T.papers.map((p, i) => { const d = el('article', 'paper', `<em>${esc(p.tag)}</em><b>${esc(p.t)}</b><p>${esc(p.d)}</p>`); d.style.setProperty('--c', PC[i % 2]); d.style.setProperty('--i', i); return d; }));
    const LC = ['rgba(196,166,255,.9)', 'rgba(249,168,212,.95)', 'rgba(253,224,71,.95)'], LH = ['24%', '56%', '94%'];
    $('#ladder').replaceChildren(...T.ladder.map(([a, b, v], i) => {
      const li = el('li', 'step' + (i === 0 ? ' now' : ''), `<strong>${v}</strong><b>${esc(a)}</b><small>${esc(b)}</small>`);
      li.style.setProperty('--c', LC[i]); li.style.setProperty('--h', LH[i]); return li;
    }));
    $('#funds').replaceChildren(...T.funds.map(f => el('li', '', esc(f))));
    $('#ceoF').replaceChildren(...T.ceoF.map(f => el('span', '', esc(f))));
  }

  function apply() {
    const T = t(), root = document.documentElement;
    root.lang = L; root.dataset.lang = L; document.title = T.docTitle;
    $$('[data-i]').forEach(n => { const v = T[n.dataset.i]; if (v != null) n.textContent = tok(v); });
    $$('[data-pl]').forEach(n => { n.textContent = T.pl[n.dataset.pl]; });
    $('#dropIn').placeholder = T.ph;
    $('#plPause').title = T.pl.pause; $('#plNext').title = T.pl.next; $('#plMute').title = T.pl.mute; $('#plStop').title = T.pl.stop;
    lists();
    const c = document.querySelector('.nc-pane'); // окно чата (ui.js) подписывается один раз — обновляем подписи сами
    if (c) { c.querySelector('.nc-s').textContent = T.chat.sub; c.querySelector('.nc-in').placeholder = T.chat.ph; }
    const fb = document.querySelector('.nc-fab-t'); if (fb) fb.textContent = T.chat.fab;
    if (window.GAL) { GAL.mini && GAL.mini.setLabels(T.gal); GAL.mini2 && GAL.mini2.setLabels(T.gal); }
    reveal(); document.dispatchEvent(new CustomEvent('pitch:lang', {detail: L}));
  }
  function setLang(l) { L = l; store.set('nano-pitch-lang', L); apply(); }

  // ── появление и счётчики ──
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function countUp(b) {
    const n = +b.dataset.count; if (!n || still) { b.textContent = fmt(n); return; }
    const t0 = performance.now(), dur = 1500;
    (function f(now) { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3); b.textContent = fmt(Math.round(n * e)); if (p < 1) requestAnimationFrame(f); })(t0);
  }
  const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return; e.target.classList.add('in'); io.unobserve(e.target); e.target.querySelectorAll('[data-count]').forEach(countUp);
  }), {threshold: .18}) : null;
  function reveal() {
    $$('.sec > *:not(.chaos), .duo, .chapter').forEach(n => {
      if (n.classList.contains('in')) { n.querySelectorAll('.tile, li, .tier, .paper').forEach(c => c.style.animation = 'none'); return; }
      n.classList.add('rv'); io ? io.observe(n) : n.classList.add('in');
    });
  }
  function onView(node, fn, thr = .5) { // один раз, когда блок виден на thr
    if (!('IntersectionObserver' in window)) return fn();
    const o = new IntersectionObserver(es => { if (es[0].isIntersecting) { o.disconnect(); fn(); } }, {threshold: thr}); o.observe(node);
  }

  // ── визитка: переворот, наклон за пальцем/мышью ──
  function card() {
    const c = $('#card'), front = c.querySelector('.front');
    $('#flipBtn').onclick = () => c.classList.add('flip'); $('#flipBack').onclick = () => c.classList.remove('flip');
    const tilt = (x, y) => { const r = c.getBoundingClientRect(); front.style.setProperty('--ry', ((x - r.left) / r.width - .5) * 10 + 'deg'); front.style.setProperty('--rx', -((y - r.top) / r.height - .5) * 8 + 'deg'); };
    c.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') tilt(e.clientX, e.clientY); });
    c.addEventListener('pointerleave', () => { front.style.setProperty('--rx', '0deg'); front.style.setProperty('--ry', '0deg'); });
    // на визитке своя кнопка «Спросить NANO» — круглая кнопка чата не налезает на карточку
    if ('IntersectionObserver' in window) new IntersectionObserver(es => document.body.classList.toggle('on-card', es[0].isIntersecting), {threshold: .25}).observe(c);
  }

  // ── контакты ──
  function contacts() {
    const vcf = /^https?:/.test(location.protocol) ? 'ildar.vcf' : 'data:text/vcard;charset=utf-8,' + encodeURIComponent(F.vcard);
    $$('[data-vcf]').forEach(a => { a.href = vcf; a.setAttribute('download', 'Ildar_Bayazitov.vcf'); });
    $$('[data-copy]').forEach(b => b.addEventListener('click', () => copy(b.dataset.copy).then(() => toast(t().copied + ' · WeChat ' + b.dataset.copy))));
    $('#shareBtn').onclick = () => {
      const url = location.protocol.startsWith('http') ? location.href.split('#')[0] : F.url;
      if (navigator.share) navigator.share({title: t().docTitle, text: t().role, url}).catch(() => {});
      else copy(url).then(() => toast(t().copied + ' · ' + url));
    };
  }
  function copy(s) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(s).catch(() => legacy(s));
    return Promise.resolve(legacy(s));
  }
  function legacy(s) { const a = el('textarea'); a.value = s; a.setAttribute('readonly', ''); a.style.cssText = 'position:fixed;opacity:0'; document.body.append(a); a.select(); try { document.execCommand('copy'); } catch (e) {} a.remove(); }

  // ── шапка: глава 1 / 2 ──
  function chapters() {
    const seg = $$('.seg a'), mark = $('.chapter');
    let tick = 0;
    const upd = () => { tick = 0; const two = mark.getBoundingClientRect().top < innerHeight * .45; seg.forEach(a => a.classList.toggle('on', (a.dataset.ch === '2') === two)); };
    addEventListener('scroll', () => { if (!tick) tick = requestAnimationFrame(upd); }, {passive: true}); upd();
    $('#lang').onclick = () => setLang(L === 'ru' ? 'en' : 'ru');
  }

  window.showCard = id => { const n = document.getElementById(id); if (n) n.scrollIntoView({behavior: 'smooth', block: 'start'}); };

  function init() {
    if (window.COSMOS) COSMOS.mount($('#cosmos'), {density: .8, parallax: 8});
    if (window.GALAXY) window.GAL = {
      hero: GALAXY.mount($('#galaxy'), {cx: .5, cy: .27, rx: .47, ry: .2, size: .36, perNote: .3, intro: true}),
      mini: GALAXY.mount($('#mini'), {cx: .5, cy: .56, rx: .39, ry: .3, size: .32, perNote: .12, flashLabel: true}),
      mini2: GALAXY.mount($('#mini2'), {cx: .5, cy: .5, rx: .38, ry: .34, size: .34, perNote: .14, flashLabel: true}),
    };
    apply(); card(); contacts(); chapters();
    setTimeout(() => { const n = $('#intro'); if (n) n.remove(); }, 1700);
  }
  return {init, t, L: () => L, tok, fmt, toast, onView, store, el, esc};
})();
PAGE.init();
</script>
<script>// Живые демо глав: хаос приложений → один шар, «бросить мысль» в галактику, очередь «Одобрить», тест Teacher и гонка, сделка.
// Каждое демо работает от пальца и само по себе при прокрутке; pitch.js зовёт DEMOS[act]() во время интервью.
window.DEMOS = (() => {
  const P = window.PAGE, F = window.FACTS, $ = s => document.querySelector(s), el = P.el, esc = P.esc;
  const later = (fn, ms) => setTimeout(fn, ms);

  // ── 1 · хаос приложений ──
  const SPOTS = [[18, 16], [62, 12], [86, 34], [30, 40], [74, 58], [12, 66], [50, 86], [88, 82], [40, 64], [56, 36]];
  const BADGE = [12, 3, 48, 7, 99, 5, 21, 2, 16, 9], HUES = ['#ef4444', '#22c55e', '#fde047', '#3b5bdb', '#7dd3fc', '#f9a8d4', '#fb923c', '#b57cf5', '#e2e8f0', '#22c55e'];
  function chaos() {
    const box = $('#chaos'), orb = box.querySelector('.orb');
    box.querySelectorAll('.app').forEach(n => n.remove());
    P.t().apps.forEach((a, i) => {
      const n = el('span', 'app', `<b></b>${esc(a)}<i>${BADGE[i]}</i>`);
      n.style.cssText = `left:${SPOTS[i][0]}%;top:${SPOTS[i][1]}%;--rot:${(i % 3 - 1) * 6}deg;--d:${-i * .37}s;--c:${HUES[i]}`;
      box.insertBefore(n, orb);
    });
  }
  function pain() { $('#chaos').classList.add('merge'); }
  $('#chaos').addEventListener('click', () => $('#chaos').classList.toggle('merge'));
  P.onView($('#chaos'), () => later(pain, 1400), .6);

  // ── 2 · бросить мысль в мозг ──
  const GUESS = [
    [/деньг|бизнес|работ|зарплат|кофе|money|business|job|salary|startup|стартап|инвест/i, 'LIGHT_RED'],
    [/встреч|звон|партн|созвон|клиент|команд|call|meet|partner|client|team|boss/i, 'RED'],
    [/стать|наук|исслед|учеб|лекц|книг|article|science|research|study|book|paper|медиц/i, 'GREEN'],
    [/\bии\b|\bai\b|код|code|python|нейро|gpt|claude|агент|agent/i, 'BLUE'],
    [/этик|закон|прав|ethic|law|rights|privacy/i, 'LIGHT_BLUE'],
    [/стиль|одежд|образ|style|outfit|design|дизайн/i, 'PINK'],
  ];
  const guess = s => (GUESS.find(([re]) => re.test(s)) || [0, 'TEAL'])[1];
  let sayT = 0;
  function say(html) { const n = $('#dropSay'); n.innerHTML = html; n.classList.add('on'); clearTimeout(sayT); sayT = later(() => n.classList.remove('on'), 5200); }
  function fly(from, text, g, answer) {
    const r = from.getBoundingClientRect(), to = GAL.mini.pos(g), n = el('span', 'fly', esc(text));
    n.style.cssText = `left:${r.left}px;top:${r.top}px;--c:${F.colors[g]}`; document.body.append(n);
    requestAnimationFrame(() => requestAnimationFrame(() => { n.style.left = to.x - 20 + 'px'; n.style.top = to.y - 14 + 'px'; n.style.transform = 'scale(.2)'; n.style.opacity = '.2'; }));
    later(() => { n.remove(); GAL.mini.add(g); say(`<b>NANO:</b> ${esc(answer)}`); }, 920);
  }
  function chips() {
    const box = $('#dropChips'); box.replaceChildren();
    P.t().drops.forEach((d, i) => {
      const c = el('button', 'chip', `<i></i>${esc(d.t)}`); c.type = 'button'; c.style.setProperty('--c', F.colors[d.g]);
      c.onclick = () => fly(c, d.t, d.g, d.a); box.append(c);
    });
  }
  $('#dropForm').addEventListener('submit', e => {
    e.preventDefault(); const inp = $('#dropIn'), s = inp.value.trim(); if (!s) return;
    const g = guess(s); fly(inp, s.slice(0, 40), g, P.t().dropAny.replace('{g}', P.t().gal[g])); inp.value = ''; inp.blur();
  });
  function drop(i = 0) { const c = $('#dropChips').children[i]; if (c) c.click(); }

  // ── 3 · CEO: очередь «Одобрить» ──
  let saved = 0;
  function dur(m) { const T = P.t(); return m < 60 ? `${m} ${T.min}` : `${Math.floor(m / 60)} ${T.hr} ${m % 60 ? (m % 60) + ' ' + T.min : ''}`.trim(); }
  function queue() {
    const T = P.t(), list = $('#qList'); saved = 0; $('#qSaved').textContent = dur(0); list.replaceChildren();
    T.queue.forEach(q => {
      const it = el('div', 'qi', `<div class="tx"><b>${esc(q.t)}</b><small>${esc(q.m)}</small></div>`), b = el('button', 'btn', esc(T.approve)); b.type = 'button';
      b.onclick = () => {
        if (it.classList.contains('ok')) return; it.classList.add('ok'); saved += q.min; $('#qSaved').textContent = dur(saved);
        if (!list.querySelector('.qi:not(.ok)')) later(() => { const d = el('div', 'q-done', esc(T.queueDone)); d.onclick = queue; list.append(d); }, 650);
      };
      it.append(b); list.append(it);
    });
  }
  function approve() { [...document.querySelectorAll('#qList .qi:not(.ok) .btn')].forEach((b, i) => later(() => b.click(), 500 + i * 900)); }

  // ── 4 · Teacher: тест по уровням + гонка презентации ──
  function quiz() {
    const T = P.t(), lv = $('#lv'), qa = $('#qa');
    lv.replaceChildren(...T.levels.map((l, i) => { const li = el('li', i === 0 ? 'on' : '', esc(l)); li.dataset.n = i + 1; return li; }));
    $('#qr').textContent = '';
    qa.replaceChildren(...T.quizA.map((a, i) => {
      const b = el('button', '', esc(a)); b.type = 'button';
      b.onclick = () => {
        qa.querySelectorAll('button').forEach(x => x.classList.remove('yes', 'no'));
        if (i === T.quizOk) { b.classList.add('yes'); lv.children[1].classList.add('on'); $('#qr').textContent = T.quizYes; }
        else { b.classList.add('no'); $('#qr').textContent = T.quizNo; later(() => qa.children[T.quizOk].classList.add('yes'), 700); }
      };
      return b;
    }));
  }
  function race() { const r = $('#race'); r.classList.remove('go'); void r.offsetWidth; r.classList.add('go'); }
  P.onView($('#race'), race, .6);
  function teach() { race(); later(() => { const b = $('#qa').children[P.t().quizOk]; if (b) b.click(); }, 1600); }

  // ── 5 · цифры: счётчики заново + галактики вспыхивают по очереди ──
  let cycle = 0;
  function galCycle() { if (cycle) return; let i = 0; cycle = setInterval(() => { GAL.mini2.flare(F.order[i++ % F.order.length]); }, 1500); }
  P.onView($('#mini2'), galCycle, .3);
  function count() {
    document.querySelectorAll('#tiles [data-count], .duo [data-count]').forEach(b => { const n = +b.dataset.count, t0 = performance.now();
      (function f(now) { const p = Math.min(1, (now - t0) / 1600); b.textContent = P.fmt(Math.round(n * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(f); })(t0); });
    galCycle();
  }

  // ── 6 · сделка: сумма набегает, лестница оценок растёт, линия взлетает ──
  function ask() {
    const s = $('#askSum'), goal = 300000, t0 = performance.now();
    ['#ladder', '#rocket'].forEach(q => { const n = $(q); n.classList.remove('go'); void n.offsetWidth; n.classList.add('go'); });
    (function f(now) { const p = Math.min(1, (now - t0) / 1800), v = Math.round(goal * (1 - Math.pow(1 - p, 4)) / 1000) * 1000; s.textContent = '$' + P.fmt(v); if (p < 1) requestAnimationFrame(f); else s.textContent = P.t().askSum; })(t0);
  }
  P.onView($('.deal'), ask, .5);

  function build() { chaos(); chips(); queue(); quiz(); }
  document.addEventListener('pitch:lang', build); build();
  return {pain, drop, approve, quiz: teach, count, ask, reset: build};
})();
</script>
<script>// Интервью-питч на 4 минуты: док снизу — вопрос инвестора и ответ NANO субтитрами по фразам, голосом (speechSynthesis).
// Страница сама едет к блоку, демо оживает (DEMOS[act]). iOS: первая фраза звучит прямо в нажатии, дальше — цепочкой по onend
// со страховочным таймером; без голоса (или «звук выкл.») субтитры идут по времени чтения.
(() => {
  const P = window.PAGE, D = window.DEMOS, $ = s => document.querySelector(s);
  const dock = $('#dock'), qEl = $('#plQ'), aEl = $('#plA'), prog = $('#prog'), TTS = window.speechSynthesis;
  const FOCUS = {hero: null, pain: '#chaos', home: '.dropbox', ceo: '#queue', teacher: '#quiz', life: '#day', wins: '#tiles', products: '#products h2', ask: '.deal'};
  const VOICE = {ru: /milena|katya|alena|svetlana|dariya|ekaterina|irina|female/i, en: /samantha|ava|allison|susan|karen|moira|tessa|jenny|aria|zira|female/i};
  let on = false, paused = false, mute = P.store.get('nano-pitch-mute') === '1', i = 0, k = 0, parts = [], token = 0, timer = 0, actT = 0, t0 = 0, est = 1, raf = 0, lock = null;

  const steps = () => P.t().steps;
  const split = s => (P.tok(s).match(/[^.!?…]+[.!?…]+[»"]?|\S[^.!?…]*$/g) || [s]).map(x => x.trim()).filter(Boolean);
  const readMs = s => Math.max(1800, s.length * (P.L() === 'ru' ? 68 : 60));

  function bars() { prog.replaceChildren(...steps().map((_, j) => { const b = document.createElement('i'); if (j < i) b.className = 'done'; if (j === i) b.className = 'cur'; return b; })); }
  function frame() {
    const cur = prog.children[i]; if (cur) cur.style.setProperty('--p', Math.min(1, (k + Math.min(1, (performance.now() - t0) / est)) / parts.length).toFixed(3));
    raf = on && !paused ? requestAnimationFrame(frame) : 0;
  }
  function focusSec(sec) {
    if (sec === 'hero') { scrollToY(0); return; }
    const n = $(FOCUS[sec] || '#' + sec) || document.getElementById(sec); if (!n) return;
    const top = parseFloat(getComputedStyle(document.documentElement).scrollPaddingTop) || 60, room = innerHeight - dock.offsetHeight - top - 16, r = n.getBoundingClientRect();
    const y = scrollY + r.top - top - Math.max(8, (room - r.height) / 2);
    scrollToY(Math.max(0, y));
  }
  function scrollToY(y) { try { window.scrollTo({top: y, behavior: 'smooth'}); } catch (e) { window.scrollTo(0, y); } }

  function voice(l) { const vs = TTS ? TTS.getVoices().filter(v => v.lang.toLowerCase().startsWith(l)) : []; return vs.find(v => VOICE[l].test(v.name)) || vs[0] || null; }
  function speak(text, done) {
    const my = ++token; clearTimeout(timer); est = readMs(text); t0 = performance.now();
    const next = () => { if (my !== token) return; clearTimeout(timer); done(); };
    if (mute || !TTS) { timer = setTimeout(next, est); return; }
    TTS.cancel();
    const u = new SpeechSynthesisUtterance(text), l = P.L();
    u.lang = l === 'en' ? 'en-US' : 'ru-RU'; u.rate = l === 'en' ? 1.02 : 1.06; u.pitch = 1.08; u.voice = voice(l);
    // голос молча упал или кончился мгновенно (нет голоса в системе) — субтитр всё равно держится не меньше 60 % времени чтения
    const after = () => { if (my !== token) return; clearTimeout(timer); timer = setTimeout(next, Math.max(260, est * .6 - (performance.now() - t0))); };
    u.onend = after; u.onerror = after;
    TTS.speak(u);
    timer = setTimeout(next, est * 1.9 + 2500); // iOS иногда не присылает onend
  }

  function line() {
    if (k >= parts.length) { timer = setTimeout(() => go(i + 1), 700); return; }
    aEl.textContent = parts[k]; aEl.scrollTop = 0;
    speak(parts[k], () => { k++; line(); });
  }
  function go(j) {
    clearTimeout(actT); const S = steps();
    if (j >= S.length) return end();
    i = j; k = 0; const s = S[i]; parts = split(s.a);
    qEl.textContent = s.q; aEl.textContent = ''; bars(); focusSec(s.sec);
    if (s.act && D[s.act]) actT = setTimeout(() => D[s.act](), s.act === 'ask' ? 600 : 1200);
    line(); if (!raf) raf = requestAnimationFrame(frame);
  }
  function end() {
    token++; clearTimeout(timer); i = steps().length; bars();
    qEl.textContent = ''; aEl.textContent = P.t().pl.end; dock.classList.remove('talk');
    if (!mute && TTS) { TTS.cancel(); const u = new SpeechSynthesisUtterance(P.t().pl.end); u.lang = P.L() === 'en' ? 'en-US' : 'ru-RU'; u.voice = voice(P.L()); TTS.speak(u); }
    setTimeout(() => { if (on) document.getElementById('contact').scrollIntoView({behavior: 'smooth'}); }, 2600);
  }

  function start() {
    on = true; paused = false; document.body.classList.add('pitching'); dock.classList.add('on', 'talk'); dock.setAttribute('aria-hidden', 'false');
    icons(); try { navigator.wakeLock && navigator.wakeLock.request('screen').then(w => lock = w).catch(() => {}); } catch (e) {}
    go(0);
  }
  function stop() {
    on = false; token++; clearTimeout(timer); clearTimeout(actT); if (TTS) TTS.cancel();
    document.body.classList.remove('pitching'); dock.classList.remove('on', 'talk'); dock.setAttribute('aria-hidden', 'true');
    if (lock) { lock.release().catch(() => {}); lock = null; }
  }
  function pause(v) {
    if (!on) return; paused = v; icons(); dock.classList.toggle('talk', !v);
    if (v) { token++; clearTimeout(timer); clearTimeout(actT); if (TTS) TTS.cancel(); }
    else if (i >= steps().length) go(0); else { line(); raf = requestAnimationFrame(frame); }
  }
  const PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>', PAUSE = '<svg viewBox="0 0 24 24"><path d="M8 5h3v14H8zM13 5h3v14h-3z"/></svg>';
  function icons() { $('#plPause').innerHTML = paused ? PLAY : PAUSE; $('#plPause').title = paused ? P.t().pl.play : P.t().pl.pause; $('#plMute').classList.toggle('off', mute); }

  $('#pitchGo').addEventListener('click', start);
  $('#plStop').onclick = stop;
  $('#plPause').onclick = () => pause(!paused);
  $('#plNext').onclick = () => { if (!on) return; paused = false; icons(); dock.classList.add('talk'); token++; if (TTS) TTS.cancel(); go(i + 1); };
  $('#plMute').onclick = () => { mute = !mute; P.store.set('nano-pitch-mute', mute ? '1' : '0'); icons(); if (on && !paused) { token++; if (TTS) TTS.cancel(); line(); } };
  $('#plAsk').addEventListener('click', () => pause(true));
  document.addEventListener('pitch:lang', () => { if (on && !paused && i < steps().length) { token++; if (TTS) TTS.cancel(); go(i); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden && on && !paused) pause(true); });
  if (TTS && TTS.onvoiceschanged !== undefined) TTS.onvoiceschanged = () => {};
  window.PITCH = {start, stop, go: j => { if (!on) start(); go(j); }, pause};
})();
</script>
<script>// Мозг офлайн-NANO: вопрос → намерение из базы знаний (kb.json). Чистые функции без DOM; тест — tests/brain.test.js.
// Счёт намерения = сумма длин совпавших ключей: длинный точный ключ («сколько стоит») сильнее короткого («цен»).
(function (root) {
  const norm = s => ' ' + String(s).toLowerCase().replace(/ё/g, 'е').replace(/[!?.,;:«»"()]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';

  function match(kb, text) {
    const t = norm(text); let best = null, score = 0;
    for (const it of kb.intents) {
      let s = 0;
      for (const k of it.keys) if (t.includes(norm(k).slice(k.startsWith(' ') ? 0 : 1, k.endsWith(' ') ? undefined : -1))) s += k.trim().length;
      if (s > score) { score = s; best = it; }
    }
    return best || kb.fallback;
  }

  function reply(kb, text, lang) {
    const it = match(kb, text), l = lang === 'en' ? 'en' : 'ru';
    return {id: it.id, text: it[l] || it.ru, card: it.card || null, go: it.go || null, chips: (it.chips || kb.chips).map(c => c[l] || c.ru)};
  }

  const api = {norm, match, reply};
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.NANO_BRAIN = api;
})(this);
</script>
<script>// Окно разговора с NANO: кнопка-аватар, лента, подсказки, голос (распознавание + озвучка). Ответы — NANO_BRAIN по NANO_KB.
// Хост-страница даёт window.showCard(id), .nano (портрет) и window.OPEN_CHAT (ссылка #b2b-chat). Кнопки [data-chat] открывают окно.
(function () {
  const KB = window.NANO_KB, BRAIN = window.NANO_BRAIN; if (!KB || !BRAIN) return;
  const lang = () => (document.documentElement.dataset.lang === 'en' ? 'en' : 'ru');
  const T = {
    ru: {title: 'NANO', sub: 'офлайн · отвечаю голосом', ph: 'Спросите NANO…', fab: 'Поговорить с NANO', listen: 'Слушаю…', mic: 'Говорить', send: 'Отправить', snd: 'Звук', close: 'Закрыть'},
    en: {title: 'NANO', sub: 'offline · I can talk', ph: 'Ask NANO…', fab: 'Talk to NANO', listen: 'Listening…', mic: 'Speak', send: 'Send', snd: 'Sound', close: 'Close'},
  };
  const ICON = {
    mic: '<svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0M12 17v4m-3 0h6"/></svg>',
    send: '<svg viewBox="0 0 24 24"><path d="M4 12 20 4l-6 16-3-7-7-1Z"/></svg>',
    snd: '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Zm12 0a4 4 0 0 1 0 6m2-9a8 8 0 0 1 0 12"/></svg>',
    x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  };
  const store = {get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }};
  const hero = (document.querySelector('.nano') || {}).src || '';
  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };

  const fab = el('button', 'nc-fab'); fab.innerHTML = `<span class="nc-ava"></span><span class="nc-fab-t"></span>`;
  const pane = el('section', 'nc-pane'); pane.setAttribute('aria-hidden', 'true');
  pane.innerHTML = `<header class="nc-head"><span class="nc-ava"></span><div><b class="nc-t"></b><small class="nc-s"></small></div>
    <button class="nc-ib nc-snd">${ICON.snd}</button><button class="nc-ib nc-x">${ICON.x}</button></header>
    <div class="nc-log" role="log" aria-live="polite"></div><div class="nc-chips"></div>
    <form class="nc-form"><input class="nc-in" autocomplete="off"><button type="button" class="nc-ib nc-mic">${ICON.mic}</button><button class="nc-ib nc-go">${ICON.send}</button></form>`;
  document.body.append(fab, pane);
  document.querySelectorAll('.nc-ava').forEach(a => a.style.backgroundImage = `url("${hero}")`);
  const $ = s => pane.querySelector(s), log = $('.nc-log'), chips = $('.nc-chips'), input = $('.nc-in');

  let speak = store.get('nano-chat-sound') !== '0', started = false;
  function labels() {
    const t = T[lang()]; fab.querySelector('.nc-fab-t').textContent = t.fab; fab.title = t.fab;
    $('.nc-t').textContent = t.title; $('.nc-s').textContent = t.sub; input.placeholder = t.ph;
    $('.nc-mic').title = t.mic; $('.nc-go').title = t.send; $('.nc-snd').title = t.snd; $('.nc-x').title = t.close;
    $('.nc-snd').classList.toggle('off', !speak);
  }
  new MutationObserver(labels).observe(document.documentElement, {attributes: true, attributeFilter: ['data-lang']});

  function bubble(text, who) { const b = el('div', 'nc-msg ' + who); b.textContent = text; log.append(b); log.scrollTop = log.scrollHeight; return b; }
  function setChips(list) {
    chips.innerHTML = '';
    list.forEach(q => { const c = el('button', 'nc-chip'); c.type = 'button'; c.textContent = q; c.onclick = () => ask(q); chips.append(c); });
  }
  function say(text) {
    if (!speak || !window.speechSynthesis) return;
    speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text), l = lang() === 'en' ? 'en' : 'ru';
    u.lang = l === 'en' ? 'en-US' : 'ru-RU'; u.rate = 1.03; u.pitch = 1.1;
    const vs = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith(l));
    u.voice = vs.find(v => /svetlana|dariya|ekaterina|irina|aria|jenny|ava|female|zira/i.test(v.name)) || vs[0] || null;
    speechSynthesis.speak(u);
  }
  function answer(r) {
    const dots = bubble('', 'bot typing'); dots.innerHTML = '<i></i><i></i><i></i>';
    setTimeout(() => {
      dots.classList.remove('typing'); dots.textContent = r.text; log.scrollTop = log.scrollHeight; setChips(r.chips); say(r.text);
      if (r.card && window.showCard) window.showCard(r.card);
      if (r.go) setTimeout(() => { const g = document.querySelector(r.go); if (g) { g.scrollIntoView({behavior: 'smooth', block: 'center'}); g.classList.add('nc-flash'); setTimeout(() => g.classList.remove('nc-flash'), 1600); } }, 350);
    }, 420 + Math.min(700, r.text.length * 4));
  }
  function ask(q) { q = String(q).trim(); if (!q) return; bubble(q, 'me'); input.value = ''; answer(BRAIN.reply(KB, q, lang())); }

  function open(v) {
    pane.classList.toggle('on', v); pane.setAttribute('aria-hidden', String(!v)); fab.classList.toggle('hide', v);
    if (v && !started) { started = true; const w = KB.welcome[lang()]; bubble(w, 'bot'); setChips(KB.chips.map(c => c[lang()])); say(w); }
    if (v) setTimeout(() => input.focus({preventScroll: true}), 250); else if (window.speechSynthesis) speechSynthesis.cancel();
  }
  fab.onclick = () => open(true); $('.nc-x').onclick = () => open(false);
  document.querySelectorAll('[data-chat]').forEach(b => b.addEventListener('click', () => open(true)));
  $('.nc-form').onsubmit = e => { e.preventDefault(); ask(input.value); };
  $('.nc-snd').onclick = () => { speak = !speak; store.set('nano-chat-sound', speak ? '1' : '0'); labels(); if (!speak && window.speechSynthesis) speechSynthesis.cancel(); };
  addEventListener('keydown', e => { if (e.key === 'Escape' && pane.classList.contains('on')) open(false); });

  // голос: распознавание речи (Chrome/Edge); нет поддержки — кнопка микрофона скрыта
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition, mic = $('.nc-mic');
  if (!SR) mic.remove();
  else {
    let rec = null;
    mic.onclick = () => {
      if (rec) { rec.stop(); return; }
      rec = new SR(); rec.lang = lang() === 'en' ? 'en-US' : 'ru-RU'; rec.interimResults = true;
      mic.classList.add('rec'); input.placeholder = T[lang()].listen; if (!speak) { speak = true; labels(); }
      rec.onresult = e => { const r = e.results[e.results.length - 1]; input.value = r[0].transcript; if (r.isFinal) ask(input.value); };
      rec.onend = rec.onerror = () => { rec = null; mic.classList.remove('rec'); input.placeholder = T[lang()].ph; };
      rec.start();
    };
  }
  labels();
  if (window.OPEN_CHAT) open(true);
})();
</script>
</body>
</html>
