<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NANO — Ildar Bayazitov</title>
<meta name="description" content="Ildar Bayazitov — AI-agent systems. NANO, a second brain of 2,384 notes in 8 departments, on one screen.">
<meta name="theme-color" content="#07061a">
<meta property="og:type" content="website">
<meta property="og:title" content="NANO — Ildar Bayazitov">
<meta property="og:description" content="A second brain in 8 departments — touch a star to meet it.">
<meta property="og:image" content="https://matr457.github.io/jarvis-card/card/assets/og.jpg">
<meta property="og:url" content="https://matr457.github.io/jarvis-card/card/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700;800&display=swap">
<link rel="preload" as="image" href="assets/hero.webp" media="(min-width:761px)">
<link rel="preload" as="image" href="assets/hero-m.webp" media="(max-width:760px)">
<style>/* Визитка NANO — финал 1. Один тёмный образ (космос), color-scheme: dark. Цвета — только из токенов :root. */
:root{
  --bg:#06051a; --ink:#f5f2ff; --ink2:#cbc3ef; --ink3:#9d95c6; --on-ink:#140d38;
  --line:rgba(255,255,255,.11); --line2:rgba(255,255,255,.22); --glass:rgba(20,16,48,.58); --glass-hi:rgba(255,255,255,.07);
  --sheet:rgba(16,12,40,.8); --fill:rgba(255,255,255,.05); --fill2:rgba(255,255,255,.1); --scrim:rgba(6,5,26,.62);
  --accent:#c3adff; --core:#7c4dff; --dep:#c3adff; --depGlow:rgba(124,77,255,.38);
  --tree:#9b7bf7; --words:#ec4899; --flat:#bf8418;
  --heroH:min(100dvh,1120px); --heroW:calc(var(--heroH)*.586); --gut:max(24px,3vw); --bar:56px;
  --fD:"Manrope","Inter",system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --fT:"Inter",system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--fT);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- сцена ---------- */
#sky{position:fixed;inset:0;width:100%;height:100%;display:block}
.glow{position:fixed;right:calc(var(--heroW)*.05);bottom:-12vh;width:calc(var(--heroW)*1.15);height:92vh;pointer-events:none;
  background:radial-gradient(closest-side,var(--depGlow),transparent 72%);filter:blur(34px);transition:background .9s}
.stage{pointer-events:none}
.stage>*{pointer-events:auto}
.stage>.hero{pointer-events:none}
.hero{position:fixed;right:max(1.5vw,16px);bottom:0;height:var(--heroH);width:var(--heroW);z-index:2;display:block}
.hero img{display:block;width:100%;height:100%;object-fit:contain;object-position:50% 100%;
  -webkit-mask-image:linear-gradient(to top,transparent 0,#000 10%);mask-image:linear-gradient(to top,transparent 0,#000 10%);
  filter:drop-shadow(0 0 30px var(--depGlow));transform-origin:50% 100%;will-change:transform;animation:float 8s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}

/* ---------- верхняя полоса (прячет обрез берета) ---------- */
.top{position:fixed;left:0;right:0;top:0;z-index:5;height:calc(var(--bar) + env(safe-area-inset-top,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:env(safe-area-inset-top,0px) max(var(--gut),env(safe-area-inset-right,0px)) 0 max(var(--gut),env(safe-area-inset-left,0px));
  background:rgba(6,5,26,.42);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:800 15px/1 var(--fD);letter-spacing:.16em;text-decoration:none}
.brand img{width:26px;height:26px;border-radius:8px}
.brand small{font:500 12px/1 var(--fT);letter-spacing:.02em;color:var(--ink3)}
.acts{display:flex;align-items:center;gap:8px}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--fill);border:1px solid var(--line)}
.seg button{padding:6px 11px;border-radius:999px;font:600 12px/1 var(--fT);color:var(--ink3);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--fill2);color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font:600 13px/1 var(--fT);background:var(--ink);color:var(--on-ink);text-decoration:none;transition:transform .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--fill);color:var(--ink);border:1px solid var(--line)}

/* ---------- кто я ---------- */
.id{position:fixed;left:max(var(--gut),env(safe-area-inset-left,0px));top:calc(var(--bar) + env(safe-area-inset-top,0px) + clamp(28px,6vh,72px));
  max-width:min(540px,36vw);z-index:3;transition:opacity .35s,transform .35s}
.id::before{content:"";position:absolute;inset:-90px -140px -70px -160px;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,var(--scrim),transparent)}
.eyebrow{font:600 12px/1.2 var(--fT);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{margin:14px 0 12px;font:800 clamp(36px,4.1vw,62px)/1.02 var(--fD);letter-spacing:-.028em;text-wrap:balance}
.role{margin:0;max-width:34ch;font:400 clamp(15px,1.2vw,19px)/1.5 var(--fT);color:var(--ink2);text-wrap:pretty}
.stats{display:flex;gap:26px;margin-top:22px}
.stat b{display:block;font:700 24px/1 var(--fD);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:6px;font-size:12px;color:var(--ink3)}
.quest{margin-top:24px;display:inline-flex;align-items:center;gap:12px;padding:9px 16px 9px 12px;border-radius:999px;
  background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);font-size:13px;color:var(--ink2)}
.dots{display:flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--fill2);transition:background .5s,box-shadow .5s}
.dots i.on{background:var(--c);box-shadow:0 0 10px var(--c)}
.quest b{color:var(--ink);font-variant-numeric:tabular-nums}
body.has-panel .id{opacity:0;transform:translateX(-12px);pointer-events:none}

/* ---------- подписи департаментов на галактике ---------- */
.labels{position:fixed;inset:0;z-index:1;pointer-events:none;will-change:transform}
.lab{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px;pointer-events:auto;
  transform:translate(-50%,-50%);transition:opacity .45s}
.lab .who,.lab .n{text-shadow:0 0 3px #07051a,0 0 8px #07051a,0 0 14px rgba(7,5,26,.9)}
.lab .who{font:700 10px/1 var(--fT);letter-spacing:.2em;text-transform:uppercase;color:var(--c)}
.lab .nm{padding:6px 12px;border-radius:999px;white-space:nowrap;font:600 13px/1.1 var(--fD);
  background:rgba(8,6,28,.6);border:1px solid var(--line2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .3s,box-shadow .3s}
.lab .n{font:500 11px/1 var(--fT);color:var(--ink3);font-variant-numeric:tabular-nums}
.lab:hover .nm,.lab.on .nm{background:rgba(20,14,56,.85);border-color:var(--c);box-shadow:0 0 22px -4px var(--c)}
.lab.met .who::after{content:" ✓"}
.lab.dim{opacity:.42}
.lab.core .nm{font-size:14px;letter-spacing:.14em}

/* ---------- реплика NANO (визуальная новелла) ---------- */
.dlg{position:fixed;z-index:4;right:calc(var(--heroW) + max(1.5vw,16px) - 56px);bottom:clamp(88px,13vh,150px);width:min(420px,29vw);
  padding:18px 20px 16px;border-radius:22px;background:var(--glass);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);box-shadow:inset 0 1px 0 var(--glass-hi),0 24px 70px rgba(0,0,0,.4)}
.tag{display:flex;align-items:center;gap:8px;font:700 11px/1 var(--fT);letter-spacing:.2em;text-transform:uppercase;color:var(--dep);transition:color .6s}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--dep);box-shadow:0 0 10px var(--dep);transition:background .6s,box-shadow .6s}
.tag span{margin-left:auto;letter-spacing:.06em;color:var(--ink3);font-weight:600}
.say{margin:10px 0 14px;min-height:4.5em;font:400 16px/1.5 var(--fT);color:var(--ink);cursor:default}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--fill);font:500 13px/1 var(--fT);transition:background .2s,border-color .2s}
.choices button:hover{background:var(--fill2);border-color:var(--line2)}
.choices button.pri{background:var(--ink);color:var(--on-ink);border-color:transparent}

/* ---------- чипы департаментов (телефон) ---------- */
.chips{display:none}

/* ---------- док ---------- */
.dock{position:fixed;z-index:5;left:max(var(--gut),env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));
  display:flex;gap:2px;padding:6px;border-radius:20px;background:var(--glass);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);box-shadow:inset 0 1px 0 var(--glass-hi)}
.dock button{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:66px;padding:8px 10px 7px;border-radius:14px;
  font:500 11px/1 var(--fT);color:var(--ink3);transition:background .2s,color .2s}
.dock svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dock button:hover,.dock button[aria-expanded="true"]{background:var(--fill2);color:var(--ink)}

/* ---------- панель (слева на ПК, снизу на телефоне) ---------- */
.panel{position:fixed;z-index:6;left:max(var(--gut),env(safe-area-inset-left,0px));top:calc(var(--bar) + env(safe-area-inset-top,0px) + 20px);
  bottom:calc(104px + env(safe-area-inset-bottom,0px));width:min(470px,36vw);display:flex;flex-direction:column;border-radius:24px;
  background:var(--sheet);border:1px solid var(--line);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);
  box-shadow:inset 0 1px 0 var(--glass-hi),0 30px 90px rgba(0,0,0,.5);opacity:0;visibility:hidden;transform:translateY(12px) scale(.985);
  transition:opacity .28s,transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.panel.open{opacity:1;visibility:visible;transform:none;transition:opacity .28s,transform .32s cubic-bezier(.2,.8,.2,1)}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 22px 10px}
.panel h2{margin:0;font:700 21px/1.2 var(--fD);letter-spacing:-.012em;text-wrap:balance}
.x{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--fill2);color:var(--ink2)}
.x svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.pb{flex:1;overflow:auto;padding:4px 22px 24px;overscroll-behavior:contain;scrollbar-width:thin}
.lead{margin:0 0 18px;color:var(--ink2);font-size:14px;line-height:1.55;text-wrap:pretty}
.sec{margin-top:24px}
.sec h3{margin:0 0 12px;font:600 11px/1.3 var(--fT);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{padding:14px 12px 13px;border-radius:16px;background:var(--fill);border:1px solid var(--line)}
.tile b{display:block;font:800 28px/1 var(--fD);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile span{display:block;margin-top:9px;font-size:12px;line-height:1.4;color:var(--ink2)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font:500 9px var(--fT);fill:var(--ink3)}
.chart .dl{font:600 9.5px var(--fT);fill:var(--ink2)}
.chart .hit{cursor:crosshair}
.ctip{position:absolute;left:0;top:0;padding:7px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line2);font-size:12px;white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,-120%);transition:opacity .12s}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 10px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:7px;vertical-align:middle;background:var(--c)}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.nums div{padding:10px 0}
.nums b{display:block;font:700 19px/1 var(--fD);font-variant-numeric:tabular-nums}
.nums span{display:block;margin-top:6px;font-size:11.5px;color:var(--ink3);line-height:1.3}
.bar{height:8px;margin-top:6px;border-radius:99px;background:var(--fill2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--core),var(--accent))}
.kv{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:13px;color:var(--ink2)}
.kv b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.next{padding:16px;border-radius:18px;background:linear-gradient(135deg,rgba(124,77,255,.18),rgba(124,77,255,.04));border:1px solid rgba(195,173,255,.24)}
.next p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink2)}
.next h3{color:var(--accent)}
.note{margin:22px 0 0;padding:14px 16px;border-radius:16px;border:1px dashed var(--line2);font-size:13px;line-height:1.55;color:var(--ink2)}
.fn{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.fn>b{font:700 13px/1.5 var(--fD);color:var(--accent);font-variant-numeric:tabular-nums}
.fn strong{display:block;font:600 14px/1.35 var(--fT)}
.fn span{display:block;margin-top:2px;font-size:13px;line-height:1.5;color:var(--ink2)}
.deps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.deps button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--fill);border:1px solid var(--line);text-align:left;transition:border-color .2s}
.deps button:hover{border-color:var(--c)}
.deps i,.ideas i,.chips i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 9px var(--c)}
.deps b{display:block;font:600 13px/1.25 var(--fT)}
.deps span{display:block;font-size:11px;color:var(--ink3);letter-spacing:.08em}
.refs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.refs button{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:16px;overflow:hidden;background:#110d2e;border:1px solid var(--line)}
.refs img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.refs button:hover img{transform:scale(1.045)}
.refs span{position:absolute;left:0;right:0;bottom:0;padding:28px 11px 10px;text-align:left;font:600 12px/1.25 var(--fT);background:linear-gradient(transparent,rgba(6,5,26,.88))}
.ideas{margin:0;padding:0;list-style:none}
.ideas li{display:flex;align-items:flex-start;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45;transition:opacity .3s}
.ideas li i{margin-top:6px}
.ideas li.dim{opacity:.32}
.mail{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 16px;border-radius:16px;background:var(--fill);border:1px solid var(--line)}
.mail code{flex:1;min-width:0;font:500 15px/1.3 var(--fT);overflow-wrap:anywhere;-webkit-user-select:all;user-select:all}
.links{display:grid;gap:8px;margin-top:12px}
.links a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:16px;background:var(--fill);border:1px solid var(--line);text-decoration:none;font-weight:500;transition:border-color .2s}
.links a:hover{border-color:var(--line2)}
.links a span{color:var(--ink3);font-size:13px}

/* ---------- лайтбокс и тост ---------- */
.lb{position:fixed;inset:0;z-index:9;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px max(24px,env(safe-area-inset-bottom,0px));
  background:rgba(4,3,16,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.lb.open{opacity:1;visibility:visible;transition:opacity .25s}
.lb figure{margin:0;display:flex;flex-direction:column;align-items:center;max-width:100%}
.lb img{max-width:min(92vw,900px);max-height:78vh;border-radius:18px;box-shadow:0 30px 100px rgba(0,0,0,.6)}
.lb figcaption{margin-top:14px;font-size:14px;color:var(--ink2);text-align:center}
.toast{position:fixed;z-index:8;left:50%;top:calc(var(--bar) + env(safe-area-inset-top,0px) + 14px);display:flex;align-items:center;gap:10px;
  padding:11px 18px;border-radius:999px;background:var(--sheet);border:1px solid rgba(195,173,255,.35);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  font:600 13px/1.2 var(--fT);white-space:nowrap;box-shadow:0 0 40px rgba(124,77,255,.35);opacity:0;transform:translate(-50%,-16px);transition:opacity .4s,transform .5s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast b{color:var(--accent)}

/* ---------- средние экраны ---------- */
@media (max-width:1180px) and (min-width:761px){
  .id{max-width:min(460px,40vw)}
  .dlg{width:min(380px,34vw);right:calc(var(--heroW) + 4px - 80px)}
  .dock button{min-width:56px;padding:8px 6px 7px}
}

/* ---------- телефон: отдельный кадр героя, колонка во весь экран ---------- */
@media (max-width:760px){
  :root{--bar:52px}
  .glow{left:50%;right:auto;top:0;bottom:auto;width:120vw;height:70vh;transform:translateX(-50%)}
  .stage{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;
    padding:0 max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .top{position:relative;flex:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand small{display:none}
  .seg button{padding:6px 9px}
  .btn{padding:8px 13px}
  .hero{position:relative;right:auto;bottom:auto;flex:1 1 auto;min-height:140px;width:auto;height:auto;margin:0 -16px}
  .hero img{position:absolute;inset:0;object-position:50% 0;
    -webkit-mask-image:linear-gradient(to top,transparent 0,#000 26%);mask-image:linear-gradient(to top,transparent 0,#000 26%)}
  .id{position:relative;left:auto;top:auto;max-width:none;margin-top:-34px;text-align:center;flex:none}
  .id::before{inset:-30px -10px -20px}
  .eyebrow{font-size:11px}
  h1{margin:8px 0 6px;font-size:clamp(28px,8vw,34px)}
  .role{margin:0 auto;font-size:14px;max-width:36ch}
  .stats,.id .quest{display:none}
  .chips{display:flex;flex:none;gap:6px;overflow-x:auto;margin:12px -16px 0;padding:2px 16px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:none;display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font:500 13px/1 var(--fT);white-space:nowrap}
  .chips button[aria-pressed="true"]{border-color:var(--c);background:rgba(20,14,56,.85)}
  .chips .q{color:var(--ink3);font-variant-numeric:tabular-nums}
  .dlg{position:relative;right:auto;bottom:auto;width:auto;flex:none;margin-top:10px;padding:14px 16px 13px;border-radius:20px}
  .say{min-height:4.5em;margin:8px 0 12px;font-size:15px}
  .choices button{padding:9px 12px}
  .dock{position:relative;left:auto;bottom:auto;flex:none;margin-top:10px;justify-content:space-between}

  const tip=el.querySelector('.ctip');
  el.querySelectorAll('.hit').forEach(c=>{const on=()=>{const r=rows[+c.dataset.r],i=+c.dataset.i,bx=el.getBoundingClientRect(),cb=c.getBoundingClientRect();
      tip.textContent=r[0]+' · '+fmt(n[i])+' '+t.tipNotes+' → '+fmt(r[2][i])+' '+t.tipTok;
      tip.style.left=Math.max(90,Math.min(bx.width-90,cb.left+cb.width/2-bx.left))+'px';tip.style.top=(cb.top-bx.top+4)+'px';tip.style.opacity=1};
    c.addEventListener('pointerenter',on);c.addEventListener('click',on);c.addEventListener('pointerleave',()=>{tip.style.opacity=0})})}
function rRefs(b,t){const L=lang==='ru'?'ru':'en';b.append(h('p',{class:'lead'},t.refsLead),
  h('div',{class:'refs'},DATA.refs.map((r,i)=>h('button',{type:'button',onclick:()=>openLb(i),'aria-label':r[L]},
    h('img',{src:r.src,alt:'',loading:'lazy',decoding:'async',width:r.w,height:r.h}),h('span',null,r[L])))))}
function rIdeas(b,t){const L=lang==='ru'?'ru':'en',sk=sel>=0?DEPS[sel].k:null;
  b.append(h('p',{class:'lead'},t.ideasLead.replace('{n}',DATA.ideas.length)),
    h('ul',{class:'ideas'},DATA.ideas.map(x=>h('li',{class:sk&&x.d!==sk?'dim':null,style:'--c:'+DEPS[KIDX[x.d]].hex},h('i'),h('span',null,x[L])))))}
function rContact(b,t){const code=h('code',null,MAIL),btn=h('button',{type:'button',class:'btn ghost'},t.copy);
  btn.addEventListener('click',()=>{const ok=()=>{btn.textContent=T[lang].copied;setTimeout(()=>{btn.textContent=T[lang].copy},1600)};
    const fb=()=>{const r=document.createRange();r.selectNodeContents(code);const s=getSelection();s.removeAllRanges();s.addRange(r);try{if(document.execCommand('copy'))ok()}catch(e){}};
    try{navigator.clipboard.writeText(MAIL).then(ok,fb)}catch(e){fb()}});
  b.append(h('p',{class:'lead'},t.contactLead),h('div',{class:'mail'},code,btn),h('div',{class:'links'},
    h('a',{href:PAGES+'cv.pdf',target:'_blank',rel:'noopener'},t.cvEn,h('span',null,t.pdf+' ↗')),
    h('a',{href:PAGES+'cv-ru.pdf',target:'_blank',rel:'noopener'},t.cvRu,h('span',null,t.pdf+' ↗')),
    h('a',{href:'https://github.com/Matr457',target:'_blank',rel:'noopener'},t.gh,h('span',null,'↗'))))}
/* ---------- лайтбокс ---------- */
function openLb(i){const R=DATA.refs;lbI=(i+R.length)%R.length;const r=R[lbI],L=lang==='ru'?'ru':'en';
  $('#lbImg').src=r.src;$('#lbImg').alt=r[L];$('#lbCap').textContent=(lbI+1)+' / '+R.length+' · '+r[L];$('#lb').classList.add('open')}
function closeLb(){lbI=-1;$('#lb').classList.remove('open')}
$('#lb').addEventListener('click',closeLb);
/* ---------- ввод ---------- */
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;store.set('nano-lang',lang);applyLang()}));
document.querySelectorAll('#dock [data-tab]').forEach(b=>b.addEventListener('click',()=>openTab(b.dataset.tab)));
$('#px').addEventListener('click',closeTab);
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(k==='Escape'){if(lbI>=0)closeLb();else if(tab)closeTab();else{stopTour();show(hello)}return}
  if(lbI>=0){if(k==='ArrowRight')openLb(lbI+1);else if(k==='ArrowLeft')openLb(lbI-1);return}
  if(/^[1-8]$/.test(k)){stopTour();pick(+k-1)}
  else if(k==='ArrowRight'){stopTour();pick(sel<0?0:(sel+1)%ND)}
  else if(k==='ArrowLeft'){stopTour();pick(sel<0?ND-1:(sel-1+ND)%ND)}});
buildLabels(); layout(); applyLang();
// стоп-кадры для QA и скриншотов: ?shot=tour — первый департамент выбран, ?shot=nums|refs|ideas|inside|contact — панель открыта
(function(){const s=qs.get('shot');if(!s)return;if(s==='tour')pick(0);else if(RENDER[s])openTab(s)})();

})();</script>
