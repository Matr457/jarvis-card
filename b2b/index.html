<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NANO · Аватар компании</title>
<meta name="description" content="Две минуты: второй мозг компании + харнес из агентов = свой ИИ. Квест на 8 цветов и вопросы живому мозгу.">
<meta property="og:title" content="NANO · Аватар компании">
<meta property="og:description" content="Две минуты: второй мозг компании + харнес из агентов = свой ИИ. Квест на 8 цветов и вопросы живому мозгу.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://matr457.github.io/jarvis-card/b2b/">
<meta property="og:image" content="https://matr457.github.io/jarvis-card/b2b/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#07060e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Oswald:wght@500;600;700&display=swap">
<style>
/* Layout: two screens under one HUD bar. Card + quest side by side on desktop, stacked on phone; Q&A = NANO column + chat.
   Look: night-city AI department. One neon yellow for actions, cyan for data, hot pink for NANO; brain colours only in the game. */
:root {
  --void: #07060e;
  --deep: #0e0b1e;
  --panel: rgba(17, 13, 34, .88);
  --panel2: rgba(27, 21, 52, .9);
  --line: #2d2655;
  --ink: #efebff;
  --dim: #9d97c6;
  --neon: #f6e71d;
  --cyan: #34efff;
  --hot: #ff3d8b;
  --lav: #c6b6ff;
  --ff-d: "Oswald", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Arial Narrow", sans-serif;
  --ff-b: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --ff-m: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --cut: 16px;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gutR: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--void); -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--void); color: var(--ink); font: 400 15px/1.5 var(--ff-b);
  padding-left: var(--gut); padding-right: var(--gutR); padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)); overflow-x: hidden; }
img { max-width: 100%; display: block; }
button, input { font: inherit; color: inherit; }
a { color: var(--cyan); }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.mono { font-family: var(--ff-m); font-size: 11px; letter-spacing: .06em; }
.dim { color: var(--dim); }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* фон: туман неона, сетка, звёзды, развёртка */
.fx { position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(60% 45% at 88% -5%, rgba(255, 61, 139, .28), transparent 70%),
    radial-gradient(55% 50% at -5% 105%, rgba(52, 239, 255, .17), transparent 70%),
    radial-gradient(40% 30% at 50% 50%, rgba(140, 110, 255, .10), transparent 70%),
    radial-gradient(1px 1px at 12% 22%, #fff9, transparent 60%), radial-gradient(1px 1px at 72% 12%, #fff8, transparent 60%),
    radial-gradient(1.4px 1.4px at 38% 64%, #cfc3ff, transparent 60%), radial-gradient(1px 1px at 86% 78%, #fff7, transparent 60%),
    radial-gradient(1px 1px at 56% 34%, #fff6, transparent 60%), radial-gradient(1.2px 1.2px at 24% 88%, #bdf7ff, transparent 60%),
    linear-gradient(rgba(120, 100, 255, .055) 1px, transparent 1px) 0 0 / 44px 44px,
    linear-gradient(90deg, rgba(120, 100, 255, .055) 1px, transparent 1px) 0 0 / 44px 44px,
    var(--void); }
.fx::after { content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .22) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }

/* срезанные углы, как у панелей HUD */
.cut { position: relative; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line);
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut))); }
.cut::after, .cut::before { content: ""; position: absolute; width: var(--cut); height: var(--cut); pointer-events: none; }
.cut::after { top: 0; right: 0; background: linear-gradient(to bottom left, transparent calc(50% - 1.5px), var(--neon) 0 calc(50% + 1.5px), transparent 0); }
.cut::before { bottom: 0; left: 0; background: linear-gradient(to top right, transparent calc(50% - 1.5px), var(--line) 0 calc(50% + 1.5px), transparent 0); }

/* верхняя полоса */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 10px; margin-bottom: 12px; background: linear-gradient(var(--void) 70%, transparent); }
.logo { display: flex; align-items: baseline; gap: 2px; text-decoration: none; color: var(--ink); font: 700 18px/1 var(--ff-d); letter-spacing: .04em; }
.logo i { color: var(--hot); font-style: normal; }
.logo span { font: 600 10px/1 var(--ff-m); letter-spacing: .14em; color: var(--dim); margin-left: 4px; }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tab { display: flex; align-items: baseline; gap: 6px; padding: 7px 12px; text-decoration: none; color: var(--dim); font: 600 14px/1 var(--ff-d);
  text-transform: uppercase; letter-spacing: .06em; box-shadow: inset 0 0 0 1px var(--line);
  clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 0 100%); }
.tab em { font: 600 10px/1 var(--ff-m); font-style: normal; color: var(--hot); }
.tab[aria-current="page"] { color: var(--void); background: var(--neon); box-shadow: none; }
.tab[aria-current="page"] em { color: var(--void); }
.langs { display: flex; gap: 2px; }
.langs button { border: 0; background: transparent; color: var(--dim); padding: 6px 7px; font: 600 11px/1 var(--ff-m); cursor: pointer; }
.langs button[aria-pressed="true"] { color: var(--neon); box-shadow: inset 0 -2px 0 var(--neon); }

main { max-width: 1320px; margin: 0 auto; }
.screen { display: grid; gap: 14px; }

/* ── экран 1: визитка ───────────────────────────────── */
/* лишняя высота фигуры уходит в пустую строку «.», а не в зазоры между заголовком и лидом */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto 1fr auto auto; column-gap: 8px;
  grid-template-areas: "eye fig" "h1 fig" "lead fig" ". fig" "form form" "proof proof"; padding: 18px 16px 16px; overflow: hidden; }
.hero-text { display: contents; }
.eyebrow { grid-area: eye; margin: 0 0 8px; color: var(--cyan); text-transform: uppercase; }
.blink { color: var(--hot); animation: blink 1.6s steps(2, start) infinite; }
h1 { grid-area: h1; position: relative; z-index: 2; margin: 0; font: 700 clamp(34px, 10vw, 84px)/.9 var(--ff-d); text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.h1b { color: var(--neon); }
.glitch { text-shadow: 2px 0 rgba(255, 61, 139, .75), -2px 0 rgba(52, 239, 255, .6); animation: glitch 5.5s infinite; }
.lead { grid-area: lead; margin: 12px 0 0; max-width: 40ch; color: #d9d4f5; font-size: 15px; }
.hero-fig { grid-area: fig; position: relative; margin: 0; align-self: end; width: clamp(118px, 34vw, 300px); }
.hero-fig img { width: 100%; height: auto; filter: drop-shadow(0 0 18px rgba(198, 182, 255, .45)) drop-shadow(0 0 2px rgba(52, 239, 255, .8));
  animation: sway 6s ease-in-out infinite; transform-origin: 50% 100%; }
.hud { position: absolute; z-index: 1; padding: 3px 6px; background: rgba(7, 6, 14, .78); box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; font-size: 9px; }
.hud-a { top: 4%; left: -6px; color: var(--cyan); }
.hud-b { bottom: 18%; right: 0; color: var(--neon); }

.formula { grid-area: form; list-style: none; margin: 16px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.formula li { position: relative; padding: 10px 10px 9px 30px; background: var(--panel2); box-shadow: inset 0 0 0 1px var(--line); min-width: 0;
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); }
.formula li::before { content: attr(data-op); position: absolute; left: 9px; top: 9px; font: 700 15px/1 var(--ff-m); color: var(--hot); }
.formula b { display: block; font: 600 17px/1.1 var(--ff-d); text-transform: uppercase; letter-spacing: .04em; }
.formula span { display: block; margin-top: 3px; font-size: 12px; line-height: 1.3; color: var(--dim); }
.formula li.out { background: var(--neon); box-shadow: none; }
.formula li.out b, .formula li.out span, .formula li.out::before { color: var(--void); }
.proof { grid-area: proof; margin-top: 14px; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
.proof p { margin: 0; text-transform: uppercase; }
.stats { display: flex; gap: 18px; margin: 0; }
.stats div { min-width: 0; }
.stats dt { font: 600 24px/1 var(--ff-d); color: var(--cyan); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.stats dd { margin: 2px 0 0; font: 400 10px/1 var(--ff-m); color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }

/* квест */
.quest { padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.q-head { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.q-head h2 { margin: 0; font: 600 20px/1.05 var(--ff-d); text-transform: uppercase; letter-spacing: .04em; }
.q-head p { margin: 4px 0 0; }
.pips { list-style: none; display: grid; grid-template-columns: repeat(4, 12px); gap: 4px; margin: 2px 0 0; padding: 0; }
.pips li { width: 12px; height: 12px; box-shadow: inset 0 0 0 1px var(--c); opacity: .55; transform: rotate(45deg) scale(.8); transition: .3s; }
.pips li.on { background: var(--c); opacity: 1; box-shadow: 0 0 10px var(--c); }
.stage { position: relative; width: 100%; aspect-ratio: 1 / 1.02; max-width: 100%; background: radial-gradient(circle at 50% 50%, #17123155, transparent 70%);
  box-shadow: inset 0 0 0 1px rgba(45, 38, 85, .6); overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
.lvl-bar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  background: linear-gradient(rgba(7, 6, 14, .9), rgba(7, 6, 14, 0)); pointer-events: none; }
.lvl-bar .x { pointer-events: auto; width: 34px; height: 34px; border: 0; background: rgba(7, 6, 14, .8); box-shadow: inset 0 0 0 1px var(--line);
  color: var(--ink); font: 600 22px/1 var(--ff-d); cursor: pointer; }
.lvl-name { display: flex; flex-direction: column; min-width: 0; }
.lvl-name b { font: 600 16px/1.1 var(--ff-d); text-transform: uppercase; letter-spacing: .05em; color: var(--c, var(--ink)); }
.lvl-name span { font-size: 13px; color: var(--ink); }
.goal { list-style: none; display: flex; gap: 4px; margin: 0 0 0 auto; padding: 0; }
.goal li { width: 9px; height: 9px; box-shadow: inset 0 0 0 1px var(--c); transform: rotate(45deg); }
.goal li.on { background: var(--c); box-shadow: 0 0 8px var(--c); }

/* NANO говорит под сценой, а не поверх неё: низ поля — игровой (корзина, пятый агент, нижний ряд) */
.nano-say { display: flex; align-items: center; gap: 8px; min-height: 60px; }
.nano-say img { width: 56px; height: 56px; object-fit: contain; flex: none; filter: drop-shadow(0 0 8px rgba(198, 182, 255, .5)); }
.nano-say p { position: relative; flex: 1; min-width: 0; margin: 0; padding: 8px 12px; font-size: 14px; line-height: 1.35; background: rgba(7, 6, 14, .7);
  box-shadow: inset 0 0 0 1px var(--hot); clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px); }
.nano-say.pop img { animation: pop .4s cubic-bezier(.3, 1.6, .5, 1); }
.nano-say.pop p { animation: slide .3s ease-out; }

.win { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center;
  padding: 20px; background: radial-gradient(circle, rgba(7, 6, 14, .8), rgba(7, 6, 14, .93)); }
.win h3 { margin: 0; font: 700 clamp(36px, 9vw, 64px)/.95 var(--ff-d); text-transform: uppercase; color: var(--neon); }
.win p { margin: 0; max-width: 34ch; }
.win-k { color: var(--cyan); }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
.q-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.skip { color: var(--dim); text-transform: uppercase; }
.skip:hover { color: var(--neon); }

/* кнопки */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 10px 18px; border: 0; cursor: pointer;
  background: var(--neon); color: var(--void); text-decoration: none; font: 600 15px/1 var(--ff-d); text-transform: uppercase; letter-spacing: .06em;
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px)); transition: transform .15s, filter .15s; }
.btn:hover { transform: translate(-1px, -1px); filter: drop-shadow(3px 3px 0 var(--hot)); }
.btn.ghost { background: transparent; color: var(--neon); box-shadow: inset 0 0 0 1.5px var(--neon); }

/* ── экран 2: вопросы ───────────────────────────────── */
.s-ask { grid-template-columns: minmax(0, 1fr); }
.ask-side { display: flex; align-items: center; gap: 14px; padding: 12px 14px; }
.ask-side img { width: 64px; height: auto; flex: none; filter: drop-shadow(0 0 12px rgba(198, 182, 255, .5)); transition: opacity .2s; }
.status { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; color: var(--dim); min-width: 0; }
.status li { display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--dim); }
.dot.core { background: var(--neon); box-shadow: 0 0 8px var(--neon); }
.dot.on { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: blink 2s ease-in-out infinite; }
.dot.off { background: var(--hot); }
.chat { padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.c-head h2 { margin: 0; font: 600 22px/1.05 var(--ff-d); text-transform: uppercase; letter-spacing: .04em; }
.c-head p { margin: 4px 0 0; font-size: 13px; }
.log { display: flex; flex-direction: column; gap: 10px; height: 44vh; min-height: 260px; overflow-y: auto; padding: 4px 2px; scroll-behavior: smooth; }
.msg { max-width: 88%; padding: 10px 12px; font-size: 15px; line-height: 1.45; min-width: 0; overflow-wrap: anywhere; }
.msg.bot { align-self: flex-start; background: var(--panel2); box-shadow: inset 0 0 0 1px var(--line);
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); }
.msg.me { align-self: flex-end; background: rgba(246, 231, 29, .08); box-shadow: inset 0 0 0 1px rgba(246, 231, 29, .55); }
.msg .b { display: block; margin-top: 6px; font: 400 10px/1.2 var(--ff-m); letter-spacing: .06em; color: var(--dim); text-transform: uppercase; }
.msg .b.core { color: var(--neon); }
.msg .b.live { color: var(--cyan); }
.msg.wait { color: var(--dim); font-style: italic; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 0; cursor: pointer; padding: 8px 11px; background: rgba(7, 6, 14, .6); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink);
  font-size: 13px; line-height: 1.2; clip-path: polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 0 100%); transition: box-shadow .15s, color .15s; }
.chips button:hover { box-shadow: inset 0 0 0 1px var(--cyan); color: var(--cyan); }
.chips button.brain { color: var(--lav); }
/* на телефоне подсказки — одна лента со скроллом вбок, иначе четыре ряда кнопок съедают чат */
@media (max-width: 999px) {
  .chips { flex-wrap: nowrap; overflow-x: auto; margin-inline: -14px; padding-inline: 14px; scrollbar-width: none;
    mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 24px), transparent); }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; white-space: nowrap; }
  .log { height: 52vh; }
}
.ask-form { display: flex; gap: 8px; }
.ask-form input { flex: 1; min-width: 0; height: 44px; padding: 0 12px; border: 0; background: rgba(7, 6, 14, .8); box-shadow: inset 0 0 0 1px var(--line); font-size: 16px; }
.ask-form input:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--cyan); }
.cta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.mail { color: var(--dim); overflow-wrap: anywhere; user-select: all; }
.copy { border: 0; background: transparent; color: var(--cyan); cursor: pointer; font: inherit; text-decoration: underline; padding: 4px; }
.foot { margin: 0; text-transform: uppercase; font-size: 10px; }

/* ── широкий экран ───────────────────────────────── */
@media (min-width: 720px) {
  .formula { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .hero-fig { width: clamp(150px, 24vw, 260px); }
}
@media (min-width: 1000px) {
  .s-card { grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr); align-items: stretch; }
  /* формула встаёт под лид, слева от фигуры: на широком экране под заголовком не остаётся пустоты */
  .hero { grid-template-areas: "eye eye" "h1 fig" "lead fig" "form fig" ". fig" "proof proof"; grid-template-rows: auto auto auto auto 1fr auto;
    padding: 26px 24px 20px; column-gap: 18px; }
  h1 { font-size: clamp(48px, 4.6vw, 72px); }
  .lead { font-size: 16px; }
  .formula { grid-template-columns: minmax(0, 1fr); gap: 6px; }   /* формула читается сверху вниз: мозг + харнес + цвета = свой ИИ */
  .formula li { display: flex; align-items: baseline; gap: 12px; padding-block: 11px; }
  .formula span { margin-top: 0; }
  .hero-fig { width: clamp(170px, 15vw, 230px); }
  .stage { aspect-ratio: auto; flex: 1; min-height: 520px; }
  .s-ask { grid-template-columns: 300px minmax(0, 1fr); align-items: stretch; }
  .ask-side { flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; }
  .ask-side img { width: 220px; }
  .log { height: 46vh; }
}

@keyframes blink { 50% { opacity: .25; } }
@keyframes pop { 0% { transform: scale(.7) rotate(-6deg); } 100% { transform: none; } }
@keyframes slide { 0% { opacity: 0; transform: translateX(-6px); } 100% { opacity: 1; transform: none; } }
@keyframes sway { 0%, 100% { transform: rotate(-.8deg); } 50% { transform: rotate(.8deg) translateY(-3px); } }
@keyframes glitch {
  0%, 92%, 100% { transform: none; text-shadow: 2px 0 rgba(255, 61, 139, .75), -2px 0 rgba(52, 239, 255, .6); }
  93% { transform: translate(2px, 0) skewX(-6deg); text-shadow: -4px 0 rgba(255, 61, 139, .9), 4px 0 rgba(52, 239, 255, .8); }
  95% { transform: translate(-2px, 1px); text-shadow: 3px 0 rgba(255, 61, 139, .9), -3px 0 rgba(52, 239, 255, .8); }
  97% { transform: translate(1px, -1px) skewX(4deg); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

</style>
</head>
<body>
<div class="fx" aria-hidden="true"></div>

<header class="bar">
  <a class="logo" href="#card" aria-label="NANO"><b>NANO</b><i>//</i><span>AI_DEPARTMENT</span></a>
  <nav class="tabs" aria-label="screens">
    <a href="#card" class="tab" data-tab="card"><em>01</em><span data-t="tab1"></span></a>
    <a href="#ask" class="tab" data-tab="ask"><em>02</em><span data-t="tab2"></span></a>
  </nav>
  <div class="langs" role="group" aria-label="language">
    <button type="button" data-lang="ru">RU</button><button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">EN</button>
  </div>
</header>

<main>
  <!-- ЭКРАН 1: визитка + квест -->
  <section class="screen s-card" id="s-card" data-screen="card">
    <article class="hero cut">
      <div class="hero-text">
        <p class="eyebrow mono"><span class="blink">●</span> <span data-t="eyebrow"></span></p>
        <h1 class="glitch"><span data-t="h1a"></span><br><span class="h1b" data-t="h1b"></span></h1>
        <p class="lead" data-t="lead"></p>
        <ol class="formula" id="formula"></ol>
        <div class="proof">
          <p class="mono dim" data-t="proof"></p>
          <dl class="stats" id="stats"></dl>
        </div>
      </div>
      <figure class="hero-fig">
        <span class="hud hud-a mono">ID · NANO-CEO</span>
        <span class="hud hud-b mono" id="syncTag">SYNC 0/8</span>
        <img id="heroImg" alt="NANO" width="263" height="512">
      </figure>
    </article>

    <article class="quest cut">
      <header class="q-head">
        <div>
          <h2 data-t="quest"></h2>

hen the ring lines up"]},"LIGHT_RED":{"ru":["Деньги и продукт","Лови монеты"],"zh":["财务与产品","接住金币"],"en":["Money & product","Catch the coins"]},"GREEN":{"ru":["Наука","Тапай — спускайся к минимуму"],"zh":["科学","点击，下降到最低点"],"en":["Science","Tap to descend to the minimum"]},"LIGHT_BLUE":{"ru":["Этика","Останови опасное"],"zh":["伦理","拦下危险项"],"en":["Ethics","Stop the dangerous ones"]},"BLUE":{"ru":["ИИ и ИТ","Свяжи агентов 1 → 5"],"zh":["AI 与 IT","按 1 → 5 连接智能体"],"en":["AI & IT","Link the agents 1 → 5"]},"PURPLE":{"ru":["Ядро и память","Повтори вспышки"],"zh":["核心与记忆","重复闪光顺序"],"en":["Core & memory","Repeat the flashes"]},"PINK":{"ru":["Интерфейс и соцсети","Лопай жвачку"],"zh":["界面与社交","戳破泡泡糖"],"en":["UI & social","Pop the bubblegum"]}},"chips":[{"id":"avatar","ru":"Что такое Аватар?","zh":"什么是化身？","en":"What is the Avatar?"},{"id":"compete","ru":"Чем лучше ChatGPT?","zh":"比 ChatGPT 好在哪？","en":"Why not just ChatGPT?"},{"id":"privacy","ru":"Где наши данные?","zh":"我们的数据在哪？","en":"Where does our data live?"},{"id":"cheap","ru":"Почему быстро и дёшево?","zh":"为什么又快又便宜？","en":"Why is it fast and cheap?"},{"id":"pilot","ru":"Как начать пилот?","zh":"怎么开始试点？","en":"How does a pilot start?"},{"q":"PageRank","ru":"Мозг: что про PageRank?","zh":"大脑：PageRank","en":"Brain: PageRank?"},{"q":"градиентный спуск","q_en":"gradient descent","ru":"Мозг: градиентный спуск","zh":"大脑：梯度下降","en":"Brain: gradient descent"},{"id":"founder","ru":"Кто основатель?","zh":"创始人是谁？","en":"Who is the founder?"}],"intents":[{"id":"avatar","sprite":"20-idea","keys":{"ru":["аватар","что такое nano","что такое нано","кто ты","что ты так","своя модель","свой ии","собственный ии","харнес"],"en":["avatar","what is nano","who are you","own model","own ai","harness"],"zh":["化身","你是谁","自有","框架","什么是 nano","什么是nano"]},"ru":"Аватар — это второй мозг компании и харнес вокруг него. Мозг хранит знания и опыт: документы, решения, переписку, уроки. Харнес — агенты по цветам-доменам, скилы, проверки и кнопка «Одобрить». Вместе это ваш собственный ИИ: модель-движок можно сменить, а мозг и опыт остаются вашими.","zh":"化身就是公司的第二大脑，加上外面的一层智能体框架。大脑保存知识和经验：文档、决策、往来邮件、教训。框架是按颜色领域分工的智能体、技能、检查和「批准」按钮。合在一起，就是你们自己的 AI：底层模型可以随时更换，大脑和经验始终属于你们。","en":"The Avatar is your company's second brain plus a harness around it. The brain keeps knowledge and experience: documents, decisions, correspondence, lessons. The harness is agents per colour domain, skills, checks and an Approve button. Together they are your own AI: the model engine can be swapped, the brain and the experience stay yours."},{"id":"compete","sprite":"21-cool","keys":{"ru":["chatgpt","gpt","лучше","отлича","конкурент","notion","obsidian"],"en":["chatgpt","gpt","better","differ","compet","notion","obsidian"],"zh":["chatgpt","gpt","更好","好在哪","区别","竞争","优势"]},"ru":"ChatGPT отвечает и забывает. Notion и Obsidian хранят, но раскладывать надо самому. NANO помнит всю историю компании, сама раскладывает и связывает, а действует только по кнопке «Одобрить». Это измерено: темы человека совпадают с сообществами графа, ρ = 0,774.","zh":"ChatGPT 回答完就忘。Notion 和 Obsidian 能存，但要自己整理。NANO 记得公司的全部经历，自己归类、自己建立联系，只有你按下「批准」才会行动。这是量化过的：人的主题与图谱社区一致，ρ = 0.774。","en":"ChatGPT answers and forgets. Notion and Obsidian store, but you sort everything yourself. NANO remembers the company's whole history, files and links it on its own, and acts only on an Approve tap. It's measured: a person's topics match the graph's communities, ρ = 0.774."},{"id":"privacy","sprite":"05-ok","keys":{"ru":["данн","безопас","приват","сервер","облак","утечк","конфиденц"],"en":["data","secur","privacy","private","server","cloud","leak"],"zh":["数据","安全","隐私","服务器","泄露"]},"ru":"Мозг и агенты живут на вашем сервере или в вашем облаке. Модель выбираете и хостите вы. Наружу ничего не уходит без «Одобрить», каждый шаг — в журнале и откатывается.","zh":"大脑和智能体运行在你们自己的服务器或云上，模型由你们选择和托管。没有「批准」，任何东西都不会发出去；每一步都有日志，可以回滚。","en":"The brain and the agents live on your server or in your cloud. You <script>
// Оболочка страницы: язык (RU · 中文 · EN, по умолчанию русский; ?lang=en для ссылки инвестору), два экрана по хешу
// (#card — визитка и квест, #ask — вопросы), тексты визитки, цифры мозга, контакты. Игра и чат подписываются через window.B2B.
(function () {
  const D = JSON.parse(document.getElementById('data').textContent);
  const C = D.copy, U = C.ui, LANGS = C.langs;
  const LOC = {ru: 'ru-RU', zh: 'zh-CN', en: 'en-US'};
  const store = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* приватное окно — язык просто не запомнится */ } }};
  let lang = (() => {
    const q = new URLSearchParams(location.search).get('lang');
    if (LANGS.includes(q)) return q;
    const s = store.get('b2b-lang');
    return LANGS.includes(s) ? s : C.default;
  })();
  const subs = {lang: [], screen: []};
  const num = n => Number(n).toLocaleString(LOC[lang]);
  const facts = () => ({NOTES: num(D.facts.notes), LINKS: num(D.facts.links), COMMITS: num(D.facts.commits),
    EMAIL: D.contact.email, WECHAT: D.contact.wechat, TEL: D.contact.tel_h});
  const fill = (s, extra) => { const f = Object.assign(facts(), extra || {});
    return String(s).replace(/\{(\w+)\}/g, (m, k) => (k in f ? f[k] : m)); };
  const t = (k, extra) => fill(U[lang][k] !== undefined ? U[lang][k] : U.ru[k], extra);
  const $ = s => document.querySelector(s);

  function formula() {
    const ops = ['', '+', '+', '='];
    $('#formula').innerHTML = '';
    U[lang].f.forEach(([b, s], i) => {
      const li = document.createElement('li');
      li.dataset.op = ops[i]; if (i === 3) li.className = 'out';
      li.innerHTML = '<b></b><span></span>'; li.firstChild.textContent = b; li.lastChild.textContent = s;
      $('#formula').append(li);
    });
  }
  function stats() {
    const v = [D.facts.notes, D.facts.links, D.facts.commits];
    $('#stats').innerHTML = '';
    U[lang].st.forEach((label, i) => {
      const d = document.createElement('div'); d.innerHTML = '<dt></dt><dd></dd>';
      d.firstChild.textContent = num(v[i]); d.lastChild.textContent = label; $('#stats').append(d);
    });
  }
  function contacts() {
    const c = D.contact;
    $('#ctaCall').href = 'mailto:' + c.email + '?subject=' + encodeURIComponent(t('mail_subject')) + '&body=' + encodeURIComponent(t('mail_body'));
    $('#mailText').textContent = c.email;
  }
  function apply() {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
    document.title = U[lang].title;
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
    document.querySelectorAll('[data-ph]').forEach(el => { el.placeholder = t(el.dataset.ph); });
    document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    formula(); stats(); contacts();
    subs.lang.forEach(f => f(lang));
  }

  // два экрана: #ask — вопросы, всё остальное — визитка
  function route() {
    const name = location.hash === '#ask' ? 'ask' : 'card';
    document.querySelectorAll('[data-screen]').forEach(s => { s.hidden = s.dataset.screen !== name; });
    document.querySelectorAll('.tab').forEach(a => { if (a.dataset.tab === name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    window.scrollTo(0, 0);
    subs.screen.forEach(f => f(name));
  }

  document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang; store.set('b2b-lang', lang); apply();
  }));
  $('#copyMail').addEventListener('click', () => {
    const done = () => { $('#copyMail').textContent = t('copied'); setTimeout(() => { $('#copyMail').textContent = t('cta_copy'); }, 1600); };
    const pick = () => { const r = document.createRange(); r.selectNodeContents($('#mailText')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(D.contact.email).then(done, pick); else pick();
  });
  window.addEventListener('hashchange', route);

  const sprite = k => D.sprites[k] || D.sprites['01-hello'];
  $('#heroImg').src = sprite('06-ceo');
  $('#askImg').src = sprite('06-ceo');

  window.B2B = {D, t, fill, num, sprite, get lang() { return lang; },
    onLang: f => subs.lang.push(f), onScreen: f => subs.screen.push(f),
    screen: () => (location.hash === '#ask' ? 'ask' : 'card'), boot() { apply(); route(); }};
})();

// Квест «зажги 8 цветов»: карта мозга (ядро NANO + 8 цветов-доменов; мосты между цветами — настоящие связи из nine.json)
// и 8 мини-игр, по одной на домен. Только визуал: подсказку говорит NANO, проиграть нельзя — можно только не успеть.
(function () {
  const B = window.B2B, D = B.D, $ = s => document.querySelector(s);
  const RING = ['RED', 'TEAL', 'LIGHT_RED', 'GREEN', 'LIGHT_BLUE', 'BLUE', 'PURPLE', 'PINK'];   // радуга по кругу
  const NEXT = ['PINK', 'BLUE', 'GREEN', 'LIGHT_RED', 'RED', 'LIGHT_BLUE', 'PURPLE', 'TEAL'];   // подсказка порядка
  const VIS = {BLUE: '#6f8cff'};  // синий мозга слишком тёмный для свечения на ночном фоне
  const COL = k => VIS[k] || D.colours[k].hex;
  const REACT = ['05-ok', '16-wow', '21-cool', '23-done', '08-laugh', '17-wink', '20-idea', '01-hello'];
  const INK = '#efebff', DIM = '#9d97c6', VOID = '#07060e', HOT = '#ff3d8b', CYAN = '#34efff';
  const cv = $('#cv'), g = cv.getContext('2d'), stage = $('#stage');
  let W = 0, H = 0, S = 1;
  const st = {mode: 'map', lit: new Set(), lvl: null, key: null, t0: 0, t1: 0, fx: [], txt: [], react: 0, sayFn: null};

  // ── холст ─────────────────────────────────────────────
  function resize() {
    const r = stage.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!r.width) return;
    W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0); S = Math.max(.8, Math.min(W, H) / 360);
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener('resize', resize);

  const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
  const glow = (c, b) => { g.shadowColor = c; g.shadowBlur = b; };
  const flat = () => { g.shadowBlur = 0; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const circle = (x, y, r) => { g.beginPath(); g.arc(x, y, Math.max(.1, r), 0, 6.2832); };
  const line = (x1, y1, x2, y2) => { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); };
  const hex = (x, y, r) => { g.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; g[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * r, y + Math.sin(a) * r); } g.closePath(); };
  const cutRect = (x, y, w, h, c) => { g.beginPath(); g.moveTo(x, y); g.lineTo(x + w - c, y); g.lineTo(x + w, y + c); g.lineTo(x + w, y + h); g.lineTo(x + c, y + h); g.lineTo(x, y + h - c); g.closePath(); };
  const text = (s, x, y, font, c, align = 'center') => { g.font = font; g.fillStyle = c; g.textAlign = align; g.textBaseline = 'middle'; g.fillText(s, x, y); };
  const F = (w, px, fam) => `${w} ${Math.round(px)}px ${fam === 'm' ? '"JetBrains Mono", monospace' : 'Oswald, "PingFang SC", "Microsoft YaHei", sans-serif'}`;

  function burst(x, y, c, n = 16) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.2832, v = (60 + Math.random() * 170) * S;
      st.fx.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: .5 + Math.random() * .45, t: 0, c, r: Math.random() * 3});
    }
  }
  const float = (x, y, s, c) => st.txt.push({x, y, s, c, t: 0});

    st.fx = st.fx.filter(p => p.t < p.life);

      g.save(); g.translate(p.x, p.y); g.rotate(p.r + p.t * 6); glow(p.c, 8); g.fillStyle = rgba(p.c.length === 7 ? p.c : '#ffffff', a); g.fillRect(-s / 2, -s / 2, s, s); g.restore();
    }

    for (const q of st.txt) q.t += dt;
    st.txt = st.txt.filter(q => q.t < .9);
    for (const q of st.txt) { g.globalAlpha = 1 - q.t / .9; text(q.s, q.x, q.y - q.t * 34 * S, F(700, 16 * S), q.c); g.globalAlpha = 1; }
  }

  // ── значки доменов ────────────────────────────────────
  function icon(k, x, y, q, c) {
    g.save(); g.strokeStyle = c; g.fillStyle = c; g.lineWidth = Math.max(1.4, 1.8 * S); g.lineJoin = 'round'; g.lineCap = 'round';
    if (k === 'RED') {            // пламя — пожары управления
      g.beginPath(); g.moveTo(x, y - q); g.quadraticCurveTo(x + q * .95, y - q * .05, x + q * .55, y + q * .62);
      g.quadraticCurveTo(x, y + q * 1.05, x - q * .55, y + q * .62); g.quadraticCurveTo(x - q * .95, y - q * .05, x, y - q); g.fill();
    } else if (k === 'TEAL') {    // мишень — ритм идей
      circle(x, y, q * .95); g.stroke(); circle(x, y, q * .5); g.stroke(); circle(x, y, q * .15); g.fill();
    } else if (k === 'LIGHT_RED') { // монета
      circle(x, y, q * .9); g.stroke(); text('$', x, y + q * .05, F(700, q * 1.25), c);
    } else if (k === 'GREEN') {   // кривая потерь с минимумом
      g.beginPath(); g.moveTo(x - q, y - q * .7); g.quadraticCurveTo(x - q * .1, y + q * 1.5, x + q, y - q * .4); g.stroke(); circle(x + q * .05, y + q * .38, q * .2); g.fill();
    } else if (k === 'LIGHT_BLUE') { // щит
      g.beginPath(); g.moveTo(x, y - q); g.lineTo(x + q * .85, y - q * .6); g.lineTo(x + q * .7, y + q * .35); g.lineTo(x, y + q); g.lineTo(x - q * .7, y + q * .35); g.lineTo(x - q * .85, y - q * .6); g.closePath(); g.stroke();

    }
    g.restore();
  }

  // ── карта мозга ───────────────────────────────────────
  function geo() {
    const cx = W / 2, cy = H / 2 - 4 * S, R = Math.min(W * .35, H * .36), r = Math.max(18, 25 * S);
    return {cx, cy, R, r, pos: RING.map((k, i) => { const a = -Math.PI / 2 + i * Math.PI / 4; return {k, x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R}; })};
  }
  function drawCore(G, now) {
    const n = st.lit.size, rc = G.r * 1.3, win = st.mode === 'win';
    for (let i = 0; i < 8; i++) {   // кольцо прогресса: сегмент на цвет
      const k = RING[i], a0 = -Math.PI / 2 + i * Math.PI / 4 - Math.PI / 8 + .07 + (win ? now / 900 : 0);
      g.beginPath(); g.arc(G.cx, G.cy, rc + 9 * S, a0, a0 + Math.PI / 4 - .14);
      g.lineWidth = 4 * S; g.strokeStyle = st.lit.has(k) ? COL(k) : 'rgba(157,151,198,.2)';
      if (st.lit.has(k)) glow(COL(k), 10); g.stroke(); flat();
    }
    const p = 1 + .04 * Math.sin(now / 420) + (win ? .08 * Math.sin(now / 160) : 0);
    const gr = g.createRadialGradient(G.cx - rc * .3, G.cy - rc * .35, 2, G.cx, G.cy, rc * p);
    gr.addColorStop(0, '#f6f1ff'); gr.addColorStop(.45, '#b57cf5'); gr.addColorStop(1, 'rgba(84,46,168,.9)');
    glow('#b57cf5', 16 + n * 4); g.fillStyle = gr; circle(G.cx, G.cy, rc * p); g.fill(); flat();
    text('NANO', G.cx, G.cy - 2 * S, F(700, 13 * S), VOID);
    text(`${n}/8`, G.cx, G.cy + 11 * S, F(600, 9 * S, 'm'), VOID);
  }
  function drawNode(p, r, on, hint, now) {
    const c = COL(p.k);
    if (hint) { const k = (now / 950) % 1; g.strokeStyle = rgba(c, 1 - k); g.lineWidth = 2 * S; hex(p.x, p.y, r * (1 + k * .75)); g.stroke(); }
    hex(p.x, p.y, r);
    if (on) { glow(c, 22); g.fillStyle = c; g.fill(); flat(); } else { g.fillStyle = rgba(c, .13); g.fill(); g.lineWidth = 1.7 * S; g.strokeStyle = c; g.stroke(); }
    icon(p.k, p.x, p.y, r * .5, on ? VOID : c);
    const name = D.copy.colours[p.k][B.lang][0], up = B.lang === 'zh' ? name : name.toUpperCase(), fnt = F(600, 10.5 * S);
    g.font = fnt;
    let rows = [up];
    const words = up.split(' ');
    if (g.measureText(up).width > r * 3.2 && words.length > 1) {   // длинное имя — в две строки, разрез ближе к середине
      let best = 1, bd = 1e9;
      for (let i = 1; i < words.length; i++) { const d = Math.abs(g.measureText(words.slice(0, i).join(' ')).width - g.measureText(words.slice(i).join(' ')).width); if (d < bd) { bd = d; best = i; } }
      rows = [words.slice(0, best).join(' '), words.slice(best).join(' ')];
    }
    const tw = Math.max(...rows.map(s => g.measureText(s).width)), lx = clamp(p.x, tw / 2 + 3, W - tw / 2 - 3), ly = p.y + r + 11 * S;
    rows.forEach((s, i) => text(s, lx, ly + i * 12 * S, fnt, on ? INK : DIM));
    if (on) text(B.num(D.colours[p.k].notes), lx, ly + rows.length * 12 * S, F(400, 9.5 * S, 'm'), c);
  }
  function drawMap(now) {
    const G = geo(), at = k => G.pos[RING.indexOf(k)];
    for (const [a, b, w] of D.bridges) {        // мосты между цветами: толщина = число связей
      const A = at(a), Bp = at(b); if (!A || !Bp) continue;
      const on = st.lit.has(a) && st.lit.has(b), k = w / D.bridgeMax;
      g.strokeStyle = on ? `rgba(255,255,255,${.14 + .4 * k})` : `rgba(143,134,201,${.05 + .12 * k})`; g.lineWidth = (.6 + 2.6 * k) * S; line(A.x, A.y, Bp.x, Bp.y);
    }
    G.pos.forEach((p, i) => {                   // спицы к ядру; у зажжённых — бегут данные
      const on = st.lit.has(p.k), c = COL(p.k);
      g.setLineDash(on ? [] : [3 * S, 5 * S]); g.strokeStyle = rgba(c, on ? .75 : .28); g.lineWidth = (on ? 2 : 1.2) * S; line(G.cx, G.cy, p.x, p.y); g.setLineDash([]);
      if (on) for (let j = 0; j < 2; j++) {
        const f = (now / 1500 + j / 2 + i * .13) % 1, x = p.x + (G.cx - p.x) * f, y = p.y + (G.cy - p.y) * f;
        glow(c, 8); g.fillStyle = c; g.fillRect(x - 1.7 * S, y - 1.7 * S, 3.4 * S, 3.4 * S); flat();
      }
    });
    drawCore(G, now);
    const nxt = st.mode === 'map' ? NEXT.find(k => !st.lit.has(k)) : null;
    G.pos.forEach(p => drawNode(p, G.r, st.lit.has(p.k), p.k === nxt, now));
  }
  function nodeAt(x, y) { const G = geo(); const p = G.pos.find(p => Math.hypot(x - p.x, y - p.y) < G.r * 1.45); return p ? p.k : null; }

  // ── мини-игры: L = {goal, update(dt), draw(now), down(x,y), move?(x,y)}; E.hit() — очко, E.reset() — заново ──
  function bubbles(E) {   // PINK · интерфейс и соцсети: лопай жвачку
    const L = {goal: 6, items: [], t: 0, next: 0};
    L.update = dt => {
      L.t += dt;
      if (L.t > L.next && L.items.length < 7) { L.next = L.t + .4; const r = (21 + Math.random() * 13) * S; L.items.push({x: r + Math.random() * (W - 2 * r), y: H + r, r, v: (62 + Math.random() * 50) * S, ph: Math.random() * 6}); }
      for (const b of L.items) { b.y -= b.v * dt; b.ph += dt * 2.6; }
      L.items = L.items.filter(b => !b.dead && b.y > E.top - b.r);
    };
    const bx = b => b.x + Math.sin(b.ph) * 7 * S;
    L.draw = () => {
      for (const b of L.items) {
        const x = bx(b), gr = g.createRadialGradient(x - b.r * .35, b.y - b.r * .35, b.r * .1, x, b.y, b.r);
        gr.addColorStop(0, 'rgba(255,240,250,.95)'); gr.addColorStop(.4, rgba(E.c, .85)); gr.addColorStop(1, rgba(HOT, .6));
        glow(E.c, 14); g.fillStyle = gr; circle(x, b.y, b.r); g.fill(); flat();
        g.fillStyle = 'rgba(255,255,255,.8)'; g.beginPath(); g.ellipse(x - b.r * .38, b.y - b.r * .42, b.r * .2, b.r * .12, -.6, 0, 6.2832); g.fill();
      }
    };
    L.down = (x, y) => {
      for (const b of L.items) if (Math.hypot(x - bx(b), y - b.y) < b.r * 1.3) { b.dead = true; burst(bx(b), b.y, E.c, 14); float(bx(b), b.y, 'POP', INK); E.hit(); return; }
    };
    return L;
  }

  function chain(E) {     // BLUE · ИИ и ИТ: свяжи агентов по порядку
    const L = {goal: 5, nodes: [], next: 0};
    const m = 42 * S, r = 24 * S, minD = Math.min(W, H) * .24;
    for (let i = 0, tries = 0; i < 5 && tries < 600; tries++) {
      const p = {x: m + Math.random() * (W - 2 * m), y: E.top + m * .7 + Math.random() * (H - E.top - 1.7 * m), i, sh: 0};
      if (L.nodes.every(q => Math.hypot(q.x - p.x, q.y - p.y) > minD)) { L.nodes.push(p); i++; }
    }
    if (L.nodes.length < 5) L.nodes = [0, 1, 2, 3, 4].map(i => ({x: W / 2 + Math.cos(i * 1.2566 - 1.57) * W * .3, y: (H + E.top) / 2 + Math.sin(i * 1.2566 - 1.57) * (H - E.top) * .32, i, sh: 0}));
    L.update = dt => { for (const n of L.nodes) n.sh = Math.max(0, n.sh - dt); };
    L.draw = now => {
      g.lineWidth = 3 * S; g.strokeStyle = E.c; glow(E.c, 12);
      for (let i = 1; i < L.next; i++) line(L.nodes[i - 1].x, L.nodes[i - 1].y, L.nodes[i].x, L.nodes[i].y);
      flat();
      for (let i = 1; i < L.next; i++) { const a = L.nodes[i - 1], b = L.nodes[i], f = (now / 650 + i * .3) % 1; g.fillStyle = INK; g.fillRect(a.x + (b.x - a.x) * f - 2 * S, a.y + (b.y - a.y) * f - 2 * S, 4 * S, 4 * S); }
      for (const n of L.nodes) {
        const done = n.i < L.next, cur = n.i === L.next, dx = n.sh ? Math.sin(n.sh * 60) * 4 * S : 0;
        if (cur) { const k = (now / 800) % 1; g.strokeStyle = rgba(E.c, 1 - k); g.lineWidth = 2 * S; hex(n.x, n.y, r * (1 + k * .7)); g.stroke(); }
        hex(n.x + dx, n.y, r);
        if (done) { glow(E.c, 18); g.fillStyle = E.c; g.fill(); flat(); } else { g.fillStyle = rgba(E.c, cur ? .3 : .12); g.fill(); g.lineWidth = 2 * S; g.strokeStyle = n.sh ? HOT : E.c; g.stroke(); }
        text(String(n.i + 1), n.x + dx, n.y + 1, F(700, 19 * S), done ? VOID : INK);
      }
    };
    L.down = (x, y) => {
      const n = L.nodes.find(n => Math.hypot(x - n.x, y - n.y) < r * 1.45); if (!n) return;
      if (n.i === L.next) { L.next++; burst(n.x, n.y, E.c, 10); E.hit(); } else if (n.i > L.next) n.sh = .3;
    };
    return L;
  }

  function descent(E) {   // GREEN · наука: градиентный спуск к минимуму потерь
    const L = {goal: 5, u: .04, to: .04, trail: [], m: .66};
    const f = u => 1.5 * (u - L.m) ** 2, fmax = f(0);
    const x0 = () => 30 * S, x1 = () => W - 30 * S, yb = () => H - 46 * S, yt = () => E.top + 34 * S;
    const X = u => x0() + u * (x1() - x0()), Y = u => yb() - f(u) / fmax * (yb() - yt());
    L.update = dt => { L.u += (L.to - L.u) * Math.min(1, dt * 9); };
    L.draw = () => {
      g.beginPath(); for (let i = 0; i <= 64; i++) { const u = i / 64; g[i ? 'lineTo' : 'moveTo'](X(u), Y(u)); }
      const path = new Path2D(); for (let i = 0; i <= 64; i++) { const u = i / 64; path[i ? 'lineTo' : 'moveTo'](X(u), Y(u)); }
      const area = new Path2D(path); area.lineTo(X(1), yb() + 20 * S); area.lineTo(X(0), yb() + 20 * S); area.closePath();
      const gr = g.createLinearGradient(0, yt(), 0, yb()); gr.addColorStop(0, rgba(E.c, .02)); gr.addColorStop(1, rgba(E.c, .22));
      g.fillStyle = gr; g.fill(area);
      glow(E.c, 10); g.strokeStyle = E.c; g.lineWidth = 2.5 * S; g.stroke(path); flat();
      g.setLineDash([3 * S, 4 * S]); g.strokeStyle = rgba(E.c, .5); g.lineWidth = 1; line(X(L.m), Y(L.m), X(L.m), yb() + 16 * S); g.setLineDash([]);
      text('min', X(L.m), yb() + 26 * S, F(400, 10 * S, 'm'), rgba(E.c, .9));
      text('loss', x0(), yt() - 16 * S, F(400, 10 * S, 'm'), DIM, 'left');
      text('θ', x1(), yb() + 26 * S, F(400, 12 * S, 'm'), DIM, 'right');
      for (const u of L.trail) { g.fillStyle = rgba(E.c, .5); circle(X(u), Y(u), 3 * S); g.fill(); }
      const h = .01, sx = X(L.u + h) - X(L.u - h), sy = Y(L.u + h) - Y(L.u - h), n = Math.hypot(sx, sy), len = 34 * S;
      g.strokeStyle = rgba(INK, .7); g.lineWidth = 1.5 * S; line(X(L.u) - sx / n * len, Y(L.u) - sy / n * len, X(L.u) + sx / n * len, Y(L.u) + sy / n * len);
      glow(E.c, 18); g.fillStyle = INK; circle(X(L.u), Y(L.u) - 9 * S, 9 * S); g.fill(); flat();
      text(`L = ${f(L.u).toFixed(3)}`, clamp(X(L.u) + 14 * S, 0, W - 96 * S), Y(L.u) - 30 * S, F(600, 12 * S, 'm'), E.c, 'left');
      text(`∇ ×${L.trail.length}`, x1(), yt() - 16 * S, F(600, 12 * S, 'm'), E.c, 'right');
    };
    L.down = () => {
      L.trail.push(L.to); const n = L.trail.length;
      L.to = n >= L.goal ? L.m : L.to + (L.m - L.to) * .55;

    };

  }

  function coins(E) {     // YELLOW · деньги и продукт: лови монеты
    const L = {goal: 6, items: [], t: 0, next: .2, bx: W / 2, tx: W / 2};
    const bw = () => 86 * S, by = () => H - 32 * S;
    L.update = dt => {
      L.t += dt; L.bx += (L.tx - L.bx) * Math.min(1, dt * 16);
      if (L.t > L.next) { L.next = L.t + .5; const r = 13 * S; L.items.push({x: W * .12 + Math.random() * W * .76, y: E.top, r, v: (150 + Math.random() * 80) * S, sp: Math.random() * 6}); }
      for (const c of L.items) {
        c.y += c.v * dt; c.sp += dt * 7;
        if (!c.dead && c.y > by() - 12 * S && c.y < by() + 8 * S && Math.abs(c.x - L.bx) < bw() / 2 + c.r * .5) { c.dead = true; burst(c.x, by(), E.c, 10); float(c.x, by() - 22 * S, '+$', E.c); E.hit(); }

      for (const c of L.items) {
        const k = Math.max(.25, Math.abs(Math.cos(c.sp)));
        glow(E.c, 10); g.fillStyle = E.c; g.beginPath(); g.ellipse(c.x, c.y, c.r * k, c.r, 0, 0, 6.2832); g.fill(); flat();
        g.strokeStyle = 'rgba(120,90,0,.7)'; g.lineWidth = 1.5; g.beginPath(); g.ellipse(c.x, c.y, c.r * k * .72, c.r * .72, 0, 0, 6.2832); g.stroke();
        if (k > .6) text('$', c.x, c.y + 1, F(700, 14 * S), 'rgba(90,64,0,.9)');
      }
      const x = L.bx, y = by(), w = bw();
      g.beginPath(); g.moveTo(x - w / 2, y - 10 * S); g.lineTo(x + w / 2, y - 10 * S); g.lineTo(x + w * .38, y + 12 * S); g.lineTo(x - w * .38, y + 12 * S); g.closePath();
      g.fillStyle = rgba(E.c, .16); g.fill(); glow(E.c, 14); g.strokeStyle = E.c; g.lineWidth = 2.5 * S; g.stroke(); flat();
      text('◀', x - w / 2 - 14 * S, y + 2 * S, F(400, 12 * S, 'm'), DIM); text('▶', x + w / 2 + 14 * S, y + 2 * S, F(400, 12 * S, 'm'), DIM);
    };
    L.down = L.move = x => { L.tx = clamp(x, bw() / 2, W - bw() / 2); };
    return L;
  }

  function fires(E) {     // RED · управление: туши пожары в задачах
    const L = {goal: 6, t: 0, next: .3, tiles: []};
    const cs = Math.min(W * .27, (H - E.top - 24 * S) * .3), gap = cs * .12, w0 = cs * 3 + gap * 2, x0 = (W - w0) / 2, y0 = E.top + (H - E.top - w0) / 2;
    for (let i = 0; i < 9; i++) L.tiles.push({x: x0 + (i % 3) * (cs + gap), y: y0 + Math.floor(i / 3) * (cs + gap), s: 'idle', t: 0});
    L.update = dt => {
      L.t += dt;
      for (const k of L.tiles) { k.t -= dt; if (k.s !== 'idle' && k.t <= 0) k.s = 'idle'; }
      if (L.t > L.next) {

        const idle = L.tiles.filter(k => k.s === 'idle'), burning = L.tiles.filter(k => k.s === 'fire').length;
        if (idle.length && burning < 3) { const k = idle[Math.floor(Math.random() * idle.length)]; k.s = 'fire'; k.t = 1.7; }
      }
    };
    L.draw = now => {
      for (const k of L.tiles) {
        cutRect(k.x, k.y, cs, cs, 10 * S);
        if (k.s === 'fire') {
          g.fillStyle = rgba(E.c, .2); g.fill(); glow(E.c, 18); g.strokeStyle = E.c; g.lineWidth = 2 * S; g.stroke(); flat();
          const fl = 1 + .12 * Math.sin(now / 60 + k.x), q = cs * .26 * fl, cx = k.x + cs / 2, cy = k.y + cs / 2 + q * .1;

        } else if (k.s === 'ok') {

          g.beginPath(); g.moveTo(k.x + cs * .3, k.y + cs * .52); g.lineTo(k.x + cs * .45, k.y + cs * .66); g.lineTo(k.x + cs * .72, k.y + cs * .36); g.lineWidth = 3.5 * S; g.stroke();
        } else {
          g.fillStyle = 'rgba(255,255,255,.03)'; g.fill(); g.strokeStyle = 'rgba(157,151,198,.35)'; g.lineWidth = 1.2 * S; g.stroke();
          g.fillStyle = 'rgba(157,151,198,.35)'; for (let j = 0; j < 3; j++) g.fillRect(k.x + cs * .22, k.y + cs * (.34 + j * .14), cs * (j === 2 ? .3 : .56), 2.4 * S);
        }
      }
    };
    L.down = (x, y) => {
      const k = L.tiles.find(k => x >= k.x && x <= k.x + cs && y >= k.y && y <= k.y + cs);
      if (k && k.s === 'fire') { k.s = 'ok'; k.t = .6; burst(k.x + cs / 2, k.y + cs / 2, '#ff9b3d', 12); E.hit(); }
    };
    return L;
  }

  function gate(E) {      // LIGHT_BLUE · этика: опасное не проходит ворота
    const L = {goal: 5, t: 0, next: .2, items: [], flash: 0, n: 0};
    const lanes = () => [E.top + (H - E.top) * .33, E.top + (H - E.top) * .7], gx = () => W * .86, r = 20 * S;
    L.update = dt => {
      L.t += dt; L.flash = Math.max(0, L.flash - dt);
      if (L.t > L.next) { L.next = L.t + .62; L.n++; const bad = L.n === 1 || (L.n % 4 !== 0 && Math.random() < .7); L.items.push({x: -r, lane: Math.random() < .5 ? 0 : 1, bad, sh: 0}); }
      for (const it of L.items) { it.x += (95 + L.t * 4) * S * dt; it.sh = Math.max(0, it.sh - dt); if (!it.past && it.x > gx()) { it.past = true; if (it.bad) L.flash = .25; } }
      L.items = L.items.filter(it => !it.dead && it.x < W + r);
    };
    L.draw = () => {
      const ly = lanes();
      g.setLineDash([10 * S, 10 * S]); g.lineDashOffset = -L.t * 60 * S; g.strokeStyle = 'rgba(157,151,198,.28)'; g.lineWidth = 1.5 * S;
      for (const y of ly) { line(0, y + r * 1.2, W, y + r * 1.2); }
      g.setLineDash([]); g.lineDashOffset = 0;
      const gc = L.flash ? HOT : E.c; glow(gc, 18); g.strokeStyle = gc; g.lineWidth = 4 * S; line(gx(), E.top + 6 * S, gx(), H - 10 * S); flat();
      icon('LIGHT_BLUE', gx(), E.top + 2 * S, 9 * S, gc);
      for (const it of L.items) {
        const x = it.x + (it.sh ? Math.sin(it.sh * 60) * 4 * S : 0), y = ly[it.lane];
        g.globalAlpha = it.past ? .45 : 1;
        if (it.bad) {
          g.beginPath(); g.moveTo(x, y - r); g.lineTo(x + r * .95, y + r * .75); g.lineTo(x - r * .95, y + r * .75); g.closePath();
          g.fillStyle = rgba(HOT, .25); g.fill(); glow(HOT, 12); g.strokeStyle = HOT; g.lineWidth = 2.2 * S; g.stroke(); flat();
          text('!', x, y + r * .22, F(700, 17 * S), HOT);
        } else { glow(CYAN, 10); icon('LIGHT_BLUE', x, y, r * .85, it.sh ? HOT : CYAN); flat(); }
        g.globalAlpha = 1;
      }
    };
    L.down = (x, y) => {
      const ly = lanes(), it = L.items.find(it => !it.past && Math.hypot(x - it.x, y - ly[it.lane]) < r * 1.6);
      if (!it) return;
      if (it.bad) { it.dead = true; burst(it.x, ly[it.lane], HOT, 14); E.hit(); } else it.sh = .3;
    };
    L.lanes = lanes;   // для QA-бота shoot.py
    return L;
  }

  function memory(E) {    // PURPLE · ядро и память: повтори вспышки
    const L = {goal: 4, seq: [], ph: 'wait', t: .8, i: 0, lit: -1, lt: 0, bad: 0};
    for (let k = 0; k < 4; k++) { let p; do p = Math.floor(Math.random() * 4); while (p === L.seq[k - 1]); L.seq.push(p); }
    const hues = ['#b57cf5', '#ff7ad9', '#7d9bff', '#5ef0ff'];
    const geom = () => { const ps = Math.min(W * .34, (H - E.top) * .36), gap = ps * .1, x0 = (W - 2 * ps - gap) / 2, y0 = E.top + (H - E.top - 2 * ps - gap) / 2;
      return {ps, pads: [0, 1, 2, 3].map(j => ({x: x0 + (j % 2) * (ps + gap), y: y0 + Math.floor(j / 2) * (ps + gap)}))}; };
    L.update = dt => {
      L.t -= dt; L.lt -= dt; L.bad = Math.max(0, L.bad - dt); if (L.lt <= 0) L.lit = -1;
      if (L.ph === 'wait' && L.t <= 0) { L.ph = 'show'; L.i = 0; L.t = 0; }
      if (L.ph === 'show' && L.t <= 0) { if (L.i < L.seq.length) { L.lit = L.seq[L.i]; L.lt = .42; L.t = .62; L.i++; } else { L.ph = 'input'; L.i = 0; } }
    };
    L.draw = now => {
      const {ps, pads} = geom();
      pads.forEach((p, j) => {
        cutRect(p.x, p.y, ps, ps, 12 * S);
        const h = L.bad ? HOT : hues[j];
        if (L.lit === j || L.bad) { glow(h, 26); g.fillStyle = h; g.fill(); flat(); } else { g.fillStyle = rgba(hues[j], .13); g.fill(); g.strokeStyle = rgba(hues[j], .8); g.lineWidth = 2 * S; g.stroke(); }
      });
      const cx = W / 2, cy = pads[0].y + ps + ps * .05, k = (now / 700) % 1;
      g.fillStyle = VOID; circle(cx, cy, 15 * S); g.fill();
      g.strokeStyle = L.ph === 'input' ? '#f6e71d' : CYAN; g.lineWidth = 2.5 * S;
      g.beginPath(); g.arc(cx, cy, 11 * S, k * 6.28, k * 6.28 + (L.ph === 'input' ? 6.28 : 4.2)); g.stroke();
      if (L.ph !== 'input') { g.fillStyle = CYAN; circle(cx, cy, 3.5 * S); g.fill(); }
    };
    L.down = (x, y) => {
      if (L.ph !== 'input') return;
      const {ps, pads} = geom(), j = pads.findIndex(p => x >= p.x && x <= p.x + ps && y >= p.y && y <= p.y + ps);
      if (j < 0) return;
      L.lit = j; L.lt = .25;
      if (L.seq[L.i] === j) { L.i++; burst(pads[j].x + ps / 2, pads[j].y + ps / 2, hues[j], 8); E.hit(); } else { L.bad = .45; L.ph = 'wait'; L.t = 1; E.reset(); }
    };
    L.geom = geom;   // для QA-бота shoot.py
    return L;
  }

  function rhythm(E) {    // ORANGE · опыт и идеи (геймдев): тап в такт кольцу
    const L = {goal: 4, R: 30 * S, x: 0, y: 0, rr: 0, gap: 0};
    const spawn = () => { const m = L.R * 2.2; L.x = m + Math.random() * (W - 2 * m); L.y = E.top + m + Math.random() * (H - E.top - 2 * m); L.rr = L.R * 3.4; L.gap = 0; };
    spawn();
    L.update = dt => {
      if (L.gap > 0) { L.gap -= dt; if (L.gap <= 0) spawn(); return; }
      L.rr -= L.R * 2.4 * dt;
      if (L.rr < L.R * .55) { float(L.x, L.y - L.R * 1.5, 'MISS', DIM); L.gap = .35; }
    };
    L.draw = () => {
      if (L.gap > 0) return;
      g.fillStyle = rgba(E.c, .18); circle(L.x, L.y, L.R); g.fill();
      glow(E.c, 14); g.strokeStyle = E.c; g.lineWidth = 2.5 * S; circle(L.x, L.y, L.R); g.stroke(); flat();
      g.fillStyle = E.c; circle(L.x, L.y, 4 * S); g.fill();
      g.strokeStyle = rgba(INK, .9); g.lineWidth = 3 * S; circle(L.x, L.y, L.rr); g.stroke();
    };
    L.down = (x, y) => {
      if (L.gap > 0 || Math.hypot(x - L.x, y - L.y) > L.R * 1.9) return;
      const d = L.rr / L.R;
      if (d > 1.45) { float(L.x, L.y - L.R * 1.5, 'EARLY', DIM); return; }
      float(L.x, L.y - L.R * 1.5, Math.abs(d - 1) < .2 ? 'PERFECT' : 'GOOD', E.c); burst(L.x, L.y, E.c, 16); E.hit(); L.gap = .3;
    };
    return L;
  }

  const LV = {PINK: bubbles, BLUE: chain, GREEN: descent, LIGHT_RED: coins, RED: fires, LIGHT_BLUE: gate, PURPLE: memory, TEAL: rhythm};

  // ── ход игры ──────────────────────────────────────────
  function say(fn, spr) {
    st.sayFn = fn; $('#sayText').textContent = fn(); $('#sayImg').src = B.sprite(spr);
    const el = $('#say'); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  }
  function pips() {
    const ol = $('#pips'); ol.innerHTML = '';
    RING.forEach(k => { const li = document.createElement('li'); li.style.setProperty('--c', COL(k)); if (st.lit.has(k)) li.className = 'on'; ol.append(li); });
    $('#syncTag').textContent = `SYNC ${st.lit.size}/8`;
  }
  function goal() {
    const L = st.lvl, ol = $('#lvlGoal'); ol.innerHTML = '';
    for (let i = 0; i < L.goal; i++) { const li = document.createElement('li'); if (i < L.got) li.className = 'on'; ol.append(li); }
  }
  function levelText() {
    const k = st.key, [name] = D.copy.colours[k][B.lang];
    $('#lvlName').textContent = name; $('#lvlHint').textContent = '';
  }
  function start(k) {
    if (!st.t0) st.t0 = performance.now();
    st.mode = 'level'; st.key = k;
    const E = {c: COL(k), top: 58,
      hit() { const L = st.lvl; if (!L || L.done) return; L.got++; goal();
        if (L.got >= L.goal) { L.done = true; burst(W / 2, H / 2, E.c, 40); float(W / 2, H / 2, '+1', E.c); setTimeout(() => finish(k), 700); } },
      reset() { if (st.lvl) { st.lvl.got = 0; goal(); } }};
    st.lvl = LV[k](E); st.lvl.got = 0;
    $('#lvlBar').hidden = false; $('#lvlBar').style.setProperty('--c', E.c); stage.style.setProperty('--c', E.c);
    levelText(); goal(); cv.style.touchAction = 'none';
    say(() => D.copy.colours[k][B.lang][1], '20-idea');
  }
  function toMap() {
    st.mode = st.lit.size === 8 ? 'win' : 'map'; st.lvl = null; st.key = null;
    $('#lvlBar').hidden = true; cv.style.touchAction = '';
  }
  function finish(k) {
    if (st.key !== k) return;
    st.lit.add(k); toMap(); pips();
    const spr = REACT[st.react++ % REACT.length];
    say(() => B.t('lit', {D: D.copy.colours[k][B.lang][0], N: B.num(D.colours[k].notes)}), spr);
    if (st.lit.size === 8) finale();
  }
  function finale() {

    const G = geo(); RING.forEach((k, i) => setTimeout(() => burst(G.pos[i].x, G.pos[i].y, COL(k), 24), i * 90));
    setTimeout(() => { $('#win').hidden = false; winText(); }, 900);
    say(() => B.t('win_s'), '04-yay');
  }
  function winText() { const s = ((st.t1 - st.t0) / 1000).toLocaleString(B.lang === 'ru' ? 'ru-RU' : 'en-US', {maximumFractionDigits: 1}); $('#winTime').textContent = B.t('win_time', {S: s}); }
  function reset() {
    st.lit.clear(); st.t0 = st.t1 = 0; st.react = 0; $('#win').hidden = true; toMap(); st.mode = 'map'; pips();
    say(() => B.t('hello'), '01-hello');
  }

  function point(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  cv.addEventListener('pointerdown', e => {
    const [x, y] = point(e);
    if (st.mode === 'map') { const k = nodeAt(x, y); if (k && !st.lit.has(k)) start(k); return; }
    if (st.mode === 'level' && st.lvl) { e.preventDefault(); st.lvl.down(x, y); }
  });
  cv.addEventListener('pointermove', e => { if (st.mode === 'level' && st.lvl && st.lvl.move) { const [x, y] = point(e); st.lvl.move(x, y); } });
  cv.tabIndex = 0;
  cv.addEventListener('keydown', e => {
    if (e.key === 'Enter' && st.mode === 'map') { const k = NEXT.find(k => !st.lit.has(k)); if (k) start(k); }
    if (e.key === 'Escape' && st.mode === 'level') toMap();
  });
  $('#lvlBack').addEventListener('click', toMap);
  $('#again').addEventListener('click', reset);

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!W) resize();
    if (W && B.screen() === 'card') {
      g.clearRect(0, 0, W, H);
      if (st.mode === 'level' && st.lvl) { g.fillStyle = rgba(COL(st.key), .04); g.fillRect(0, 0, W, H); st.lvl.update(dt); st.lvl.draw(now); } else drawMap(now);
      drawFx(dt);
      if (st.t0) $('#qTimer').textContent = `${(((st.t1 || now) - st.t0) / 1000).toFixed(1)} s`;
    }
    requestAnimationFrame(frame);
  }

  B.onLang(() => { pips(); if (st.sayFn) $('#sayText').textContent = st.sayFn(); if (st.key) levelText(); if (!$('#win').hidden) winText(); });
  B.onScreen(name => { if (name === 'card') resize(); });
  B.game = {state: st, start, finish, nodeAt, geo};   // для QA
  pips(); say(() => B.t('hello'), '01-hello');
  requestAnimationFrame(frame);
})();

// Экран 2 — вопросы к аватару. Три ступени, от дешёвой к дорогой:
//  1) готовые ответы о продукте (copy.json → intents) — мгновенно, $0;
//  2) ядро мозга прямо в странице (#brainData: главные заметки по степени, собирает make.py) — мгновенно, $0;
//  3) живой мозг на сервере (ceo.nineloom.com/nano-api, ASSETS/nano-ask) — только на новое, ответ дописывается следующим пузырём.
// Живой мозг понимает ru и en; на 中文 спрашиваем по-английски и честно пишем это в плашке.
(function () {
  const B = window.B2B, C = B.D.copy, $ = s => document.querySelector(s);
  const BR = JSON.parse(document.getElementById('brainData').textContent), N = BR.t.length;
  const API = {health: 'https://ceo.nineloom.com/nano-api/health', ask: 'https://ceo.nineloom.com/nano-api/ask'};
  const log = $('#log'), img = $('#askImg');
  const entries = [];     // пузыри перерисовываются при смене языка: у ответа ядра есть fn(lang), у живого — готовый текст
  const LIVE = {on: null};

  // ── поиск по ядру (основы — как в pitch-investor/realbrain.js) ──
  const low = s => String(s).toLowerCase().replace(/ё/g, 'е');
  const HAY = BR.t.map(r => low(r[0] + ' ' + (r[5] || ''))), SUM = BR.t.map(r => low(r[2]));
  const STOP = new Set(('что как где когда зачем почему какой какая какие это эта этот или в во на по за из у о об про для от до ли же ' +
    'ты вы мне меня мой моя мои твой ваш его ее их есть был была было расскажи скажи объясни знаешь мозг мозге мозгу такое такой ' +
    'what how why when where which who is are was the a an of to in on for about and or do does you your me my tell explain know brain').split(' '));
  const ENDS = 'ами ями ого его ому ему ах ях ов ев ой ей ам ям ом ем ую юю ая яя ое ее ые ие ий ый ия ии а я ы и у ю е о ь'.split(' ').sort((a, b) => b.length - a.length);
  const stem = w => { if (/^[а-я]/.test(w)) { for (const e of ENDS) if (w.endsWith(e) && w.length - e.length >= 4) return w.slice(0, -e.length); return w; }
    return w.length > 4 && w.endsWith('s') ? w.slice(0, -1) : w; };
  const stems = q => [...new Set((low(q).match(/[a-zа-я0-9]+/g) || []).filter(w => w.length >= 3 && !STOP.has(w)).map(stem))].slice(0, 8);
  function search(q, k = 3) {
    const st = stems(q); if (!st.length) return [];
    const out = [];
    for (let i = 0; i < N; i++) {
      let s = 0, cover = 0;
      for (const w of st) { const h = (HAY[i].includes(w) ? 3 : 0) + (SUM[i].includes(w) ? 1 : 0); if (h) { s += h; cover++; } }
      if (cover) out.push({i, s: s + 2 * (cover - 1) + 0.25 * Math.log1p(BR.t[i][3])});
    }
    return out.sort((a, b) => b.s - a.s).slice(0, k);
  }

  // ── готовые ответы: ключи всех языков (вопрос на английском в русском режиме тоже узнаём), отвечаем на текущем ──
  const INT = C.intents.map(it => ({...it, all: [].concat(...Object.values(it.keys)).map(low)}));
  function intent(q) {
    const s = ' ' + low(q) + ' ';
    let best = null, bn = 0;
    for (const it of INT) { if (it.weak) continue; const n = it.all.filter(k => s.includes(k)).length; if (n > bn) { best = it; bn = n; } }
    return best;
  }
  const weak = q => { const s = ' ' + low(q) + ' '; return INT.find(it => it.weak && it.all.some(k => s.includes(k))) || null; };

  // ── ответ ядра ──
  const cname = (ci, l) => { const k = BR.k[ci], c = C.colours[k]; return c ? c[l][0] : ((BR.c[k] || [])[l === 'ru' ? 0 : 1] || ''); };
  const title = (s, l) => { s = s.replace(/^(hub|хаб|moc)\s*[:—-]\s*/i, ''); const m = s.match(/^(.+?)\s*\(([^()]+)\)\s*$/);
    s = m ? (l !== 'ru' && /^[\x20-\x7e]+$/.test(m[2]) ? m[2] : m[1]) : s; return s.length > 46 ? s.slice(0, 45).replace(/\s+\S*$/, '') + '…' : s; };
  const quote = (s, l) => (l === 'ru' ? `«${s}»` : l === 'zh' ? `「${s}」` : `“${s}”`);
  const latin = s => { const a = (s.match(/[a-z]/gi) || []).length, c = (s.match(/[а-яё]/gi) || []).length; return a > 3 * c; };
  function compose(hits, l) {
    const r = BR.t[hits[0].i], sum = r[2] || '';
    const near = (r[4].length ? r[4] : hits.slice(1).map(x => x.i)).slice(0, 2).map(j => quote(title(BR.t[j][0], l), l));
    const v = {T: title(r[0], l), C: cname(r[1], l), S: sum};
    const head = l === 'zh' || !sum || (l === 'en' && !latin(sum)) ? B.t('brain_short', v) : B.t('brain', v);
    return head + (near.length ? B.t('near', {L: near.join(l === 'zh' ? '、' : ', ')}) : '');
  }

  // ── пузыри ──
  function render(e) {
    const d = e.el || (e.el = document.createElement('div'));
    d.className = 'msg ' + (e.me ? 'me' : 'bot') + (e.wait ? ' wait' : '');
    d.textContent = e.me ? e.text : (e.fn ? e.fn(B.lang) : e.text);
    const badge = e.badge && e.badge();
    if (badge) { const b = document.createElement('span'); b.className = 'b ' + e.kind; b.textContent = badge; d.append(b); }
    return d;
  }
  function push(e) { entries.push(e); log.append(render(e)); log.scrollTop = log.scrollHeight; return e; }
  function drop(e) { const i = entries.indexOf(e); if (i >= 0) entries.splice(i, 1); if (e.el) e.el.remove(); }
  function face(k) { img.src = B.sprite(k); }
  const ms = t => (t < 10 ? t.toFixed(1) : Math.round(t)).toLocaleString(B.lang === 'ru' ? 'ru-RU' : 'en-US');
  const coreBadge = t => () => B.t('b_core', {MS: ms(t)});

  function live(q, after) {
    const wait = push({wait: true, fn: () => B.t('think')}), t0 = performance.now();
    const ctl = window.AbortController ? new AbortController() : null, to = setTimeout(() => ctl && ctl.abort(), 25000);
    const l = B.lang === 'ru' ? 'ru' : 'en';
    const done = (text, ok) => {
      clearTimeout(to); drop(wait);
      if (text) { const s = ((performance.now() - t0) / 1000).toFixed(1); push({text, kind: 'live', badge: ok ? () => B.t('b_live', {S: s}) : null}); face(ok ? '05-ok' : '18-question'); }
      else if (after) { push({fn: () => B.t('fallback'), kind: 'core', badge: coreBadge(0)}); face('18-question'); }
    };
    // text/plain — «простой» запрос без OPTIONS: на телефоне ответ приходит на круг раньше
    fetch(API.ask, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({q, lang: l}), signal: ctl ? ctl.signal : undefined})
      .then(r => r.json()).then(j => { if (j && j.text) done(j.text, !!j.ok); else done(null); })
      .catch(() => done(null));
  }

  function ask(q, shown) {
    q = String(q || '').trim().slice(0, 400); if (!q) return;
    push({me: true, text: shown || q});
    const t0 = performance.now(), it = intent(q);
    if (it) { const t = performance.now() - t0; push({fn: l => B.fill(it[l]), kind: 'core', badge: coreBadge(t)}); face(it.sprite); return; }
    const hits = search(q), good = hits.length && hits[0].s >= 3;
    if (good) {
      const t = performance.now() - t0; push({fn: l => compose(hits, l), kind: 'core', badge: coreBadge(t)}); face('20-idea');
      if (LIVE.on) live(q, false);
      return;
    }
    const w = weak(q);
    if (w) { const t = performance.now() - t0; push({fn: l => B.fill(w[l]), kind: 'core', badge: coreBadge(t)}); face(w.sprite); return; }
    face('11-think');
    if (LIVE.on === false) { push({fn: () => B.t('fallback'), kind: 'core', badge: coreBadge(performance.now() - t0)}); face('18-question'); return; }
    live(q, true);
  }
  function answerIntent(id, shown) {
    const it = INT.find(x => x.id === id); if (!it) return;
    push({me: true, text: shown});
    const t0 = performance.now(), txt = l => B.fill(it[l]);
    txt(B.lang); push({fn: txt, kind: 'core', badge: coreBadge(performance.now() - t0)}); face(it.sprite);
  }

  // ── подсказки, статус, форма ──
  function chips() {
    const box = $('#chips'); box.innerHTML = '';
    for (const c of C.chips) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = c[B.lang];
      if (c.q) b.className = 'brain';
      b.addEventListener('click', () => (c.id ? answerIntent(c.id, c[B.lang]) : ask(B.lang === 'ru' ? c.q : (c.q_en || c.q), c[B.lang])));
      box.append(b);
    }
  }
  function status() {
    $('#stCore').textContent = B.t('core', {K: B.num(N)});
    $('#stLive').textContent = B.t(LIVE.on === false ? 'live_off' : 'live');
    $('#liveDot').className = 'dot' + (LIVE.on === true ? ' on' : LIVE.on === false ? ' off' : '');
  }
  $('#askForm').addEventListener('submit', e => { e.preventDefault(); const i = $('#q'); ask(i.value); i.value = ''; });

  fetch(API.health, {cache: 'no-store'}).then(r => (r.ok ? r.json() : null))
    .then(j => { LIVE.on = !!(j && j.llm); status(); }).catch(() => { LIVE.on = false; status(); });

  B.onLang(() => { chips(); status(); for (const e of entries) render(e); });
  B.onScreen(name => { if (name === 'ask') { log.scrollTop = log.scrollHeight; } });
  B.chat = {ask, search, intent, entries, live: LIVE};   // для QA
  push({fn: () => B.t('welcome')});
})();

window.B2B.boot();

</script>
</body>
</html>
