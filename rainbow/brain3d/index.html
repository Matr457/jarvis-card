const PRESETS = PRESETS0;   // готовые образы — встроены, без подгрузок
const SIZES = [['S', .6], ['M', 1], ['L', 1.7], ['XL', 2.6]];
function panel() { const t = T();
  $('pres').innerHTML = Object.keys(PRESETS).map(k => `<button data-k="${k}" class="${Object.entries(PRESETS[k]).every(([a, v]) => VIEW[a] === v) ? 'on' : ''}">${k}</button>`).join('');
  $('pres').querySelectorAll('button').forEach(b => b.onclick = () => { Object.assign(VIEW, PRESETS[b.dataset.k]); applyView(); save(); panel(); });
  $('sizes').innerHTML = SIZES.map(([n, v]) => `<button data-v="${v}" class="${VIEW.size === v ? 'on' : ''}">${n}</button>`).join('');
  $('sizes').querySelectorAll('button').forEach(b => b.onclick = () => { VIEW.size = +b.dataset.v; applyView(); save(); panel(); });
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = t[e.dataset.t]);
  $('mats').innerHTML = MATS.map(k => `<button data-k="${k}" class="${k === VIEW.mat ? 'on' : ''}">${t[k]}</button>`).join('');
  $('looks').innerHTML = [['theme', 'dark', t.dark], ['theme', 'light', t.light], ['chars', true, t.chars], ['chars', false, t.nochars], ['lang', 'en', 'EN'], ['lang', 'ru', 'RU']]
    .map(([k, v, n]) => `<button data-k="${k}" data-v="${v}" class="${String(VIEW[k]) === String(v) ? 'on' : ''}">${n}</button>`).join('');
  const SL = [['size', t.size, .3, 4, .05], ['glow', t.glowS, 0, 2, .05], ['edge', t.edge, 0, 3, .05], ['spin', t.spin, 0, 1.5, .05], ['dyn', t.dyn, 0, 1.5, .05]];
  $('sls').innerHTML = SL.map(([k, n, a, b, s]) => `<div class="sl"><label>${n}<b id="o_${k}">${VIEW[k].toFixed(2)}</b></label><input type="range" id="i_${k}" min="${a}" max="${b}" step="${s}" value="${VIEW[k]}"></div>`).join('');
  SL.forEach(([k]) => { const i = $('i_' + k); i.oninput = () => { VIEW[k] = +i.value; $('o_' + k).textContent = VIEW[k].toFixed(2); applyView(); save(); }; });
  $('mats').querySelectorAll('button').forEach(b => b.onclick = () => { VIEW.mat = b.dataset.k; applyView(); save(); panel(); });
  $('looks').querySelectorAll('button').forEach(b => b.onclick = () => { const k = b.dataset.k; VIEW[k] = k === 'chars' ? b.dataset.v === 'true' : b.dataset.v; applyView(); save(); panel(); ui(); });
}
$('bView').onclick = () => $('vp').classList.toggle('on');
if (U.has('vp')) $('vp').classList.add('on');

// ── PNG 4K: перерисовка в 3840 px по ширине, точки и линии компенсируются
function toast(s) { const t = $('toast'); t.textContent = s; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 2600); }
function png4k() { const k = 3840 / W, e0 = uni.uEdge.value; ren.setPixelRatio(k); uni.uP.value = k * 1.15; uni.uEdge.value = e0 * 1.6;
  root.updateMatrixWorld(); ren.render(scene, cam);
  ren.domElement.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `megavertex-${S.view}-${S.mode}-${VIEW.theme}.png`; a.click(); toast('PNG 3840 px ✓'); }, 'image/png');
  ren.setPixelRatio(DPR); uni.uP.value = DPR; uni.uEdge.value = e0; dirty = true; }
$('bPng').onclick = png4k;

// ── запись WebM (canvas.captureStream) + автотур по режимам; MP4 — ffmpeg из WebM
let rec = null;
$('bRec').onclick = () => { if (rec) { rec.stop(); return; }
  const chunks = [], st = ren.domElement.captureStream(30); rec = new MediaRecorder(st, { mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm', videoBitsPerSecond: 12e6 });
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })); a.download = `megavertex-tour-${VIEW.theme}.webm`; a.click(); rec = null; $('bRec').classList.remove('on'); $('bRec').textContent = '● REC'; };
  rec.start(); $('bRec').classList.add('on'); $('bRec').textContent = '■ STOP'; };
const TOUR = [{ view: 'main', mode: 'colors', rainbow: false, petals: false }, { view: 'main', mode: 'colors', petals: true }, { view: 'main', mode: 'bridges', petals: false }, 
  { view: 'main', mode: 'tau', by: 'color' }, { view: 'main', mode: 'coarsen', cl: 1 }, { cl: 2 }, { cl: 3 }, { view: 'main', mode: 'phys', l: 0 }, { l: 1 },
  { view: 'main', mode: 'time', t: 0, play: true, _d: 9500 }, { view: 'nine', mode: 'colors', _card: 'PURPLE' }, { view: 'nine', _card: 'BLUE' }, { view: 'nine', _card: 'LIGHT_RED' }, { view: 'nine', _card: 'GREEN' }];
let tour = -1, tourT = 0;
function tourStep(now) { const st = { ...TOUR[tour] }, cd = st._card; delete st._d; delete st._card; set(st); if (cd) openCard(cd); if (st.play) playT = now; tourT = now; }
$('bTour').onclick = () => { tour = tour < 0 ? 0 : -1; $('bTour').classList.toggle('on', tour >= 0); $('bTour').textContent = tour >= 0 ? '■ TOUR' : '▶ TOUR'; if (tour >= 0) tourStep(performance.now()); };
function tourTick(now) { if (tour < 0) return; if (now - tourT < (TOUR[tour]._d || 4200)) return; tour = (tour + 1) % TOUR.length; tourStep(now); }

// ── управление
let drag = null, pinch = 0;
el.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointerup', () => { drag = null; idleT = performance.now(); }); el.addEventListener('pointercancel', () => drag = null);
el.addEventListener('pointermove', e => { if (drag) { rotY += (e.clientX - drag[0]) * .005; rotX = Math.max(-1.4, Math.min(1.4, rotX + (e.clientY - drag[1]) * .005)); rotXT = rotX;
  drag = [e.clientX, e.clientY]; auto = false; dirty = true; $('tip').style.display = 'none'; } else if (e.pointerType === 'mouse') hoverAt(e); });
el.addEventListener('wheel', e => { e.preventDefault(); distT *= 1 + e.deltaY * .001; }, { passive: false });
el.addEventListener('touchmove', e => { if (e.touches.length === 2) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  if (pinch) distT *= pinch / d; pinch = d; drag = null; } }, { passive: true });
el.addEventListener('touchend', () => pinch = 0);
addEventListener('resize', () => { W = innerWidth; H = innerHeight; ren.setSize(W, H); cam.aspect = W / H; cam.updateProjectionMatrix(); distT = fitOf(to); dirty = true; });
addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; const i = +e.key - 1;
  if (MODES[i]) set({ mode: MODES[i] }); else if (e.key === 'Tab') { e.preventDefault(); set({ view: S.view === 'main' ? 'nine' : 'main' }); }
  else if (e.key === 'v' || e.key === 'м') $('vp').classList.toggle('on'); else if (e.key === 'p' || e.key === 'з') png4k();
  else if (e.key === 'l' || e.key === 'д') { VIEW.theme = VIEW.theme === 'light' ? 'dark' : 'light'; applyView(); save(); panel(); }
  else if (e.key === ' ') { S.play = !S.play; playT = performance.now(); ui(); } });

const tip = $('tip'); let hT = 0;
function hoverAt(e) { const now = performance.now(); if (now - hT < 60) return; hT = now; let best = -1, bd = 100;
  for (let i = 0; i < N; i++) { if (!visT[i]) continue; V3.set(pos[3 * i], pos[3 * i + 1], pos[3 * i + 2]).applyMatrix4(root.matrixWorld).project(cam);
    const x = (V3.x + 1) / 2 * W - e.clientX, y = (1 - V3.y) / 2 * H - e.clientY, d = x * x + y * y; if (d < bd) { bd = d; best = i; } }
  if (best < 0) { tip.style.display = 'none'; return; }
  const n = D.nodes[best]; tip.innerHTML = `<b>${n.t || n.id}</b><small>${n.c} · deg ${deg[best]} · G1 ${T().block} ${MM.levels[0].lab[best]} · φ ${MM.tau_node_color[best]}</small>`;
  tip.style.display = 'block'; tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 12 + 'px'; }

// ── цикл: ≤ 30 fps; плавное появление вершин (vis → visT); проигрывание режимов
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
let last = 0, lastT = 0;
function frame(now) {
  const dt = Math.min(.1, (now - (lastT || now)) / 1000); lastT = now; uni.uT.value = now / 1000;
  tourTick(now);
  if (S.play) { const el2 = now - playT;
    if (S.mode === 'time') { S.t = Math.min(1, S.t + dt / 9); if ($('tS')) $('tS').value = S.t; timeTick(); if (S.t >= 1) { S.play = false; ui(); } }
    else if (S.mode === 'coarsen' && el2 > 2200) { playT = now; set({ cl: (S.cl + 1) % 4, play: true }); }
    else if (S.mode === 'phys' && el2 > 3200) { playT = now; set({ l: 1 - S.l, play: true }); } }

  if (!auto && !STILL && !drag && idleT && now - idleT > 2500) auto = true;

  if (VIEW.dyn > 0 && !STILL) dirty = true;
  if (G9.grp.visible) { G9.spin(STILL ? .06 : dt); dirty = true; }
  if (Math.abs(distT - dist) > dist * .001) { dist += (distT - dist) * .12; dirty = true; }
  const ox = cardC && W > 900 ? ($('card').classList.contains('wide') ? 0 : W * .13) : 0; if (Math.abs(ox - (cam.view ? cam.view.offsetX : 0)) > .5) { cam.setViewOffset(W, H, (cam.view ? cam.view.offsetX : 0) + (ox - (cam.view ? cam.view.offsetX : 0)) * .15, 0, W, H); dirty = true; }
  if (dirty) { sky.rotation.y = -rotY * .15; cam.position.set(0, 0, dist); root.rotation.set(rotX, rotY, 0); root.updateMatrixWorld(); ren.render(scene, cam); drawChars(); dirty = false; }
}
function loop(now) { requestAnimationFrame(loop); if (now - last < 33) return; last = now; frame(now); }

if (G9.on()) rotXT = rotX = -1.0;
applyView(); panel(); colorize(); ui(); G9.grp.visible = G9.on(); target(); pos.set(to); vis.set(visT); vA.needsUpdate = true; sync(); charCentroids(); distT = dist = fitOf(to) * (G9.on() ? 1.15 : 1);
if (U.has('card')) openCard(U.get('card'));
if (SHOT) { let k = 0; const f = () => { dirty = true; frame(performance.now()); if (++k < 15) requestAnimationFrame(f); else document.title = 'SHOT_READY'; }; f(); } else requestAnimationFrame(loop);
</script></body></html>
