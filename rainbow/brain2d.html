<style>
:root{--bg:#070b22;--ink:#eef0ff;--mute:#a9a6d8;--line:rgba(185,166,255,.22);--card:rgba(11,16,48,.9);--acc:#9b7bff}
*{box-sizing:border-box}

#g2l{z-index:2;pointer-events:none}
#g3{background:var(--bg)}

html.embed #cosmos,html.embed #lang{display:none}
html.embed.locked #mode{display:none}
[hidden]{display:none!important}
.top{position:fixed;z-index:3;left:0;right:0;top:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;margin-right:6px}
.brand b{font-size:19px;font-weight:650;line-height:1.2}
.brand span{color:var(--mute);font-size:12.5px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{background:none;border:0;color:var(--mute);font:inherit;font-size:13.5px;padding:6px 13px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}

.find{margin-left:auto;display:flex;align-items:center;gap:8px}

#qn{color:var(--mute);font-size:12.5px;min-width:60px}
.foot{position:fixed;z-index:3;left:0;right:0;bottom:0;padding:10px 16px 12px;pointer-events:none}
.foot>*{pointer-events:auto}
#chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;color:var(--ink);font:inherit;font-size:12.5px;padding:4px 11px 4px 8px;cursor:pointer;white-space:nowrap}
.chip i{width:11px;height:11px;border-radius:50%;flex:none}
.chip small{color:var(--mute);font-size:11.5px}
.chip.off{opacity:.38}
.hint{color:var(--mute);font-size:12px;margin:8px 0 0}
#card{position:fixed;z-index:4;top:76px;right:16px;width:340px;max-height:calc(100% - 200px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
#card .x{position:absolute;top:8px;right:10px;background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer;line-height:1}
#card .cc{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12.5px;padding-right:24px}
#card .cc i{width:11px;height:11px;border-radius:50%;flex:none}
#card h2{font-size:18px;line-height:1.3;margin:6px 0 4px;font-weight:650;overflow-wrap:anywhere}
#card h2.priv{color:var(--mute);font-weight:500}
#card .fo{color:var(--mute);font-size:12px;margin:0;overflow-wrap:anywhere}
#card .sm{margin:10px 0 0;color:#d9d6f5}
#card h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px;font-weight:600}
#card ul{list-style:none;margin:0;padding:0}
#card li button{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;color:#d9d6f5;font:inherit;font-size:13px;padding:4px 0;cursor:pointer}
#card li button:hover{color:#fff}
#card li i{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px}
#card li .p{color:var(--mute)}
@media (max-width:760px){
  .top{padding:10px 12px;gap:8px}.brand{width:100%}.brand b{font-size:17px}
  .find{margin-left:0;width:100%}#q{flex:1;width:auto}
  .foot{padding:8px 12px 10px}#chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .hint{display:none}
  #card{top:auto;bottom:58px;left:12px;right:12px;width:auto;max-height:46%}
}

<script>// Космос + звёзды — общий фон всех HTML и продукции (решение оператора 08.11.2026, канон designer/design-canon.md).
// Глубокий индиго + лавандовая туманность (CSS на body), тихое мерцание звёзд + лёгкий параллакс за мышью (этот canvas).
// Подключение: <canvas id="cosmos"></canvas> + COSMOS.mount(document.getElementById('cosmos'), {density, parallax})
// Уважает prefers-reduced-motion: рисует один кадр без мерцания и параллакса. Ничего не рисует поверх контента — canvas под всем (z-index:-1).
window.COSMOS = (() => {
  function mount(canvas, opts = {}) {
    const ctx = canvas.getContext('2d'); if (!ctx) return null;
    const density = opts.density || 1, par = opts.parallax == null ? 10 : opts.parallax;
    const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    let W = 0, H = 0, stars = [], mx = 0, my = 0, tx = 0, ty = 0, raf = 0;
    const glow = document.createElement('canvas'); glow.width = glow.height = 32;
    const g = glow.getContext('2d'), gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    gr.addColorStop(0, 'rgba(226,218,255,1)'); gr.addColorStop(.35, 'rgba(185,166,255,.55)'); gr.addColorStop(1, 'rgba(124,92,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
    function seed() {
      const n = Math.min(650, Math.round(W * H / 5200 * density)); stars = [];
      for (let i = 0; i < n; i++) {
        const big = Math.random() < .06;
        stars.push({ x: Math.random() * W, y: Math.random() * H, r: big ? 1.6 + Math.random() * 1.6 : .4 + Math.random() * 1.1,
          ph: Math.random() * 6.28, sp: .4 + Math.random() * 1.3, L: 1 + Math.floor(Math.random() * 3), big, a: .35 + Math.random() * .5 });
      }
    }
    function resize() {
      const dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); seed(); if (still) draw(0);
    }
    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      for (const s of stars) {
        const tw = still ? 1 : .55 + .45 * Math.sin(t * s.sp + s.ph);
        const x = s.x + mx * s.L * par / 3, y = s.y + my * s.L * par / 3;
        if (s.big) { const d = s.r * 9 * (.8 + .2 * tw); ctx.globalAlpha = s.a * tw; ctx.drawImage(glow, x - d / 2, y - d / 2, d, d); }
        ctx.globalAlpha = s.a * tw; ctx.fillStyle = s.big ? '#f3efff' : '#d8d2ff';
        ctx.beginPath(); ctx.arc(x, y, s.r, 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    function loop(now) { mx += (tx - mx) * .04; my += (ty - my) * .04; draw(now / 1000); raf = requestAnimationFrame(loop); }
    addEventListener('resize', resize); resize();
    if (!still) {
      addEventListener('mousemove', e => { tx = e.clientX / W - .5; ty = e.clientY / H - .5; });
      raf = requestAnimationFrame(loop);
    }
    return { destroy() { cancelAnimationFrame(raf); removeEventListener('resize', resize); } };
  }
  return { mount };
})();
</script>
<script id="force-src">// Физика графа в 3D — те же уравнения, что d3-force (на них стоит граф Obsidian):
// пружина связи (bias и сила 1/min(степеней)), отталкивание «все со всеми» через октодерево Барнса — Хата (θ = 0.9),
// притяжение к центру и охлаждение alpha → 0. Ползунки Obsidian: Center · Repel · Link force · Link distance.
(function () {
  'use strict';
  const THETA2 = .81, DIST_MIN2 = 1, ALPHA_MIN = .001, ALPHA_DECAY = 1 - Math.pow(ALPHA_MIN, 1 / 300), VEL_KEEP = .6;

  function Force(N, E) {
    const M = E.length >> 1;
    const pos = new Float32Array(N * 3), vel = new Float32Array(N * 3), deg = new Uint16Array(N);
    const bias = new Float32Array(M), base = new Float32Array(M);
    for (let k = 0; k < M; k++) { deg[E[2 * k]]++; deg[E[2 * k + 1]]++; }
    for (let k = 0; k < M; k++) {
      const s = E[2 * k], t = E[2 * k + 1];
      bias[k] = deg[s] / (deg[s] + deg[t]); base[k] = 1 / Math.min(deg[s], deg[t]);
    }
    const P = {center: .3, repel: .45, link: .6, dist: .35};            // ползунки 0…1
    const f = {alpha: 1, ticks: 0, paused: false, pos, vel, deg, P};
    const charge = () => -(8 + 140 * P.repel * P.repel);
    const linkDist = () => 10 + 170 * P.dist * P.dist;
    const linkK = () => .1 + 1.4 * P.link;
    const gravity = () => .02 + .5 * P.center * P.center;

    function seed() {   // d3-force-3d: филлотаксис по сфере, хабы (первые индексы) — в центре
      for (let i = 0; i < N; i++) {
        const r = 10 * Math.cbrt(.5 + i), phi = Math.acos(1 - 2 * (i + .5) / N), th = Math.sqrt(N * Math.PI) * phi;
        pos[3 * i] = r * Math.sin(phi) * Math.cos(th); pos[3 * i + 1] = r * Math.sin(phi) * Math.sin(th); pos[3 * i + 2] = r * Math.cos(phi);
      }
      vel.fill(0); f.alpha = 1; f.ticks = 0;
    }

    // ── октодерево: плоские массивы, без объектов — кадр без мусора ──
    const cap = 8 * N + 64;
    const cx = new Float32Array(cap), cy = new Float32Array(cap), cz = new Float32Array(cap), hs = new Float32Array(cap);
    const ms = new Float32Array(cap), px = new Float32Array(cap), py = new Float32Array(cap), pz = new Float32Array(cap);
    const body = new Int32Array(cap), ch = new Int32Array(cap * 8), stack = new Int32Array(512);
    let used = 0;
    const mk = (x, y, z, h) => { const n = used++; cx[n] = x; cy[n] = y; cz[n] = z; hs[n] = h; ms[n] = px[n] = py[n] = pz[n] = 0; body[n] = -1; ch.fill(-1, n * 8, n * 8 + 8); return n; };
    const octant = (n, x, y, z) => (x > cx[n] ? 1 : 0) | (y > cy[n] ? 2 : 0) | (z > cz[n] ? 4 : 0);
    const kid = (n, o) => {
      let c = ch[n * 8 + o];
      if (c < 0) { const h = hs[n] * .5; c = mk(cx[n] + (o & 1 ? h : -h), cy[n] + (o & 2 ? h : -h), cz[n] + (o & 4 ? h : -h), h); ch[n * 8 + o] = c; }
      return c;
    };
    function build() {
      let lo = Infinity, hi = -Infinity;
      for (let i = 0; i < N * 3; i++) { const v = pos[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
      const h = (hi - lo) / 2 + 1, m = (hi + lo) / 2; used = 0; mk(m, m, m, h);
      for (let i = 0; i < N; i++) {
        const x = pos[3 * i], y = pos[3 * i + 1], z = pos[3 * i + 2]; let n = 0;
        for (;;) {
          ms[n]++; px[n] += x; py[n] += y; pz[n] += z;
          if (body[n] === -1) { body[n] = i; break; }
          if (body[n] >= 0) {
            if (hs[n] < 1e-3 || used > cap - 9) break;                        // слились в одну точку — считаем скопом
            const b = body[n], c = kid(n, octant(n, pos[3 * b], pos[3 * b + 1], pos[3 * b + 2]));
            body[n] = -2; ms[c] = 1; px[c] = pos[3 * b]; py[c] = pos[3 * b + 1]; pz[c] = pos[3 * b + 2]; body[c] = b;
          }
          n = kid(n, octant(n, x, y, z));
        }
      }
    }

    function repel(alpha) {
      const q = charge() * alpha;
      for (let i = 0; i < N; i++) {
        const x = pos[3 * i], y = pos[3 * i + 1], z = pos[3 * i + 2]; let vx = 0, vy = 0, vz = 0, sp = 0; stack[sp++] = 0;
        while (sp) {
          const n = stack[--sp], m = ms[n]; if (!m) continue;
          const dx = px[n] / m - x, dy = py[n] / m - y, dz = pz[n] / m - z; let l2 = dx * dx + dy * dy + dz * dz;
          const b = body[n], w2 = hs[n] * hs[n] * 4;
          if (b === -2 && w2 >= THETA2 * l2) { for (let o = 0; o < 8; o++) { const c = ch[n * 8 + o]; if (c >= 0) stack[sp++] = c; } continue; }
          if (b === i && m === 1) continue;
          if (l2 < DIST_MIN2) l2 = Math.sqrt(DIST_MIN2 * l2) || 1;
          const w = q * m / l2; vx += dx * w; vy += dy * w; vz += dz * w;
        }
        vel[3 * i] += vx; vel[3 * i + 1] += vy; vel[3 * i + 2] += vz;
      }
    }
    function springs(alpha) {
      const d0 = linkDist(), kk = linkK();
      for (let k = 0; k < M; k++) {
        const s = E[2 * k] * 3, t = E[2 * k + 1] * 3;
        let dx = pos[t] + vel[t] - pos[s] - vel[s], dy = pos[t + 1] + vel[t + 1] - pos[s + 1] - vel[s + 1], dz = pos[t + 2] + vel[t + 2] - pos[s + 2] - vel[s + 2];
        const len = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1e-6, a = (len - d0) / len * alpha * kk * base[k], b = bias[k];
        dx *= a; dy *= a; dz *= a;
        vel[t] -= dx * b; vel[t + 1] -= dy * b; vel[t + 2] -= dz * b;
        vel[s] += dx * (1 - b); vel[s + 1] += dy * (1 - b); vel[s + 2] += dz * (1 - b);
      }
    }
    function tick() {
      f.alpha += -f.alpha * ALPHA_DECAY; const a = f.alpha, g = gravity() * a;
      springs(a); build(); repel(a);
      let mx = 0, my = 0, mz = 0;
      for (let i = 0; i < N; i++) {
        vel[3 * i] -= pos[3 * i] * g; vel[3 * i + 1] -= pos[3 * i + 1] * g; vel[3 * i + 2] -= pos[3 * i + 2] * g;
        vel[3 * i] *= VEL_KEEP; vel[3 * i + 1] *= VEL_KEEP; vel[3 * i + 2] *= VEL_KEEP;
        pos[3 * i] += vel[3 * i]; pos[3 * i + 1] += vel[3 * i + 1]; pos[3 * i + 2] += vel[3 * i + 2];
        mx += pos[3 * i]; my += pos[3 * i + 1]; mz += pos[3 * i + 2];
      }
      mx /= N; my /= N; mz /= N;                                                 // forceCenter: облако не уплывает
      for (let i = 0; i < N; i++) { pos[3 * i] -= mx; pos[3 * i + 1] -= my; pos[3 * i + 2] -= mz; }
      f.ticks++;
    }
    Object.defineProperty(f, 'running', {get() { return !f.paused && f.alpha > ALPHA_MIN; }});   // не Object.assign: он бы зафиксировал значение геттера
    Object.assign(f, {
      tick, seed,
      reheat(a) { f.alpha = Math.max(f.alpha, a == null ? .3 : a); },
      settle(n) { for (let k = 0; k < n && f.alpha > ALPHA_MIN; k++) tick(); },
      radius() {          // 95-й перцентиль расстояния до центра — рамка камеры без выбросов-одиночек
        const r = new Float32Array(N); for (let i = 0; i < N; i++) r[i] = Math.hypot(pos[3 * i], pos[3 * i + 1], pos[3 * i + 2]);
        r.sort(); return r[Math.floor(N * .95)] || 1;
      }});
    seed();
    return f;
  }
  window.G3 = window.G3 || {}; window.G3.Force = Force;
})();

// размера, оттенки цветовых семейств, тонкие серые связи, без свечения.

      const [top, bot] = on.pad ? on.pad() : [60, 60], free = Math.max(120, g.h - top - bot);

  const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
  let lang = Q.get('lang') || store('brain-obsidian-lang') || 'ru'; if (!T[lang]) lang = 'ru';
  // режим: ?mode=3d или #3d (шелл 3×3 зовёт подэкраны 2.1 / 2.2 через #3d / #2d); внутри шелла — без своего космоса и языков
  const H = location.hash.replace('#', ''), EMBED = window.top !== window || Q.has('embed');
  let mode = (H || Q.get('mode')) === '3d' ? '3d' : '2d', sel = -1;
  if (EMBED) { document.documentElement.classList.add('embed'); if (H || Q.has('mode')) document.documentElement.classList.add('locked'); }
  const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
  const num = n => n.toLocaleString(lang === 'ru' ? 'ru-RU' : 'en-US');

  // космос живёт только под 2D: в 3D его закрывает свой фон шаров — там он зря тратил бы кадр
  let sky = null;
  const cosmos = on => { if (EMBED) return; if (on && !sky) sky = COSMOS.mount($('#cosmos'), {density: .55, parallax: 4});
    if (!on && sky) { sky.destroy(); sky = null; } };

  // ── 2D: весь мозг, раскладка готовая (посчитана при сборке) ──
  const G = G2.Graph2D($('#g2'), $('#g2l'), D, {select: i => { sel = i; card(); },
    pad: () => [$('.top').getBoundingClientRect().bottom + 8, innerHeight - $('#chips').getBoundingClientRect().top + 8]});
  if (Q.has('still')) G.settle();
  if (Q.has('bench')) window.BRAIN = G;                 // замер science/bench_brain.py: найти пустое место и ноту

  // ── 3D: 600 матовых шаров, полушария как на листе материала; координаты готовые — открывается сразу ──
  let R3 = null, cam = null, idle = 0, drag = null;
  function init3d() {
    const B = D.b3, n = B.c.length, hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
    const col = new Float32Array(n * 3), rad = new Float32Array(B.r); B.h.forEach((h, i) => col.set(hex(h), i * 3));
    const pos = Float32Array.from(B.p), ext = B.ext;
    const cv = $('#g3');
    // оба полушария в кадре и на узком телефоне: дистанция по меньшей стороне (обзор камеры 45° по вертикали)
    const away = () => ext / (Math.tan(Math.PI / 8) * Math.min(1, (cv.clientWidth || 1) / (cv.clientHeight || 1))) * 1.12;
    cam = {yaw: 0, pitch: .08, dist: away()};
    addEventListener('resize', () => { cam.dist = away(); });
    R3 = BALLS.Renderer(cv, {N: n, pos, col, rad, E: new Uint32Array(B.e), spokes: B.s, nanoR: B.nanoR, dustR: ext * 4}, 'matte');
    cv.addEventListener('pointerdown', e => { drag = {x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY}; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointermove', e => { if (!drag) return;
      cam.yaw -= (e.clientX - drag.x) * .006; cam.pitch = Math.max(-1.2, Math.min(1.2, cam.pitch + (e.clientY - drag.y) * .006));
      drag.x = e.clientX; drag.y = e.clientY; idle = performance.now(); });
    const up = e => { if (!drag) return;
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 5) { const b = cv.getBoundingClientRect(), i = R3.pick(cam, e.clientX - b.left, e.clientY - b.top);
        sel = i >= 0 ? D.b3.bm[i] : -1; card(); idle = performance.now(); }
      drag = null; };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', () => { drag = null; });
    cv.addEventListener('dblclick', () => { cam.yaw = 0; cam.pitch = .08; });
    let last = performance.now();
    (function loop(now) {
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      if (mode === '3d') { if (!Q.has('still') && !drag && now - idle > 2500) cam.yaw += dt * .1; R3 && R3.draw(cam, Q.has('still') ? 0 : now / 1000); }
      requestAnimationFrame(loop);
    })(last);
  }

  function setMode(m) {
    mode = m; $('#g2').hidden = $('#g2l').hidden = m !== '2d'; $('#g3').hidden = m !== '3d'; G.active = m === '2d'; cosmos(m === '2d');
    if (m === '3d' && !R3) init3d();
    if (m === '2d' && sel >= 0) G.select(sel);          // нота, выбранная в 3D, подсвечена и в 2D
    document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
    $('#chips').style.visibility = m === '2d' ? 'visible' : 'hidden';
    text();
  }

  // ── карточка ноты: цвет, заголовок, папка, смысл, соседи ──
  const dot = i => D.hx[D.hi[i]];
  function card() {
    const el = $('#card'), L = T[lang], li = LI[lang];
    if (sel < 0) { el.hidden = true; return; }
    const k = D.k[D.c[sel]], open = !!D.t[sel];
    el.hidden = false;
    el.querySelector('.cc i').style.background = dot(sel);
    el.querySelector('.cc span').textContent = k.name[li] + ' · ' + k.short[li] + (k.who !== '—' ? ' · ' + k.who : '');
    const h = el.querySelector('h2'); h.textContent = open ? D.k[D.c[sel]].short[LI[lang]] : L.priv; h.className = open ? '' : 'priv';
    el.querySelector('.fo').textContent = D.fo[D.fi[sel]];
    const sm = el.querySelector('.sm'); sm.textContent = D.sm[sel] || ''; sm.hidden = !D.sm[sel];
    const ns = [...G.nb(sel)].sort((a, b) => D.d[b] - D.d[a]);
    el.querySelector('h3').textContent = fmt(L.links, {n: num(ns.length)});
    const ul = el.querySelector('ul'); ul.textContent = '';
    ns.slice(0, 16).forEach(j => { const b = document.createElement('button'); b.type = 'button';
      b.innerHTML = '<i></i><span></span>'; b.querySelector('i').style.background = dot(j);
      const s = b.querySelector('span'); s.textContent = D.t[j] ? D.k[D.c[j]].short[LI[lang]] : L.priv; if (!D.t[j]) s.className = 'p';
      b.addEventListener('click', () => { if (mode === '2d') G.focus(j); else { sel = j; card(); } });
      const it = document.createElement('li'); it.appendChild(b); ul.appendChild(it); });
    if (ns.length > 16) { const it = document.createElement('li'); it.className = 'p'; it.style.cssText = 'color:var(--mute);font-size:12.5px;padding:4px 0';
      it.textContent = fmt(L.more, {n: num(ns.length - 16)}); ul.appendChild(it); }
  }
  $('#card .x').addEventListener('click', () => { G.select(-1); sel = -1; card(); });

  // ── цвета: клик — скрыть / показать ──
  const hide = new Uint8Array(D.k.length);
  function chips() {
    const li = LI[lang], box = $('#chips'); box.textContent = '';
    D.k.forEach((k, ci) => { if (!k.n) return;
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (hide[ci] ? ' off' : '');
      b.innerHTML = '<i></i><span></span><small></small>'; b.querySelector('i').style.background = k.hex;
      b.querySelector('span').textContent = k.short[li]; b.querySelector('small').textContent = num(k.n);
      b.title = k.name[li]; b.addEventListener('click', () => { hide[ci] ^= 1; G.setHidden(hide); chips(); });
      box.appendChild(b); });
  }

  // ── поиск по заголовкам открытых нот ──
  const low = D.t.map(t => t.toLowerCase());
  let qMatch = [];
  function search() {
    const q = $('#q').value.trim().toLowerCase(), L = T[lang];
    if (q.length < 2) { G.setMatch(null); qMatch = []; $('#qn').textContent = ''; return; }
    const m = new Uint8Array(N); qMatch = [];
    low.forEach((t, i) => { if (t.includes(q)) { m[i] = 1; qMatch.push(i); } });
    qMatch.sort((a, b) => D.d[b] - D.d[a]);
    G.setMatch(qMatch.length ? m : null);
    $('#qn').textContent = qMatch.length ? fmt(L.found, {n: num(qMatch.length)}) : L.none;
  }
  $('#q').addEventListener('input', search);
  $('#q').addEventListener('keydown', e => { if (e.key === 'Enter' && qMatch.length) { if (mode !== '2d') setMode('2d'); G.focus(qMatch[0]); $('#q').blur(); } });

  function text() {
    const L = T[lang]; document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = L[el.dataset.t]; });
    document.title = L.title;
    $('#stat').textContent = fmt(L.stat, {n: num(2388), e: num(24326)});
    $('#q').placeholder = L.q;
    $('#hint').textContent = mode === '2d' ? L.hint2 : D.hemi[LI[lang]] + ' ' + L.hint3;
    document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
    chips(); card(); search();
  }
  document.querySelectorAll('#lang button').forEach(b => b.addEventListener('click', () => { lang = b.dataset.l; store('brain-obsidian-lang', lang); text(); }));
  document.querySelectorAll('#mode button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.m)));
  setMode(mode);
  addEventListener('hashchange', () => { const m = location.hash.replace('#', ''); if (m === '2d' || m === '3d') setMode(m); });
  if (Q.has('sel')) { const i = +Q.get('sel'); if (i >= 0 && i < N) G.select(i); }
})();
</script></body></html>
