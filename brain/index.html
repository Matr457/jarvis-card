<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NANO Brain 3D</title>
<meta name="description" content="NANO — a second brain in 3D: six AI agents orbit the NANO core, each holding its top notes of a real 2 384-note knowledge graph.">
<meta name="theme-color" content="#06041a">
<meta property="og:type" content="website">
<meta property="og:title" content="NANO — second brain in 3D">
<meta property="og:description" content="Six AI agents orbit the NANO core. Real knowledge graph: 2 384 notes, 17 481 links. Orbit it like Blender.">
<meta property="og:image" content="https://matr457.github.io/jarvis-card/brain/assets/og.jpg">
<meta property="og:url" content="https://matr457.github.io/jarvis-card/brain/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>/* Мозг NANO 3D — космос (индиго + лавандовая туманность) × вьюпорт Blender (заголовок, гизмо, боковая панель N, ползунки-поля) */
:root{
  --bg:#05031a; --ink:#ece8ff; --dim:#a69fce; --mute:#6f689a;
  --panel:rgba(15,11,42,.72); --panel2:rgba(30,23,74,.62); --line:rgba(181,124,245,.16); --line2:rgba(181,124,245,.34);
  --acc:#9b7bff; --accf:rgba(155,123,255,.46); --sel:#ffa64d;
  --hdr:52px; --sideW:300px; --r:10px;
  --f:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:13px/1.4 var(--f);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#gl.drag{cursor:grabbing} #gl.pt{cursor:pointer} #gl.move{cursor:move}

/* ---------- заголовок (header Blender) ---------- */
#top{position:fixed;left:0;right:0;top:0;height:var(--hdr);display:flex;align-items:center;gap:14px;padding:0 12px 0 14px;
  background:linear-gradient(180deg,rgba(9,6,30,.86),rgba(9,6,30,.55));border-bottom:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0;color:inherit;text-decoration:none}
.brand img{border-radius:8px;box-shadow:0 0 0 1px var(--line2),0 0 18px rgba(155,123,255,.35)}
.brand b{display:block;font-size:14px;font-weight:650;letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.views{display:flex;margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px}
.views button{padding:5px 11px;border-radius:6px;color:var(--dim);font-weight:500;font-size:12.5px;white-space:nowrap}
.views button:hover{color:var(--ink);background:rgba(155,123,255,.12)}
.views button.on{color:#fff;background:var(--accf)}
.tools{display:flex;gap:4px}
.tools button{height:32px;min-width:32px;border-radius:8px;display:grid;place-items:center;color:var(--dim);border:1px solid transparent}
.tools button:hover{color:var(--ink);background:rgba(155,123,255,.12)}
.tools button.on{color:#fff;background:var(--accf);border-color:var(--line2)}
.tools .txt{font-weight:600;font-size:12px;padding:0 8px;border:1px solid var(--line)}
.ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ---------- текст вьюпорта (как «User Perspective» в Blender) ---------- */
#vtext{position:fixed;left:16px;top:calc(var(--hdr) + 12px);font:12px/1.55 var(--mono);color:var(--dim);pointer-events:none;z-index:2;
  text-shadow:0 1px 6px #05031a}
#vName{color:var(--ink);font-weight:500}
#vObj b{color:var(--sel);font-weight:500}
#vStats{margin-top:6px;white-space:pre;color:var(--mute)}
#vStats i{font-style:normal;color:var(--dim)}

/* ---------- гизмо навигации ---------- */
#giz{position:fixed;top:calc(var(--hdr) + 10px);right:calc(var(--sideW) + 18px);z-index:3;display:flex;flex-direction:column;align-items:center;gap:6px;transition:right .25s}
body.noside #giz{right:14px}
#gz{width:96px;height:96px;border-radius:50%;cursor:grab;touch-action:none}
#gz:hover{background:radial-gradient(circle,rgba(155,123,255,.13),rgba(155,123,255,0) 70%)}
.gb{display:flex;flex-direction:column;gap:4px}
.gb button{width:30px;height:30px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-size:17px;line-height:1}
.gb button:hover{color:var(--ink);border-color:var(--line2)}

/* ---------- боковая панель N ---------- */
#side{position:fixed;top:calc(var(--hdr) + 8px);right:8px;bottom:8px;width:var(--sideW);overflow:auto;z-index:4;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:6px 10px 10px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;transition:transform .25s,opacity .25s}
body.noside #side{transform:translateX(calc(100% + 16px));opacity:0;pointer-events:none}
#side details{border-bottom:1px solid var(--line);padding:4px 0 10px}
#side details:last-of-type{border-bottom:0}
#side summary{list-style:none;cursor:pointer;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:8px 2px 8px 18px;position:relative}
#side summary::-webkit-details-marker{display:none}
#side summary::before{content:'';position:absolute;left:3px;top:13px;border:4.5px solid transparent;border-top-color:var(--dim);border-bottom:0;transition:transform .15s}
#side details:not([open]) summary::before{transform:rotate(-90deg)}
.foot{color:var(--mute);font-size:11px;line-height:1.5;margin:10px 2px 0}

/* outliner */
.orow{display:grid;grid-template-columns:14px 1fr auto 26px;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 6px;border-radius:7px}
.orow:hover{background:rgba(155,123,255,.1)}
.orow.on{background:rgba(255,166,77,.12);box-shadow:inset 0 0 0 1px rgba(255,166,77,.35)}
.orow .dot{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.orow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .nm small{display:block;font-weight:400;color:var(--dim);font-size:11px}
.orow .ct{font:11px var(--mono);color:var(--dim)}
.orow .eye{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--dim)}
.orow .eye:hover{background:rgba(155,123,255,.16);color:var(--ink)}
.orow .eye svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5}
.orow.off .nm,.orow.off .dot{opacity:.35}

/* ползунок-поле Blender: заливка = значение, подпись слева, число справа */
.bf{position:relative;display:block;height:28px;margin:7px 0;border-radius:7px;background:rgba(8,6,26,.7);border:1px solid var(--line);overflow:hidden}
.bf input{-webkit-appearance:none;appearance:none;position:absolute;inset:0;width:100%;height:100%;margin:0;background:transparent;cursor:ew-resize;touch-action:pan-y}
.bf::before{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--p,50%);background:linear-gradient(90deg,rgba(155,123,255,.28),var(--accf));pointer-events:none}
.bf input::-webkit-slider-thumb{-webkit-appearance:none;width:3px;height:28px;background:#d9ccff;border-radius:1px;box-shadow:0 0 8px #b9a4ff}
.bf input::-moz-range-thumb{width:3px;height:28px;background:#d9ccff;border:0;border-radius:1px}
.bf .bl,.bf .bv{position:absolute;top:0;line-height:26px;pointer-events:none;font-size:12.5px}
.bf .bl{left:10px;color:var(--ink)} .bf .bv{right:10px;font:12px/26px var(--mono);color:#fff}
.bf:hover{border-color:var(--line2)}
.note{color:var(--mute);font-size:11px;margin:-3px 2px 6px}
.seg{display:flex;gap:4px;margin:8px 0}
.seg button{flex:1;padding:6px 0;border-radius:7px;background:rgba(8,6,26,.7);border:1px solid var(--line);color:var(--dim);font-weight:500}
.seg button.on{background:var(--accf);color:#fff;border-color:var(--line2)}
.seg button:hover{color:var(--ink)}
.energy{font:11px var(--mono);color:var(--mute);margin:4px 2px 0;display:flex;justify-content:space-between}
.energy i{display:inline-block;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--acc),#ffb3e1);vertical-align:middle;margin-left:6px;transition:width .2s}

/* ---------- карточка выбранного ---------- */
#card,#ans{position:fixed;left:14px;bottom:72px;width:330px;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px 16px 12px;box-shadow:0 18px 50px rgba(0,0,0,.45);animation:up .25s ease}
#ans{max-height:calc(100vh - var(--hdr) - 96px);overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
#ans[hidden],#card[hidden]{display:none}
body.asking #card{display:none}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
#card .hd,#ans .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#card .hd .dot,#ans .hd .dot{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c);flex:none}
#card .hd b,#ans .hd b{font-size:16px;font-weight:700}
#card .hd small,#ans .hd small{display:block;color:var(--dim);font-size:12px}
#card .x,#ans .x{margin-left:auto;width:26px;height:26px;border-radius:7px;color:var(--dim);font-size:16px}
#card .x:hover,#ans .x:hover{background:rgba(155,123,255,.14);color:var(--ink)}

/* ---------- спросить мозг: строка вопроса + панель ответа (живой мозг на сервере, ASSETS/nano-ask) ---------- */
#ask{position:fixed;left:14px;bottom:14px;width:330px;height:48px;z-index:5;display:flex;align-items:center;gap:8px;padding:0 5px 0 14px;
  background:var(--panel);border:1px solid var(--line2);border-radius:24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 10px 34px rgba(0,0,0,.42),0 0 26px rgba(155,123,255,.16);transition:border-color .2s,box-shadow .2s}
#ask:focus-within{border-color:rgba(181,124,245,.7);box-shadow:0 10px 34px rgba(0,0,0,.42),0 0 30px rgba(155,123,255,.34)}
#ask .live{width:8px;height:8px;border-radius:50%;flex:none;background:var(--mute);transition:background .3s,box-shadow .3s}
#ask.on .live{background:#6ee7b7;box-shadow:0 0 9px #6ee7b7;animation:live 2.4s ease-in-out infinite}
#ask.off .live{background:#ff8a8a}
@keyframes live{50%{opacity:.45}}
#ask input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:var(--ink);font:14px var(--f)}
#ask input::placeholder{color:var(--dim)}
#ask button{height:38px;padding:0 15px;border-radius:19px;flex:none;color:#fff;font-weight:600;font-size:13px;
  background:linear-gradient(135deg,#8f6dff,#d46cf0 60%,#ff7ad9);box-shadow:0 0 16px rgba(212,108,240,.35)}
#ask button:disabled{opacity:.45;cursor:default;box-shadow:none}
#ans .q{margin:2px 0 8px;font-weight:600;font-size:14px;line-height:1.4;color:#fff}
#ans .a{font-size:13.5px;line-height:1.56;color:var(--ink);white-space:pre-line}
#ans .think{color:var(--dim)}
#ans .dots i{display:inline-block;width:4px;height:4px;margin-left:3px;border-radius:50%;background:var(--acc);animation:dot 1.1s infinite}
#ans .dots i:nth-child(2){animation-delay:.18s} #ans .dots i:nth-child(3){animation-delay:.36s}
@keyframes dot{0%,80%,100%{opacity:.2;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
#ans .src{display:flex;flex-direction:column;gap:1px}
#ans .sc{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:4px 6px;border-radius:7px;font-size:12.5px}
#ans .sc:hover{background:rgba(155,123,255,.1)}
#ans .sc .dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c);flex:none}
#ans .sc .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ans .sc small{margin-left:auto;padding-left:8px;color:var(--dim);font:11px var(--mono);flex:none}
#ans .try{display:flex;flex-direction:column;gap:6px;margin-top:2px}
#ans .try button{text-align:left;padding:7px 11px;border-radius:10px;border:1px solid var(--line2);background:rgba(155,123,255,.08);color:var(--ink);font-size:13px}
#ans .try button:hover{background:rgba(155,123,255,.18)}
#ans .deal{display:inline-block;margin-top:10px;color:#cdb8ff;font-size:12px;text-decoration:none;border-bottom:1px solid rgba(205,184,255,.35)}
#ans .deal:hover{color:#fff}
body.answered #labs .ml{visibility:hidden}  /* во время ответа луны подписывает слой ответа (brain.chat.js) */
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:12.5px;margin:6px 0}
.kv span{color:var(--dim)} .kv b{font:500 12.5px var(--mono);text-align:right}
.bar{grid-column:1/-1;height:4px;border-radius:2px;background:rgba(155,123,255,.12);margin:-1px 0 3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:2px}
.sub{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin:10px 0 4px}
.br{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:2px 0}
.br .dot{width:8px;height:8px;border-radius:50%;background:var(--c)} .br b{margin-left:auto;font:500 12px var(--mono)}
.tops{display:flex;flex-wrap:wrap;gap:5px}
.tops span{font-size:11.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--line2);color:var(--ink);background:rgba(155,123,255,.07)}

/* ---------- подписи в 3D ---------- */
#labs{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.lb{position:absolute;left:0;top:0;transform-origin:0 0;white-space:nowrap;text-align:center;will-change:transform;
  padding:2px 9px 3px;border-radius:9px;background:rgba(6,4,26,.5);box-shadow:0 0 0 1px rgba(181,124,245,.1)}
.lb b{display:block;font-weight:700;font-size:13px;letter-spacing:.02em;color:#fff;text-shadow:0 0 10px var(--c),0 1px 3px #000}
.lb small{display:block;font-size:11px;color:var(--dim);text-shadow:0 1px 3px #000}
.lb.sun b{font-size:15px;letter-spacing:.12em}
.lb.sel b{color:var(--sel)}
.ml{position:absolute;left:0;top:0;font-size:11px;color:#efeaff;white-space:nowrap;text-shadow:0 1px 4px #000,0 0 8px rgba(0,0,0,.8);will-change:transform}
#tip{position:fixed;z-index:6;pointer-events:none;background:rgba(10,7,32,.92);border:1px solid var(--line2);border-radius:8px;padding:5px 9px;font-size:12px;white-space:nowrap}
#tip small{color:var(--dim);font:11px var(--mono);margin-left:6px}
#hint{position:fixed;left:368px;right:calc(var(--sideW) + 30px);bottom:16px;text-align:center;color:var(--mute);font-size:11.5px;z-index:2;pointer-events:none;
  transition:opacity .6s;text-shadow:0 1px 4px #000}
body.used #hint{opacity:0}
body.film #top,body.film #vtext,body.film #giz,body.film #side,body.film #card,body.film #hint,body.film #labs,body.film #ask,body.film #ans{display:none}

/* ---------- телефон: панель N = нижний лист, заголовок в две строки ---------- */
@media (max-width:760px){
  :root{--hdr:92px;--sideW:0px}
  #top{flex-wrap:wrap;height:var(--hdr);align-content:center;gap:8px 8px;padding:6px 10px}
  .brand{flex:1 1 0;min-width:0} .brand>div{min-width:0} .brand b{overflow:hidden;text-overflow:ellipsis} .brand small{max-width:100%}
  .views{order:3;margin-left:0;flex:1 1 100%;justify-content:space-between}
  .views button{flex:1;padding:6px 0}
  .tools button{height:30px;min-width:30px}
  #vtext{left:12px;font-size:10.5px} #vStats{display:none}
  #giz{right:10px!important;top:calc(var(--hdr) + 6px)} #gz{width:78px;height:78px}
  #side{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:58vh;border-radius:16px}
  body.noside #side{transform:translateY(calc(100% + 16px))}
  #card,#ans{left:8px;right:8px;width:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));max-height:42vh;overflow:auto;padding:12px 14px 10px}
  body:not(.noside) #card,body:not(.noside) #ans,body:not(.noside) #ask{display:none}
  #ask{left:8px;right:8px;width:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  #ask input{font-size:16px}
  #ans .a{font-size:14px}
  #hint{display:none}
  .lb b{font-size:11.5px} .lb small{display:none}
}
@media (prefers-reduced-motion:reduce){#side,#giz{transition:none}#card{animation:none}}
</style>
</head>
<body>
<canvas id="gl" aria-label="3D graph"></canvas>
<div id="labs" aria-hidden="true"></div>

<header id="top">
  <a class="brand" href="../nano/"><img src="assets/icon.png" alt="" width="28" height="28"><div><b data-t="title"></b><small data-t="sub"></small></div></a>
  <nav class="views" aria-label="views">
    <button data-act="front" data-t="front"></button><button data-act="right" data-t="right"></button><button data-act="top" data-t="top"></button><button data-act="persp" id="bPersp"></button>
  </nav>
  <div class="tools">
    <button data-act="frame" data-tt="frame" class="ic"><svg viewBox="0 0 20 20"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/><circle cx="10" cy="10" r="2.4"/></svg></button>
    <button data-act="turn" data-tt="turn" class="ic" id="bTurn"><svg viewBox="0 0 20 20"><path d="M16.5 8.5A6.7 6.7 0 0 0 4.2 6.3M3.5 11.5a6.7 6.7 0 0 0 12.3 2.2"/><path d="M4 2.8v3.7h3.7M16 17.2v-3.7h-3.7"/></svg></button>
    <button data-act="ovl" data-tt="overlays" class="ic" id="bOvl"><svg viewBox="0 0 20 20"><circle cx="7.6" cy="10" r="4.6"/><circle cx="12.4" cy="10" r="4.6"/></svg></button>
    <button data-act="lang" id="bLang" class="txt"></button>
    <button data-act="side" data-tt="side" class="ic" id="bSide"><svg viewBox="0 0 20 20"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M12.5 3.5v13M14.5 7h1M14.5 10h1M14.5 13h1"/></svg></button>
  </div>
</header>

<div id="vtext"><div id="vName"></div><div id="vObj"></div><div id="vStats"></div></div>
<div id="giz"><canvas id="gz" width="96" height="96" aria-label="navigation gizmo"></canvas>
  <div class="gb"><button data-act="zin" aria-label="zoom in">+</button><button data-act="zout" aria-label="zoom out">−</button></div></div>

<aside id="side" aria-label="properties">
  <details open><summary data-t="outliner"></summary><div id="outl"></div></details>
  <details open><summary data-t="view"></summary><div id="pView"></div></details>
  <details open><summary data-t="graph"></summary><div id="pGraph"></div></details>
  <details open><summary data-t="physics"></summary><div id="pPhys"></div></details>
  <p class="foot" data-t="foot"></p>
</aside>

<section id="card" hidden aria-live="polite"></section>
<section id="ans" hidden aria-live="polite"></section>
<form id="ask" autocomplete="off"><span class="live" aria-hidden="true"></span><input id="askQ" type="text" maxlength="300" enterkeyhint="send" aria-label="question"><button id="askGo" type="submit"></button></form>
<div id="tip" hidden></div>
<div id="hint" data-t="hint"></div>

    const x=VW/2+(d[0]*vR[0]+d[1]*vR[1]+d[2]*vR[2])/z*hx,y=VH/2-(d[0]*vU[0]+d[1]*vU[1]+d[2]*vU[2])/z*hy,S=n.k*1.3*Math.max(VW,VH);
    g2.globalAlpha=.24*Math.min(1,(z-.1)*2.5);g2.drawImage(n.spr,x-S/2,y-S/2,S,S)}

    for(const s of STARS){if(s[7]!==k)continue;const z=s[0]*vF[0]+s[1]*vF[1]+s[2]*vF[2];if(z<.06)continue;
      const x=VW/2+(s[0]*vR[0]+s[1]*vR[1]+s[2]*vR[2])/z*hx,y=VH/2-(s[0]*vU[0]+s[1]*vU[1]+s[2]*vU[2])/z*hy;
      if(x<0||y<0||x>VW||y>VH)continue;
      g2.globalAlpha=s[4]*(RM?1:.7+.3*Math.sin(t*s[5]+s[6]));const m=s[3];g2.fillRect(x-m/2,y-m/2,m,m)}}
  g2.globalAlpha=1;g2.globalCompositeOperation='source-over'}

// ---------- сетка (оверлей) ----------
const VA=[0,0,0],VB=[0,0,0];
function toView(x,y,z,o){const dx=x-vE[0],dy=y-vE[1],dz=z-vE[2];o[0]=dx*vR[0]+dy*vR[1]+dz*vR[2];o[1]=dx*vU[0]+dy*vU[1]+dz*vU[2];o[2]=dx*vF[0]+dy*vF[1]+dz*vF[2]}
function seg3(path,ax,ay,az,bx,by,bz){toView(ax,ay,az,VA);toView(bx,by,bz,VB);
  if(!ortho){if(VA[2]<NEAR&&VB[2]<NEAR)return;
    if(VA[2]<NEAR){const t=(NEAR-VA[2])/(VB[2]-VA[2]);for(let i=0;i<3;i++)VA[i]+=(VB[i]-VA[i])*t}
    else if(VB[2]<NEAR){const t=(NEAR-VB[2])/(VA[2]-VB[2]);for(let i=0;i<3;i++)VB[i]+=(VA[i]-VB[i])*t}}
  const sa=ortho?sc0:(VH/2)/(VA[2]*tY),sb=ortho?sc0:(VH/2)/(VB[2]*tY);
  path.moveTo(CXs+VA[0]*sa,CYs-VA[1]*sa);path.lineTo(CXs+VB[0]*sb,CYs-VB[1]*sb)}
const AXC={x:'rgba(255,51,82,.5)',y:'rgba(139,220,0,.45)',z:'rgba(40,144,255,.5)'};
function grid(){
  g2.lineWidth=1;const G=1800,S=200;
  if(ortho&&named){// вид по оси — сетка в плоскости экрана, как в Blender
    const st=S*sc0;if(st<5)return;toView(0,0,0,VA);const ox=CXs+VA[0]*sc0,oy=CYs-VA[1]*sc0,p=new Path2D();
    for(let x=ox%st;x<VW;x+=st){p.moveTo(x,0);p.lineTo(x,VH)}for(let y=oy%st;y<VH;y+=st){p.moveTo(0,y);p.lineTo(VW,y)}
    g2.strokeStyle='rgba(181,124,245,.07)';g2.stroke(p);
    const hz=named==='right'||named==='left'?'y':'x',vt=named==='top'||named==='bottom'?'y':'z';
    g2.strokeStyle=AXC[hz];g2.beginPath();g2.moveTo(0,oy);g2.lineTo(VW,oy);g2.stroke();
    g2.strokeStyle=AXC[vt];g2.beginPath();g2.moveTo(ox,0);g2.lineTo(ox,VH);g2.stroke();return}
  const p=new Path2D();for(let k=-G;k<=G;k+=S){if(k){seg3(p,k,-G,0,k,G,0);seg3(p,-G,k,0,G,k,0)}}
  g2.strokeStyle='rgba(181,124,245,.075)';g2.stroke(p);
  const px=new Path2D();seg3(px,-G,0,0,G,0,0);g2.strokeStyle=AXC.x;g2.stroke(px);
  const py=new Path2D();seg3(py,0,-G,0,0,G,0);g2.strokeStyle=AXC.y;g2.stroke(py)}

// ---------- тракты и связи ----------
const zoomK=()=>clamp(sc0*1.45,.55,1.9);
function tract(a,b,ca,cb,w,al){const gr=g2.createLinearGradient(SX[a],SY[a],SX[b],SY[b]);
  gr.addColorStop(0,css(ca));gr.addColorStop(1,css(cb));g2.strokeStyle=gr;
  g2.beginPath();g2.moveTo(SX[a],SY[a]);g2.lineTo(SX[b],SY[b]);
  g2.globalAlpha=al*.3;g2.lineWidth=w*3;g2.stroke();g2.globalAlpha=al;g2.lineWidth=w;g2.stroke()}
function tracts(){
  const z=zoomK();g2.globalCompositeOperation='lighter';g2.lineCap='round';
  for(let i=0;i<NP;i++){const b=1+i;if(!ON[b]||!SVIS[b]||!SVIS[0])continue;
    tract(0,b,SRGB,PRGB[i],(1+4*DATA.sunw[i]/SUNW_MAX)*z,.32*dimT(0,b))}
  for(const br of BR){const a=1+br[0],b=1+br[1];if(!SVIS[a]||!SVIS[b])continue;
    tract(a,b,PRGB[br[0]],PRGB[br[1]],(.6+4.4*br[2]/BMAX)*z,.38*dimT(a,b))}
  g2.globalAlpha=1;g2.globalCompositeOperation='source-over'}
function links(){
  const sp=PRGB.map(()=>new Path2D()),ed=PRGB.map(()=>new Path2D());
  for(const b of ACT){if(KIND[b]!==2||!SVIS[b])continue;const p=OWN[b];if(!SVIS[p])continue;sp[p-1].moveTo(SX[p],SY[p]);sp[p-1].lineTo(SX[b],SY[b])}
  for(let e=0;e<EA.length;e+=2){const a=EA[e],b=EA[e+1];if(!SVIS[a]||!SVIS[b])continue;const q=ed[OWN[a]-1];q.moveTo(SX[a],SY[a]);q.lineTo(SX[b],SY[b])}
  g2.globalCompositeOperation='lighter';g2.lineWidth=1;
  for(let i=0;i<NP;i++){if(!ON[1+i])continue;const d=dimOf(1+i),f=sel===1+i?1.9:1;g2.strokeStyle=PHEX[i];
    g2.globalAlpha=.07*d*f;g2.stroke(sp[i]);g2.globalAlpha=.2*d*f;g2.stroke(ed[i])}
  g2.globalAlpha=1;g2.globalCompositeOperation='source-over'}

// ---------- тела ----------
const ORD=[];
function ring(b,c,w){if(b<0||!SVIS[b])return;g2.strokeStyle=c;g2.lineWidth=w;g2.beginPath();g2.arc(SX[b],SY[b],SR[b]+(KIND[b]===2?3:5),0,7);g2.stroke()}
function bodies(t){
  ORD.length=0;if(SVIS[0])ORD.push(0);for(const b of ACT)if(SVIS[b])ORD.push(b);
  ORD.sort((a,b)=>SD[b]-SD[a]);
  for(const b of ORD){const k=KIND[b],r=SR[b],x=SX[b],y=SY[b],a=SA[b]*dimOf(b);
    g2.globalCompositeOperation='lighter';
    if(k===2){const S=r*5.4;g2.globalAlpha=Math.min(1,.95*a);g2.drawImage(GLOW[OWN[b]-1],x-S/2,y-S/2,S,S);continue}
    const sun=k===0,pul=sun&&!RM?1+.05*Math.sin(t*1.5):1,S=r*(sun?7:4.4)*pul;
    g2.globalAlpha=(sun?.9:.62)*a;g2.drawImage(sun?SUNG:HALO[b-1],x-S/2,y-S/2,S,S);
    g2.globalCompositeOperation='source-over';g2.globalAlpha=Math.max(.3,a);g2.drawImage(sun?SUNB:BALL[b-1],x-r,y-r,2*r,2*r)}
  g2.globalAlpha=1;g2.globalCompositeOperation='source-over';
  ring(sel,SEL_C,2);if(hov>=0&&hov!==sel)ring(hov,'rgba(255,255,255,.75)',1.2)}
const AFTER=[];  // слои поверх тел (brain.chat.js: сигнал ядро → агент, ответившие ноты)
function draw(t){
  g2.setTransform(DPR,0,0,DPR,0,0);g2.globalAlpha=1;g2.globalCompositeOperation='source-over';
  g2.drawImage(BG,0,0,VW,VH);sky(t);projectAll();if(OVL)grid();tracts();links();bodies(t);for(const f of AFTER)f(t)}
function pick(mx,my){let best=-1,bd=1e12;
  const test=b=>{if(!SVIS[b])return;const dx=mx-SX[b],dy=my-SY[b],m=KIND[b]===2,rr=Math.max(SR[b]+(m?3:5),m?7:14);
    if(dx*dx+dy*dy<=rr*rr&&SD[b]<bd){bd=SD[b];best=b}};
  test(0);for(const b of ACT)test(b);return best}

// ---------- подписи: агенты и ядро всегда, луны — главные концепты, жадно без наездов ----------
const LABS=document.getElementById('labs'),PL=[],ML=[];
for(let b=0;b<=NP;b++){const e=document.createElement('div');e.className='lb'+(b===0?' sun':'');
  e.style.setProperty('--c',b===0?SHEX:PHEX[b-1]);e.innerHTML='<b></b><small></small>';e.style.display='none';LABS.appendChild(e);PL.push(e)}

  e.lastChild.textContent=b===0?T('sunDom'):dom(DATA.planets[b-1])})}
const BOX=[],LBOX=[],PORD=[];
const hitIn=(L,x,y,w,h)=>{for(const q of L)if(x<q[0]+q[2]&&x+w>q[0]&&y<q[1]+q[3]&&y+h>q[1])return true;return false};

const MEAS=document.createElement('canvas').getContext('2d'),MW=new Map();

const hideEl=e=>{if(e.style.display!=='none')e.style.display='none'};
function labels(){
  BOX.length=LBOX.length=PORD.length=0;const lim=VW-cam.ox;

  PORD.sort((a,b)=>(a===sel?-1e9:SD[a])-(b===sel?-1e9:SD[b]));
  for(const b of PORD){const e=PL[b];
    if(e.style.display==='none')e.style.display='';
    const x=SX[b],y=SY[b]+SR[b]+(b===0?10:6),w=e._w||(e._w=e.offsetWidth||90),h=e._h||(e._h=e.offsetHeight||34);
    if(hitIn(LBOX,x-w/2,y,w,h)){hideEl(e);continue}

    e.style.opacity=Math.max(.35,SA[b]*dimOf(b)).toFixed(2);e.classList.toggle('sel',b===sel);
    LBOX.push([x-w/2,y,w,h]);BOX.push([x-w/2,y,w,h],[SX[b]-SR[b],SY[b]-SR[b],2*SR[b],2*SR[b]])}

    for(let r=0;r<P.K&&got<want;r++){const m=PSTART[i]+r,b=MO+m;if(m>=NM||DATA.moons[m][0]!==i)break;
      const li=DATA.moons[m][3];if(li<0||!ON[b]||!SVIS[b])continue;
      const txt=DATA.labels[li],w=textW(txt),x=SX[b]+SR[b]+4,y=SY[b]-8;

      let e=ML[used];if(!e){e=document.createElement('div');e.className='ml';LABS.appendChild(e);ML.push(e)}
      if(e._t!==txt){e.textContent=txt;e._t=txt}
      e.style.display='';e.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;e.style.opacity=SA[b].toFixed(2);used++}}
  for(let i=used;i<ML.length;i++)if(ML[i].style.display!=='none')ML[i].style.display='none'}

// ---------- гизмо навигации (оси X·Y·Z цветами Blender) ----------
const gz=document.getElementById('gz'),gg=gz.getContext('2d');
const AX=[['X',[1,0,0],'#ff3352','right'],['Y',[0,1,0],'#8bdc00','back'],['Z',[0,0,1],'#2890ff','top'],
  ['-X',[-1,0,0],'#ff3352','left'],['-Y',[0,-1,0],'#8bdc00','front'],['-Z',[0,0,-1],'#2890ff','bottom']];
let gzHov=-1;const GZP=[];
function gizmo(){
  const n=gz.clientWidth||96,d=Math.min(2,DPR);if(gz.width!==Math.round(n*d)){gz.width=gz.height=Math.round(n*d)}
  gg.setTransform(d,0,0,d,0,0);gg.clearRect(0,0,n,n);
  const c=n/2,rr=n*.35,br=n*.1;
  const it=AX.map((a,i)=>{const v=a[1];return{i,x:c+(v[0]*vR[0]+v[1]*vR[1]+v[2]*vR[2])*rr,y:c-(v[0]*vU[0]+v[1]*vU[1]+v[2]*vU[2])*rr,z:v[0]*vF[0]+v[1]*vF[1]+v[2]*vF[2]}});
  it.sort((p,q)=>q.z-p.z);
  for(const p of it){const a=AX[p.i],pos=p.i<3,c2=rgb(a[2]);
    if(pos){gg.strokeStyle=a[2];gg.lineWidth=2;gg.beginPath();gg.moveTo(c,c);gg.lineTo(p.x,p.y);gg.stroke()}
    gg.beginPath();gg.arc(p.x,p.y,br,0,7);
    if(pos){gg.fillStyle=a[2];gg.fill()}else{gg.fillStyle=css(c2,.25);gg.fill();gg.strokeStyle=css(c2,.75);gg.lineWidth=1.2;gg.stroke()}
    if(gzHov===p.i){gg.strokeStyle='#fff';gg.lineWidth=1.6;gg.stroke()}
    if(pos||gzHov===p.i){gg.fillStyle=pos?'#0b0820':'#fff';gg.font=`700 ${Math.round(n*.11)}px Inter,system-ui,sans-serif`;
      gg.textAlign='center';gg.textBaseline='middle';gg.fillText(a[0].replace('-',''),p.x,p.y+.5)}
    GZP[p.i]=[p.x,p.y,br]}}
function gzPick(x,y){let best=-1,bz=-9;for(let i=0;i<6;i++){const q=GZP[i];if(!q)continue;
  const dx=x-q[0],dy=y-q[1];if(dx*dx+dy*dy<=(q[2]+2)**2){const v=AX[i][1],z=-(v[0]*vF[0]+v[1]*vF[1]+v[2]*vF[2]);if(z>bz){bz=z;best=i}}}return best}

// «Спросить мозг NANO» — вопрос уходит на живой мозг (сервер `ceo.nineloom.com/nano-api`, ASSETS/nano-ask: публичные

// и их названия (личный домен BUBBLEGUM — без названий). Луна узнаётся по хешу имени ноты (DATA.mh): имён лун в странице нет.

function pill(txt,x,y,r,c,stack){g2.font='600 11.5px Inter,system-ui,sans-serif';const w=g2.measureText(txt).width+14,h=19,R=VW-cam.ox-4;
  const fits=(l,t)=>{if(l<4||l+w>R||t<HDR+6||t+h>VH-4)return false;for(const q of LB)if(l<q[0]+q[2]&&l+w>q[0]&&t<q[1]+q[3]&&t+h>q[1])return false;return true};
  const opts=stack!=null?[[x-w/2,y-r-14-stack*23-h],[x-w/2,y+r+30+stack*23]]:[[x-w/2,y-r-9-h],[x-w/2,y+r+9],[x+r+8,y-h/2],[x-r-8-w,y-h/2]];
  let l=-1,t=0;for(const o of opts){const a=Math.min(Math.max(4,o[0]),R-w);if(fits(a,o[1])){l=a;t=o[1];break}}
  if(l<0)return;LB.push([l,t,w,h]);
  g2.globalAlpha=.86;g2.fillStyle='rgba(6,4,26,.88)';g2.strokeStyle=c;g2.lineWidth=1;g2.beginPath();
  if(g2.roundRect)g2.roundRect(l,t,w,h,9);else g2.rect(l,t,w,h);g2.fill();g2.globalAlpha=.9;g2.stroke();
  g2.globalAlpha=1;g2.fillStyle='#fff';g2.textBaseline='middle';g2.textAlign='left';g2.fillText(txt,l+7,t+h/2+.5)}
AFTER.push(()=>{
  if(!ASK.phase||!SVIS[0])return;
  const e=performance.now()/1000-ASK.t0,think=ASK.phase==='think',z=zoomK(),slow=RM?0:1;
  g2.globalCompositeOperation='lighter';g2.lineCap='round';
  // ядро: волны, пока думает; одна вспышка, когда ответ пришёл
  for(let k=0;k<(think?3:1);k++){const f=think?(e*.8*slow+k/3)%1:Math.min(1,e/1.1);if(!think&&f>=1)break;
    halo(SX[0],SY[0],SR[0]*(1.1+f*2.6),SHEX,(1-f)*.75,2)}
  const ps=think?ACT.filter(b=>KIND[b]===1):ASK.ps;
  ps.forEach((b,i)=>{if(!SVIS[b])return;const c=PHEX[b-1];
    if(think){for(let k=0;k<2;k++){const f=(e*.85*slow+i/ps.length+k*.5)%1;g2.globalAlpha=Math.sin(f*Math.PI);
        spark(lerp(SX[0],SX[b],f),lerp(SY[0],SY[b],f),b,24*z)}return}
    // сигнал ядро → агент; дальше тракт светится, по нему бегут искры, планета дышит
    const f=Math.min(1,e/.7),x1=lerp(SX[0],SX[b],f),y1=lerp(SY[0],SY[b],f);
    g2.strokeStyle=c;g2.beginPath();g2.moveTo(SX[0],SY[0]);g2.lineTo(x1,y1);
    g2.globalAlpha=.22;g2.lineWidth=9*z;g2.stroke();g2.globalAlpha=.9;g2.lineWidth=2.2*z;g2.stroke();
    if(f<1){g2.globalAlpha=1;spark(x1,y1,b,28*z);return}
    const s=(e*.55*slow+i*.37)%1;g2.globalAlpha=Math.sin(s*Math.PI);spark(lerp(SX[0],SX[b],s),lerp(SY[0],SY[b],s),b,18*z);
    halo(SX[b],SY[b],SR[b]+9+3*Math.sin(e*2.6*slow),c,.6,2.2)});
  if(think||e<.7){g2.globalAlpha=1;g2.globalCompositeOperation='source-over';return}
  // ноты-источники: сигнал агент → луна, пульсирующие кольца; ноты вне топа (и у ядра) — подписи стопкой над агентом
  const f=Math.min(1,(e-.7)/.55),seen=new Set(),tag=[];LB.length=0;
  for(const x of ASK.hits){const mb=x.m>=0&&ON[MO+x.m]?MO+x.m:-1,b=mb>=0?mb:x.p>0&&ON[x.p]?x.p:0,p=OWN[b],c=b===0?SHEX:PHEX[p-1];
    const txt=x.priv?T('askPriv'):short(x.t,30);if(!SVIS[b]||seen.has(b+'|'+txt))continue;seen.add(b+'|'+txt);tag.push([b,txt,c]);
    if(mb<0||seen.has(b))continue;seen.add(b);
    if(SVIS[p]){g2.globalAlpha=.85;g2.strokeStyle=c;g2.lineWidth=1.7*z;g2.beginPath();g2.moveTo(SX[p],SY[p]);
      g2.lineTo(lerp(SX[p],SX[b],f),lerp(SY[p],SY[b],f));g2.stroke();
      if(f<1){g2.globalAlpha=1;spark(lerp(SX[p],SX[b],f),lerp(SY[p],SY[b],f),p,18*z);continue}}
    g2.globalAlpha=.9;spark(SX[b],SY[b],p,SR[b]*7);
    halo(SX[b],SY[b],SR[b]+5+2.5*Math.sin(e*3.2*slow+b),'#fff',.8,1.6)}
  g2.globalCompositeOperation='source-over';
  if(f<1){g2.globalAlpha=1;return}
  for(const q of LBOX)LB.push(q);  // подписи агентов и ядра (прошлый кадр labels())
  for(const n of OBST){if(!n||!n.offsetWidth)continue;const r=n.getBoundingClientRect();LB.push([r.left-4,r.top-4,r.width+8,r.height+8])}
  const stack=new Map();
  for(const [b,txt,c] of tag){if(KIND[b]===2){pill(txt,SX[b],SY[b],SR[b],c);continue}
    const k=stack.get(b)||0;stack.set(b,k+1);if(k<3)pill(txt,SX[b],SY[b],SR[b],c,k)}
  g2.globalAlpha=1});

// ---------- тексты и связь с сервером ----------
function askTexts(){askI.placeholder=ASK.st==='off'?T('askOffPh'):T('askPh');askB.textContent=T('askGo');
  askF.classList.toggle('on',ASK.st==='on');askF.classList.toggle('off',ASK.st==='off');
  askI.disabled=ASK.st==='off';askB.disabled=ASK.st==='off'||ASK.busy;if(ASK.mode)render()}
new MutationObserver(askTexts).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
askTexts();
fetch(API+'/health',{cache:'no-store'}).then(r=>(r.ok?r.json():null))
  .then(j=>{ASK.st=j&&j.ok&&j.llm?'on':'off';ASK.notes=(j&&j.notes)||0;askTexts()}).catch(()=>{ASK.st='off';askTexts()});
window.__ask={ask,get state(){return{st:ASK.st,mode:ASK.mode,phase:ASK.phase,busy:ASK.busy,hits:ASK.hits.length,
  moons:ASK.hits.filter(x=>x.m>=0).length,ps:ASK.ps.slice(),text:ASK.text}}};

})();</script>
