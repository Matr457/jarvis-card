<!doctype html>
<html lang="ru" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NANO — твой второй мозг</title>
<meta name="description" content="Две минуты с NANO: утро в одном сообщении, память на всё и учитель в Telegram. Начать — бесплатно.">
<meta property="og:type" content="website">
<meta property="og:title" content="NANO — твой второй мозг">
<meta property="og:description" content="Две минуты с NANO: утро в одном сообщении, память на всё и учитель в Telegram. Начать — бесплатно.">
<meta property="og:image" content="https://matr457.github.io/jarvis-card/b2c/og.jpg">
<meta property="og:url" content="https://matr457.github.io/jarvis-card/b2c/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#070a1f">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a1f;--ink:#f4f2ff;--ink2:#c9c6e6;--ink3:#908db4;--line:rgba(190,180,255,.16);--glass:rgba(16,17,44,.66);
  --acc:#a98bff;--acc2:#dcd0ff;--red:#ff6b5e;--amber:#ffb547;--mint:#5fe0b0;--o:#ff7a00;--o2:#ffb066;
  --ease:cubic-bezier(.22,.8,.2,1);--sys:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;--f:"Onest",var(--sys)}
html[lang=th]{--f:"IBM Plex Sans Thai Looped","IBM Plex Sans Thai",var(--sys)}
html[lang=zh]{--f:"Noto Sans SC","PingFang SC","Microsoft YaHei",var(--sys)}
html[lang=ja]{--f:"Noto Sans JP","Hiragino Sans","Yu Gothic",var(--sys)}
html[lang=hi]{--f:"Noto Sans Devanagari","Nirmala UI",var(--sys)}
html[lang=ar]{--f:"Noto Sans Arabic","Segoe UI",var(--sys)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--f);overflow-x:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
a{color:inherit}
.nebula{position:fixed;inset:-10%;z-index:-2;pointer-events:none;
  background:radial-gradient(52% 44% at 78% 6%,rgba(124,92,255,.24),transparent 70%),radial-gradient(40% 40% at 6% 52%,rgba(240,138,200,.10),transparent 70%),
  radial-gradient(50% 46% at 62% 104%,rgba(73,207,216,.09),transparent 70%),linear-gradient(180deg,#070a1f,#0a0d2a 60%,#070a1f)}
#cosmos{position:fixed;left:0;top:0;width:100vw;height:100lvh;z-index:-1;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button:focus-visible,a:focus-visible{outline:2px solid var(--o);outline-offset:3px}

/* ---------- игра: стадия 60 % / диалог 40 % ---------- */
#game{position:relative;height:100dvh;min-height:560px;max-width:1180px;margin:0 auto;display:grid;grid-template-rows:minmax(0,6fr) minmax(0,4fr)}
.top{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:8px;padding:10px 12px}
.ib{flex:none;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(16,17,44,.55);backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer;font-size:18px;line-height:1;padding:0}
.ib[disabled]{opacity:.3;cursor:default}
[dir=rtl] .ib.back{transform:scaleX(-1)}
.brand{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800;letter-spacing:.12em;font-size:14px;text-transform:uppercase}
.brand b{color:var(--o)} .brand .b2{color:var(--ink3);font-weight:600}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:rgba(16,17,44,.55);backdrop-filter:blur(8px);font-size:13px;font-weight:600;color:var(--ink2);cursor:default;white-space:nowrap}
button.pill{cursor:pointer;color:var(--ink)}
.langs{flex:none;display:flex;border:1px solid var(--line);border-radius:99px;background:rgba(16,17,44,.55);backdrop-filter:blur(8px);overflow:hidden}
.langs button{height:36px;min-width:38px;padding:0 10px;border:0;background:none;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink3)}
.langs button.on{background:var(--o);color:#1a0d00}
.skip .t{display:none}
@media(min-width:560px){.skip .t{display:inline}}
@media(max-width:559px){.brand .b2{display:none}.pill.time{padding:0 10px}}
@media(max-width:400px){.pill.time .tt{display:none}}
#stage{position:relative;overflow:hidden;padding:56px 12px 6px}
.st{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 30px 80px -40px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.05)}

/* ---------- диалог (GAME_DEV, оранжевый) ---------- */
#dlg{position:relative;z-index:5;margin:0 8px;border-radius:24px 24px 0 0;display:grid;grid-template-columns:33% 1fr;
  background:linear-gradient(180deg,rgba(26,18,22,.84),rgba(14,13,34,.9));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,122,0,.5);border-bottom:0;box-shadow:0 -10px 50px -12px rgba(255,122,0,.42),inset 0 1px 0 rgba(255,176,102,.5);
  padding-bottom:env(safe-area-inset-bottom,0);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.badge{position:absolute;z-index:8;top:-17px;inset-inline-start:calc(33% + 6px);display:flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 3px;border-radius:99px;
  background:#1d1008;border:1px solid rgba(255,122,0,.7);box-shadow:0 0 22px rgba(255,122,0,.4);font-weight:800;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--o2)}
.badge .av{width:28px;height:28px;border-radius:50%;background:#2a1a10 center top/cover;border:1.5px solid var(--o);flex:none}
.spc{position:relative}
.spr{position:absolute;bottom:0;inset-inline-start:2px;transform-origin:50% 100%;pointer-events:none;z-index:6}
.spr img{display:block;transform-origin:50% 100%;animation:breathe 3.5s ease-in-out infinite;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
@keyframes breathe{50%{transform:scale(1.012)}}
.tc{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;padding:22px 14px 12px 20px;gap:8px}
.tx{flex:1 1 auto;min-height:0;overflow-y:auto;font-size:17px;line-height:1.5;scrollbar-width:thin;scrollbar-color:rgba(255,122,0,.4) transparent;overscroll-behavior:contain}
.tx.typing::after{content:"▍";color:var(--o);margin-inline-start:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.nxt{flex:none;align-self:flex-end;color:var(--o);font-size:15px;font-weight:700;display:none;align-items:center;gap:8px;animation:nudge 1.1s ease-in-out infinite;pointer-events:none}
.nxt.on{display:flex}
[dir=rtl] .nxt{align-self:flex-start;flex-direction:row-reverse}
@keyframes nudge{50%{transform:translateX(4px);opacity:.55}}
.chs{flex:none;display:flex;flex-direction:column;gap:6px}
.ch{display:flex;align-items:center;gap:10px;min-height:46px;padding:6px 14px 6px 8px;border-radius:14px;border:1px solid rgba(255,122,0,.55);background:rgba(255,122,0,.1);
  font-weight:600;font-size:16px;line-height:1.25;text-align:start;cursor:pointer;transition:background .2s,transform .12s,border-color .2s;animation:chin .35s var(--ease) both}
.ch:nth-child(2){animation-delay:.07s}.ch:nth-child(3){animation-delay:.14s}
@keyframes chin{from{opacity:0;transform:translateY(8px)}}
.ch:hover{background:rgba(255,122,0,.22)} .ch:active{transform:scale(.98)}
.ch i{flex:none;width:28px;height:28px;border-radius:9px;background:var(--o);color:#1a0d00;font:800 14px/28px var(--f);font-style:normal;text-align:center}
.ch[disabled]{cursor:default;opacity:.55}
.ch.sel{opacity:1;border-color:var(--o2);background:rgba(255,122,0,.28)}
.ch.good{opacity:1;border-color:var(--mint);background:rgba(95,224,176,.2)}.ch.good i{background:var(--mint)}
.ch.bad{border-color:rgba(255,107,94,.7);background:rgba(255,107,94,.14);opacity:.9}
.prog{position:absolute;left:18px;right:18px;bottom:0;height:3px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--o),var(--o2));box-shadow:0 0 10px var(--o);transition:width .5s var(--ease)}
@media(min-width:720px){
  #stage{padding-inline:200px 40px}
  #dlg{margin:0 18px;grid-template-columns:22% 1fr;border-radius:28px 28px 0 0}
  .badge{inset-inline-start:calc(22% + 10px);top:-18px}
  .tc{padding:26px 28px 16px 8px;gap:10px}
  .tx{font-size:20px}
  .chs{flex-direction:row;flex-wrap:wrap}
  .ch{flex:1 1 220px;font-size:17px}
}

/* ---------- стадии ---------- */
.st h4{margin:0;font-weight:700;font-size:17px;line-height:1.3}
.tip{position:absolute;z-index:4;max-width:min(260px,80%);padding:9px 13px;border-radius:12px;background:rgba(10,10,32,.88);border:1px solid var(--line);font-size:14px;line-height:1.4;opacity:0;transition:opacity .3s;pointer-events:none;color:var(--ink2)}
.tip b{display:block;font-size:14px;margin-bottom:1px}
#orb{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
/* tally */
.tl{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.tl .num{font-weight:800;font-size:clamp(72px,24vw,150px);line-height:1;letter-spacing:-.03em;background:linear-gradient(180deg,#fff,var(--acc2) 55%,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.tl .lbl{font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);text-align:center;min-height:1.4em}
.tl .its{display:grid;gap:8px;width:100%;margin-top:10px}
.tl .it{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border-radius:14px;opacity:0;transform:translateY(14px);transition:all .5s var(--ease)}
.tl .it.on{opacity:1;transform:none}
.tl .it .d{flex:none;margin-top:6px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.tl .it b{display:block;font-size:15px}.tl .it span{font-size:14px;color:var(--ink2);line-height:1.35}
.pt{position:absolute;left:50%;top:40px;width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
@media(min-width:720px){.tl .its{grid-template-columns:repeat(3,1fr)}.tl .num{font-size:150px}}
@media(max-height:760px) and (max-width:719px){.tl .num{font-size:70px}}
/* approve */
.ap{display:flex;flex-direction:column;gap:12px;max-width:560px;width:100%;margin:0 auto}
.apb{position:relative;border:1.5px dashed color-mix(in srgb,var(--c) 55%,transparent);border-radius:18px;padding:22px 14px 14px;background:rgba(16,17,44,.5)}
.apb .perim{position:absolute;top:-11px;inset-inline-start:14px;padding:2px 10px;background:#0b0e28;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.apb .fr{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--c);letter-spacing:.08em;text-transform:uppercase}
.apb .fr i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.apb h4{margin:6px 0 4px}.apb p{margin:0;font-size:14px;color:var(--ink2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.apb .row{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;transition:filter .15s,transform .15s}
.btn:hover{filter:brightness(1.2)} .btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,#ff9a3c,#ff7a00);border-color:transparent;color:#1a0d00;box-shadow:0 10px 34px -10px rgba(255,122,0,.8)}
.btn[disabled]{opacity:.5;cursor:default;filter:none}
.apb .state{font-size:13px;color:var(--ink3)} .apb .state.okd{color:var(--mint);font-weight:600}
.log{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;font-size:14px}
.log .n{font-size:30px;font-weight:800;color:var(--c);min-width:26px;text-align:center;line-height:1}
.log .l{color:var(--ink3)} .log .l b{display:block;color:var(--ink);font-weight:600}
.comet{position:absolute;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;box-shadow:0 0 16px 6px var(--o);opacity:0;pointer-events:none;z-index:6}
/* chat */
.ct{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%;max-height:100%;overflow:hidden}
.ct .hd{flex:none;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;font-weight:700;color:var(--ink2);display:flex;gap:8px;align-items:center}
.ct .hd i{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}
.ct .ms{flex:1;min-height:0;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:7px;scrollbar-width:none}
.bb{display:flex;gap:8px;align-items:flex-end;max-width:92%;animation:bin .35s var(--ease) both}
@keyframes bin{from{opacity:0;transform:translateY(8px) scale(.97)}}
.bb.me{align-self:flex-end;flex-direction:row-reverse}
.bb .a{flex:none;width:28px;height:28px;border-radius:50%;background:#2a2150 center top/cover;border:1.5px solid var(--acc)}
.bb .m{padding:8px 12px;border-radius:16px 16px 16px 5px;background:rgba(255,255,255,.07);font-size:14.5px;line-height:1.38}
.bb .m .w{display:block;font-size:12px;font-weight:700;color:var(--c);margin-bottom:1px}
.bb.me .m{background:linear-gradient(180deg,#ff9a3c,#ff7a00);color:#1a0d00;font-weight:600;border-radius:16px 16px 5px 16px}
.bb.dots .m{display:flex;gap:4px;padding:11px 14px}
.bb.dots .m i{width:7px;height:7px;border-radius:50%;background:var(--ink3);animation:dt 1s infinite}
.bb.dots .m i:nth-child(2){animation-delay:.15s}.bb.dots .m i:nth-child(3){animation-delay:.3s}
@keyframes dt{40%{transform:translateY(-4px);opacity:.4}}
/* cards */
.cds{display:grid;gap:9px;width:100%;max-width:960px;margin:0 auto}
.cd{position:relative;padding:12px 16px;border-radius:18px;animation:bin .5s var(--ease) both;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center}
.cd:nth-child(2){animation-delay:.12s}.cd:nth-child(3){animation-delay:.24s}
.cd .nm{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);grid-column:1/-1}
.cd .bg{font-size:22px;font-weight:800;line-height:1.1;color:var(--acc2)}
.cd .nt{font-size:13.5px;color:var(--ink2);line-height:1.35}
.cd.hot{border-color:rgba(255,122,0,.8);box-shadow:0 0 34px -6px rgba(255,122,0,.55),inset 0 1px 0 rgba(255,176,102,.4)}
.cd.hot .bg{color:var(--o2)} .cd.hot .nm{color:var(--o)}
@media(min-width:720px){.cds{grid-template-columns:repeat(3,1fr)}.cd{display:block;padding:20px 22px}.cd .bg{font-size:30px;margin:6px 0}.cd .nt{font-size:15px}}
/* steps */
.sp{display:grid;gap:0;width:100%;max-width:960px;margin:0 auto;position:relative}
.sp .s{position:relative;display:grid;grid-template-columns:34px 1fr;gap:12px;padding-bottom:16px;opacity:.3;transition:opacity .6s}
.sp .s::before{content:"";position:absolute;inset-inline-start:16px;top:30px;bottom:-4px;width:2px;background:var(--line)}
.sp .s:last-child::before{display:none}
.sp .s .k{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#0b0e28;display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--ink3);transition:all .5s}
.sp .s.on{opacity:1}.sp .s.on .k{border-color:var(--o);color:#1a0d00;background:var(--o);box-shadow:0 0 20px rgba(255,122,0,.6)}
.sp .s b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--o2)} .sp .s span{font-size:15px;color:var(--ink2);line-height:1.38}
@media(min-width:720px){.sp{grid-template-columns:repeat(3,1fr);gap:18px}.sp .s{display:block;padding-top:0}.sp .s .k{margin-bottom:12px}.sp .s::before{inset-inline-start:46px;top:16px;bottom:auto;height:2px;width:calc(100% - 20px);display:block}.sp .s span{font-size:17px}}
/* quiz */
.qz{max-width:520px;margin:0 auto;padding:20px 18px;text-align:center;width:100%;position:relative}
.qz .q{font-size:22px;font-weight:700;line-height:1.25}
.qz .h{margin-top:8px;font-size:13px;color:var(--ink3);letter-spacing:.06em}
.qz .r{margin-top:14px;min-height:28px;font-weight:700;font-size:17px;opacity:0;transition:opacity .4s}
.qz .r.on{opacity:1}.qz .r.ok{color:var(--mint)}.qz .r.no{color:var(--amber)}
.cf{position:absolute;left:50%;top:50%;font-size:20px;color:var(--o2);pointer-events:none;z-index:6}
/* wardrobe */
.wr{height:100%;max-height:360px;align-self:center;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%;max-width:640px;margin:0 auto}
.wl{position:relative;border-radius:18px;padding:8px 6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:700;font-size:14px;color:var(--ink2);min-height:0;overflow:hidden;transition:all .25s}
.wl img{flex:1;min-height:0;max-width:100%;object-fit:contain}
.wl:hover{transform:translateY(-3px)}
.wl.on{border-color:var(--o);box-shadow:0 0 30px -4px rgba(255,122,0,.7);color:var(--o2)}
/* contact */
.cn{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;width:100%;max-width:520px;margin:0 auto}
.cn h4{font-size:24px}.cn .sb{margin:0;color:var(--ink2);font-size:15px;line-height:1.4}
.cb{display:flex;flex-direction:column;gap:9px;width:100%}.cb .sec{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cb .btn.pri{min-height:54px;font-size:18px}
.cn .me{margin:0;font-size:13px;color:var(--ink3);line-height:1.4}
.toast{position:fixed;left:50%;bottom:calc(46% + 20px);transform:translate(-50%,10px);padding:10px 16px;border-radius:12px;background:#1d1008;border:1px solid var(--o);color:var(--o2);font-weight:600;font-size:14px;opacity:0;transition:all .3s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- конспект ---------- */
#all{width:min(760px,100% - 32px);margin:0 auto;padding:56px 0 70px}
#all h2{font-size:clamp(26px,5vw,38px);margin:0 0 22px;letter-spacing:-.015em}
#all .sc{padding:18px 20px;margin-bottom:12px}
#all .sc h3{margin:0 0 8px;font-size:19px;color:var(--o2)}
#all .sc p{margin:0 0 8px;color:var(--ink2);font-size:16px}
#all .sc ul{margin:6px 0 0;padding-inline-start:20px;color:var(--ink2);font-size:15px;line-height:1.5}
#all .sc li b{color:var(--ink)}
#all .cta{margin-top:26px;display:flex;flex-direction:column;gap:10px}
#all .cta .sec{display:flex;flex-wrap:wrap;gap:9px}
#all .cta .sec .btn{flex:1 1 140px}
.og #all,.og .top .langs,.og .top .skip,.og .top .back{display:none}
.og body,html.og{overflow:hidden}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="nebula" aria-hidden="true"></div>
<canvas id="cosmos" aria-hidden="true"></canvas>
<main id="game">
  <header class="top">
    <button class="ib back" id="back" aria-label="Back" title="Back" disabled>←</button>
    <div class="brand" id="brand"></div>
    <span class="pill time" id="time"></span>
    <div class="langs" id="langs" role="group"></div>
    <button class="pill skip" id="skip" aria-label="skip"><span aria-hidden="true">⇣</span><span class="t" id="skipt"></span></button>
  </header>
  <section id="stage" aria-label="stage"></section>

    const box = w.getBoundingClientRect(), nb = num.getBoundingClientRect(), cx2 = nb.left + nb.width / 2 - box.left - box.width / 2, cy2 = nb.top + nb.height / 2 - box.top - 40;
    for (let i = 0; i < 16; i++) { const p = mk('i', 'pt'); p.style.setProperty('--c', sd.colors[i % 3]); w.appendChild(p);
      const a = rnd(i + 3) * 6.28, r = 90 + rnd(i * 5) * 110; p.animate([{ transform: 'translate(' + (Math.cos(a) * r + cx2) + 'px,' + (Math.sin(a) * r * .6 + cy2) + 'px)', opacity: 0 }, { opacity: 1, offset: .2 }, { transform: 'translate(' + cx2 + 'px,' + cy2 + 'px)', opacity: 0 }], { duration: 650, delay: i * 14, easing: 'ease-in', fill: 'both' }).onfinish = () => p.remove(); }
    num.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.1)', offset: .5 }, { transform: 'scale(1)' }], { duration: 450, delay: 450 });
    await sleep(550); showItems();
  })();
  return { destroy() { dead = true; } };
};
STAGES.approve = (root, sd, cp) => {
  const col = sd.color; root.style.setProperty('--c', col);
  const w = mk('div', 'ap'), box = mk('div', 'apb'), log = mk('div', 'log glass');
  box.innerHTML = '<span class="perim">' + esc(cp.perimeter || '') + '</span><div class="fr"><i></i>' + esc(cp.from || '') + '</div><h4>' + esc(tx(cp.title || '')) + '</h4><p>' + esc(tx(cp.body || '')) + '</p><div class="row"></div>';
  const row = box.querySelector('.row'), btn = mk('button', 'btn pri'), state = mk('span', 'state'); btn.type = 'button'; btn.textContent = cp.btn || ''; state.textContent = ''; row.append(btn, state);
  log.innerHTML = '<span class="n">0</span><span class="l"><b>' + esc(cp.log || '') + '</b><em style="font-style:normal">' + esc(cp.log_none || '') + '</em></span>';
  const comet = mk('i', 'comet'); w.append(box, log); root.append(w, comet);
  btn.addEventListener('click', e => { e.stopPropagation(); ctx.pickAct('approve'); });
  const n = log.querySelector('.n'), em = log.querySelector('em'); let sent = false;
  const landed = () => { n.textContent = '1'; em.textContent = cp.log_item || ''; log.animate([{ boxShadow: '0 0 0 0 ' + col }, { boxShadow: '0 0 30px 4px ' + col, offset: .4 }, { boxShadow: '0 0 0 0 transparent' }], { duration: 700 }); };
  return {
    act() { if (sent) return; sent = true; btn.disabled = true; state.textContent = cp.done || ''; state.classList.add('okd'); if (STILL) return landed();
      const H = root.getBoundingClientRect(), a = btn.getBoundingClientRect(), b = n.getBoundingClientRect(); const x0 = a.left + a.width / 2 - H.left, y0 = a.top + a.height / 2 - H.top, x1 = b.left + b.width / 2 - H.left, y1 = b.top + b.height / 2 - H.top;
      const mx = Math.max(x0, x1) + 70, my = (y0 + y1) / 2, t0 = performance.now(); comet.style.opacity = 1;
      (function fly(now) { const u = Math.min(1, (now - t0) / 750), e = u * u * (3 - 2 * u), x = (1 - e) * (1 - e) * x0 + 2 * (1 - e) * e * mx + e * e * x1, y = (1 - e) * (1 - e) * y0 + 2 * (1 - e) * e * my + e * e * y1; comet.style.transform = 'translate(' + x + 'px,' + y + 'px)'; if (u < 1) requestAnimationFrame(fly); else { comet.style.opacity = 0; landed(); } })(t0); },
    destroy() { }
  };
};
STAGES.chat = (root, sd, cp) => {
  const w = mk('div', 'ct glass'), hd = mk('div', 'hd', '<i></i>' + esc(cp.head || '')), ms = mk('div', 'ms'); w.append(hd, ms); root.appendChild(w);
  const av = spriteSrc('dreamy') || spriteSrc('wink'); let dead = false;
  const bubble = (spec, m) => { const raw = (cp.msgs || [])[m], pair = Array.isArray(raw), who = spec.who, me = who === 'me', e = mk('div', 'bb' + (me ? ' me' : ''));
    if (who === 'nano') e.innerHTML = '<span class="a" style="background-image:url(' + av + ')"></span>';
    if (spec.color) e.style.setProperty('--c', spec.color);
    const b = mk('div', 'm'); if (pair) { const s = mk('span', 'w'); s.textContent = tx(raw[0]); b.appendChild(s); b.appendChild(document.createTextNode(tx(raw[1]))); } else b.textContent = tx(raw || ''); e.appendChild(b); return e; };
  (async () => {
    for (let i = 0; i < sd.msgs.length; i++) { if (dead) return;
      if (!STILL && sd.msgs[i].who !== 'me') { const d = mk('div', 'bb dots', '<div class="m"><i></i><i></i><i></i></div>'); ms.appendChild(d); ms.scrollTop = ms.scrollHeight; await sleep(650); d.remove(); }
      else if (!STILL) await sleep(350);
      if (dead) return; ms.appendChild(bubble(sd.msgs[i], i)); ms.scrollTop = ms.scrollHeight; if (!STILL) await sleep(420); }
  })();
  return { destroy() { dead = true; } };
};
STAGES.cards = (root, sd, cp) => {
  const w = mk('div', 'cds'); (sd.cards || []).forEach(c => { const t = (cp.cards || {})[c.key] || ['', '', '']; const e = mk('div', 'cd glass' + (c.hot ? ' hot' : ''));
    e.innerHTML = '<span class="nm">' + esc(tx(t[0])) + '</span><span class="bg">' + esc(tx(t[1])) + '</span><span class="nt">' + esc(tx(t[2])) + '</span>'; w.appendChild(e); }); root.appendChild(w); return { destroy() { } };
};
STAGES.steps = (root, sd, cp) => {
  const w = mk('div', 'sp'), els = (cp.steps || []).map((s, i) => { const e = mk('div', 's', '<span class="k">' + (i + 1) + '</span><div><b>' + esc(tx(s[0])) + '</b><span>' + esc(tx(s[1])) + '</span></div>'); w.appendChild(e); return e; }); root.appendChild(w);
  let dead = false; if (STILL) els.forEach(e => e.classList.add('on')); else (async () => { await sleep(300); for (const e of els) { if (dead) return; e.classList.add('on'); await sleep(750); } })();
  return { destroy() { dead = true; } };
};
STAGES.quiz = (root, sd, cp) => {
  const w = mk('div', 'qz glass'); w.innerHTML = '<div class="q">' + esc(tx(cp.q || '')) + '</div><div class="h">' + esc(tx(cp.hint || '')) + '</div><div class="r"></div>'; root.appendChild(w);
  const r = w.querySelector('.r');
  return {
    act(c) { S.answered = true; const good = !!c.correct; r.textContent = tx(good ? cp.ok : cp.no); r.className = 'r on ' + (good ? 'ok' : 'no');
      const right = (cur.choices || []).find(x => x.correct); $$('.ch').forEach(b => { if (right && b.dataset.key === right.key) b.classList.add('good'); else if (b.dataset.key === c.key) b.classList.add('bad'); });
      if (good && !STILL) for (let i = 0; i < 18; i++) { const s = mk('i', 'cf', '✦'); w.appendChild(s); const a = rnd(i + 1) * 6.283, d = 80 + rnd(i * 3) * 120;
        s.animate([{ transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 }, { transform: 'translate(' + Math.cos(a) * d + 'px,' + (Math.sin(a) * d - 30) + 'px) rotate(' + rnd(i) * 360 + 'deg) scale(1.2)', opacity: 0 }], { duration: 900, easing: 'ease-out' }).onfinish = () => s.remove(); } },
    destroy() { }
  };
};
STAGES.wardrobe = (root, sd, cp) => {
  const w = mk('div', 'wr'), cards = {}; (sd.looks || []).forEach(k => { const b = mk('button', 'wl glass'); b.type = 'button'; b.innerHTML = '<img alt="" src="' + spriteSrc(k) + '"><span>' + esc(((cp.looks || {})[k]) || k) + '</span>';
    b.addEventListener('click', e => { e.stopPropagation(); Object.values(cards).forEach(x => x.classList.toggle('on', x === b)); ctx.pickKey(k); }); w.appendChild(b); cards[k] = b; }); root.appendChild(w);

  const w = mk('div', 'cn glass'); w.style.padding = '18px 16px'; w.innerHTML = '<h4>' + esc(tx(cp.title || '')) + '</h4><p class="sb">' + esc(tx(cp.sub || '')) + '</p>'; w.appendChild(contactButtons(sd.buttons, cp));
  w.appendChild(mk('p', 'me', esc(tx(cp.me || '')))); root.appendChild(w); return { destroy() { } };
};

/* ---------- конспект #all ---------- */
function stageText(sd, cp) {
  cp = cp || {}; const li = a => '<ul>' + a.map(x => '<li>' + x + '</li>').join('') + '</ul>';
  switch (sd.type) {
    case 'orbit': return li(sd.nodes.map(n => { const t = (cp.nodes || {})[n.key] || [n.key, '']; return '<b>' + esc(t[0]) + '</b> — ' + esc(t[1]); }));
    case 'tally': return '<p>' + esc(tx(cp.label_to || '')) + '</p>' + li((cp.items || []).map(i => '<b>' + esc(tx(i[0])) + '</b> — ' + esc(tx(i[1]))));
    case 'approve': return '<p><b>' + esc(tx(cp.title || '')) + '</b><br>' + esc(tx(cp.body || '')) + '</p>';
    case 'chat': return li((cp.msgs || []).map(m => Array.isArray(m) ? '<b>' + esc(tx(m[0])) + '</b> — ' + esc(tx(m[1])) : esc(tx(m))));
    case 'cards': return li(sd.cards.map(c => { const t = (cp.cards || {})[c.key] || []; return '<b>' + esc(tx(t[0] || '')) + '</b> · ' + esc(tx(t[1] || '')) + ' — ' + esc(tx(t[2] || '')); }));
    case 'steps': return li((cp.steps || []).map(s => '<b>' + esc(tx(s[0])) + '</b> — ' + esc(tx(s[1]))));
    case 'quiz': return '<p><b>' + esc(tx(cp.q || '')) + '</b> ' + esc(tx(cp.hint || '')) + '</p>';
    case 'wardrobe': return li(sd.looks.map(k => esc((cp.looks || {})[k] || k)));
    case 'contact': return '<p>' + esc(tx(cp.sub || '')) + '</p>';
  } return '';
}
function renderAll() {
  const el = $('#all'); el.innerHTML = '<h2>' + esc(ui('all_title')) + '</h2>';
  SC.scenes.forEach(s => { const c = cscene(s.id), d = mk('div', 'sc glass'); d.innerHTML = '<h3>' + esc(tx(c.title || s.id)) + '</h3>' + (c.lines || []).map(l => '<p>' + esc(tx(l)) + '</p>').join('') + stageText(s.stage, c.stage); el.appendChild(d); });
  const endS = SC.scenes.find(s => s.stage.type === 'contact'), cta = mk('div', 'cta'); if (endS) cta.appendChild(contactButtons(endS.stage.buttons, cscene(endS.id).stage || {}));
  const pl = mk('button', 'btn'); pl.type = 'button'; pl.textContent = ui('play'); pl.addEventListener('click', () => scrollTo({ top: 0, behavior: STILL ? 'auto' : 'smooth' })); cta.appendChild(pl); el.appendChild(cta);
}

/* ---------- шапка и язык ---------- */
function chrome() {
  const L = S.lang, h = document.documentElement; h.lang = L; h.dir = RTL.includes(L) ? 'rtl' : 'ltr'; loadFont(); document.title = (C().meta && C().meta.title) || document.title;

  $('#nm').textContent = ui('name'); $('#skipt').textContent = ui('skip'); $('#skip').title = ui('skip'); $('#skip').setAttribute('aria-label', ui('skip'));
  $('#back').title = ui('back'); $('#back').setAttribute('aria-label', ui('back')); $('#av').style.backgroundImage = 'url(' + spriteSrc(SC.avatar) + ')';
  const lg = $('#langs'); lg.innerHTML = ''; lg.title = ui('lang'); lg.hidden = SC.langs.length < 2;
  SC.langs.forEach(l => { const b = mk('button', l === L ? 'on' : ''); b.type = 'button'; b.textContent = LNAME[l] || l.toUpperCase(); b.setAttribute('aria-pressed', l === L); b.addEventListener('click', () => { if (l === S.lang) return; S.lang = l; chrome(); renderAll(); rerender(); }); lg.appendChild(b); });

/* ---------- старт ---------- */
chrome(); renderAll();
if (QS && byId[QS]) { enter(QS, { line: QL, instant: true }); }
