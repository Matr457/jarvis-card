<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NANO · Мозг в 3D</title>
<meta name="description" content="Второй мозг NANO в 3D: 2 387 заметок, 9 доменов. Крути, ищи, спрашивай живой мозг прямо из заметки.">
<meta property="og:title" content="NANO · Мозг в 3D">
<meta property="og:description" content="Второй мозг NANO в 3D: 2 387 заметок, 9 доменов. Крути, ищи, спрашивай живой мозг прямо из заметки.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://matr457.github.io/jarvis-card/graph/">
<meta property="og:image" content="https://matr457.github.io/jarvis-card/graph/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#07060e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Montserrat:wght@600;700;800&family=Oswald:wght@500;600;700&display=swap">
<style>
/* Layout: two screens under one HUD bar. Card + quest side by side on desktop, stacked on phone; Q&A = NANO column + chat.
   Look: night-city AI department. One neon yellow for actions, cyan for data, hot pink for NANO; brain colours only in the game. */
:root {
  --void: #07060e;
  --deep: #0e0b1e;
  --panel: rgba(17, 13, 34, .88);
  --panel2: rgba(27, 21, 52, .9);
  --line: #2d2655;
  --ink: #efebff;
  --dim: #9d97c6;
  --neon: #f6e71d;
  --cyan: #34efff;
  --hot: #ff3d8b;
  --lav: #c6b6ff;
  --ff-d: "Oswald", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Arial Narrow", sans-serif;
  --ff-b: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --ff-m: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --cut: 16px;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gutR: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--void); -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--void); color: var(--ink); font: 400 15px/1.5 var(--ff-b);
  padding-left: var(--gut); padding-right: var(--gutR); padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)); overflow-x: hidden; }
img { max-width: 100%; display: block; }
button, input { font: inherit; color: inherit; }
a { color: var(--cyan); }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.mono { font-family: var(--ff-m); font-size: 11px; letter-spacing: .06em; }
.dim { color: var(--dim); }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* фон: туман неона, сетка, звёзды, развёртка */
.fx { position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(60% 45% at 88% -5%, rgba(255, 61, 139, .28), transparent 70%),
    radial-gradient(55% 50% at -5% 105%, rgba(52, 239, 255, .17), transparent 70%),
    radial-gradient(40% 30% at 50% 50%, rgba(140, 110, 255, .10), transparent 70%),
    radial-gradient(1px 1px at 12% 22%, #fff9, transparent 60%), radial-gradient(1px 1px at 72% 12%, #fff8, transparent 60%),
    radial-gradient(1.4px 1.4px at 38% 64%, #cfc3ff, transparent 60%), radial-gradient(1px 1px at 86% 78%, #fff7, transparent 60%),
    radial-gradient(1px 1px at 56% 34%, #fff6, transparent 60%), radial-gradient(1.2px 1.2px at 24% 88%, #bdf7ff, transparent 60%),
    linear-gradient(rgba(120, 100, 255, .055) 1px, transparent 1px) 0 0 / 44px 44px,
    linear-gradient(90deg, rgba(120, 100, 255, .055) 1px, transparent 1px) 0 0 / 44px 44px,
    var(--void); }
.fx::after { content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .22) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }

/* срезанные углы, как у панелей HUD */
.cut { position: relative; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line);
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut))); }
.cut::after, .cut::before { content: ""; position: absolute; width: var(--cut); height: var(--cut); pointer-events: none; }
.cut::after { top: 0; right: 0; background: linear-gradient(to bottom left, transparent calc(50% - 1.5px), var(--neon) 0 calc(50% + 1.5px), transparent 0); }
.cut::before { bottom: 0; left: 0; background: linear-gradient(to top right, transparent calc(50% - 1.5px), var(--line) 0 calc(50% + 1.5px), transparent 0); }

/* верхняя полоса */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 10px; margin-bottom: 12px; background: linear-gradient(var(--void) 70%, transparent); }
.logo { display: flex; align-items: baseline; gap: 2px; text-decoration: none; color: var(--ink); font: 700 18px/1 var(--ff-d); letter-spacing: .04em; }
.logo i { color: var(--hot); font-style: normal; }
.logo span { font: 600 10px/1 var(--ff-m); letter-spacing: .14em; color: var(--dim); margin-left: 4px; }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tab { display: flex; align-items: baseline; gap: 6px; padding: 7px 12px; text-decoration: none; color: var(--dim); font: 600 14px/1 var(--ff-d);
  text-transform: uppercase; letter-spacing: .06em; box-shadow: inset 0 0 0 1px var(--line);
  clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 0 100%); }
.tab em { font: 600 10px/1 var(--ff-m); font-style: normal; color: var(--hot); }
.tab[aria-current="page"] { color: var(--void); background: var(--neon); box-shadow: none; }
.tab[aria-current="page"] em { color: var(--void); }
.langs { display: flex; gap: 2px; }
.langs button { border: 0; background: transparent; color: var(--dim); padding: 6px 7px; font: 600 11px/1 var(--ff-m); cursor: pointer; }
.langs button[aria-pressed="true"] { color: var(--neon); box-shadow: inset 0 -2px 0 var(--neon); }

main { max-width: 1320px; margin: 0 auto; }
.screen { display: grid; gap: 14px; }

/* ── экран 1: визитка ───────────────────────────────── */
/* лишняя высота фигуры уходит в пустую строку «.», а не в зазоры между заголовком и лидом */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto 1fr auto auto; column-gap: 8px;
  grid-template-areas: "eye fig" "h1 fig" "lead fig" ". fig" "form form" "proof proof"; padding: 18px 16px 16px; overflow: hidden; }
.hero-text { display: contents; }
.eyebrow { grid-area: eye; margin: 0 0 8px; color: var(--cyan); text-transform: uppercase; }
.blink { color: var(--hot); animation: blink 1.6s steps(2, start) infinite; }
h1 { grid-area: h1; position: relative; z-index: 2; margin: 0; font: 700 clamp(34px, 10vw, 84px)/.9 var(--ff-d); text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.h1b { color: var(--neon); }
.glitch { text-shadow: 2px 0 rgba(255, 61, 139, .75), -2px 0 rgba(52, 239, 255, .6); animation: glitch 5.5s infinite; }
.lead { grid-area: lead; margin: 12px 0 0; max-width: 40ch; color: #d9d4f5; font-size: 15px; }
.hero-fig { grid-area: fig; position: relative; margin: 0; align-self: end; width: clamp(118px, 34vw, 300px); }
.hero-fig img { width: 100%; height: auto; filter: drop-shadow(0 0 18px rgba(198, 182, 255, .45)) drop-shadow(0 0 2px rgba(52, 239, 255, .8));
  animation: sway 6s ease-in-out infinite; transform-origin: 50% 100%; }
.hud { position: absolute; z-index: 1; padding: 3px 6px; background: rgba(7, 6, 14, .78); box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; font-size: 9px; }
.hud-a { top: 4%; left: -6px; color: var(--cyan); }
.hud-b { bottom: 18%; right: 0; color: var(--neon); }

.formula { grid-area: form; list-style: none; margin: 16px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.formula li { position: relative; padding: 10px 10px 9px 30px; background: var(--panel2); box-shadow: inset 0 0 0 1px var(--line); min-width: 0;
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); }
.formula li::before { content: attr(data-op); position: absolute; left: 9px; top: 9px; font: 700 15px/1 var(--ff-m); color: var(--hot); }
.formula b { display: block; font: 600 17px/1.1 var(--ff-d); text-transform: uppercase; letter-spacing: .04em; }
.formula span { display: block; margin-top: 3px; font-size: 12px; line-height: 1.3; color: var(--dim); }
.formula li.out { background: var(--neon); box-shadow: none; }
.formula li.out b, .formula li.out span, .formula li.out::before { color: var(--void); }
.proof { grid-area: proof; margin-top: 14px; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
.proof p { margin: 0; text-transform: uppercase; }
.stats { display: flex; gap: 18px; margin: 0; }
.stats div { min-width: 0; }
.stats dt { font: 600 24px/1 var(--ff-d); color: var(--cyan); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.stats dd { margin: 2px 0 0; font: 400 10px/1 var(--ff-m); color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }

/* квест */
.quest { padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.q-head { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.q-head h2 { margin: 0; font: 600 20px/1.05 var(--ff-d); text-transform: uppercase; letter-spacing: .04em; }
.q-head p { margin: 4px 0 0; }
.pips { list-style: none; display: grid; grid-template-columns: repeat(4, 12px); gap: 4px; margin: 2px 0 0; padding: 0; }
.pips li { width: 12px; height: 12px; box-shadow: inset 0 0 0 1px var(--c); opacity: .55; transform: rotate(45deg) scale(.8); transition: .3s; }
.pips li.on { background: var(--c); opacity: 1; box-shadow: 0 0 10px var(--c); }
.stage { position: relative; width: 100%; aspect-ratio: 1 / 1.02; max-width: 100%; background: radial-gradient(circle at 50% 50%, #17123155, transparent 70%);
  box-shadow: inset 0 0 0 1px rgba(45, 38, 85, .6); overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
.lvl-bar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  background: linear-gradient(rgba(7, 6, 14, .9), rgba(7, 6, 14, 0)); pointer-events: none; }
.lvl-bar .x { pointer-events: auto; width: 34px; height: 34px; border: 0; background: rgba(7, 6, 14, .8); box-shadow: inset 0 0 0 1px var(--line);
  color: var(--ink); font: 600 22px/1 var(--ff-d); cursor: pointer; }
.lvl-name { display: flex; flex-direction: column; min-width: 0; }
.lvl-name b { font: 600 16px/1.1 var(--ff-d); text-transform: uppercase; letter-spacing: .05em; color: var(--c, var(--ink)); }
.lvl-name span { font-size: 13px; color: var(--ink); }
.goal { list-style: none; display: flex; gap: 4px; margin: 0 0 0 auto; padding: 0; }
.goal li { width: 9px; height: 9px; box-shadow: inset 0 0 0 1px var(--c); transform: rotate(45deg); }
.goal li.on { background: var(--c); box-shadow: 0 0 8px var(--c); }

/* NANO говорит под сценой, а не поверх неё: низ поля — игровой (корзина, пятый агент, нижний ряд) */
.nano-say { display: flex; align-items: center; gap: 8px; min-height: 60px; }
.nano-say img { width: 56px; height: 56px; object-fit: contain; flex: none; filter: drop-shadow(0 0 8px rgba(198, 182, 255, .5)); }
.nano-say p { position: relative; flex: 1; min-width: 0; margin: 0; padding: 8px 12px; font-size: 14px; line-height: 1.35; background: rgba(7, 6, 14, .7);
  box-shadow: inset 0 0 0 1px var(--hot); clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px); }
.nano-say.pop img { animation: pop .4s cubic-bezier(.3, 1.6, .5, 1); }
.nano-say.pop p { animation: slide .3s ease-out; }

.win { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center;
  padding: 20px; background: radial-gradient(circle, rgba(7, 6, 14, .8), rgba(7, 6, 14, .93)); }
.win h3 { margin: 0; font: 700 clamp(36px, 9vw, 64px)/.95 var(--ff-d); text-transform: uppercase; color: var(--neon); }
.win p { margin: 0; max-width: 34ch; }
.win-k { color: var(--cyan); }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
.q-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.skip { color: var(--dim); text-transform: uppercase; }
.skip:hover { color: var(--neon); }

/* кнопки */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 10px 18px; border: 0; cursor: pointer;
  background: var(--neon); color: var(--void); text-decoration: none; font: 600 15px/1 var(--ff-d); text-transform: uppercase; letter-spacing: .06em;
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px)); transition: transform .15s, filter .15s; }
.btn:hover { transform: translate(-1px, -1px); filter: drop-shadow(3px 3px 0 var(--hot)); }
.btn.ghost { background: transparent; color: var(--neon); box-shadow: inset 0 0 0 1.5px var(--neon); }

/* ── экран 2: вопросы ───────────────────────────────── */
.s-ask { grid-template-columns: minmax(0, 1fr); }
.ask-side { display: flex; align-items: center; gap: 14px; padding: 12px 14px; }
.ask-side img { width: 64px; height: auto; flex: none; filter: drop-shadow(0 0 12px rgba(198, 182, 255, .5)); transition: opacity .2s; }
.status { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; color: var(--dim); min-width: 0; }
.status li { display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--dim); }
.dot.core { background: var(--neon); box-shadow: 0 0 8px var(--neon); }
.dot.on { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: blink 2s ease-in-out infinite; }
.dot.off { background: var(--hot); }
.chat { padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.c-head h2 { margin: 0; font: 600 22px/1.05 var(--ff-d); text-transform: uppercase; letter-spacing: .04em; }
.c-head p { margin: 4px 0 0; font-size: 13px; }
.log { display: flex; flex-direction: column; gap: 10px; height: 44vh; min-height: 260px; overflow-y: auto; padding: 4px 2px; scroll-behavior: smooth; }
.msg { max-width: 88%; padding: 10px 12px; font-size: 15px; line-height: 1.45; min-width: 0; overflow-wrap: anywhere; }
.msg.bot { align-self: flex-start; background: var(--panel2); box-shadow: inset 0 0 0 1px var(--line);
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); }
.msg.me { align-self: flex-end; background: rgba(246, 231, 29, .08); box-shadow: inset 0 0 0 1px rgba(246, 231, 29, .55); }
.msg .b { display: block; margin-top: 6px; font: 400 10px/1.2 var(--ff-m); letter-spacing: .06em; color: var(--dim); text-transform: uppercase; }
.msg .b.core { color: var(--neon); }
.msg .b.live { color: var(--cyan); }
.msg.wait { color: var(--dim); font-style: italic; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 0; cursor: pointer; padding: 8px 11px; background: rgba(7, 6, 14, .6); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink);
  font-size: 13px; line-height: 1.2; clip-path: polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 0 100%); transition: box-shadow .15s, color .15s; }
.chips button:hover { box-shadow: inset 0 0 0 1px var(--cyan); color: var(--cyan); }
.chips button.brain { color: var(--lav); }
/* на телефоне подсказки — одна лента со скроллом вбок, иначе четыре ряда кнопок съедают чат */
@media (max-width: 999px) {
  .chips { flex-wrap: nowrap; overflow-x: auto; margin-inline: -14px; padding-inline: 14px; scrollbar-width: none;
    mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 24px), transparent); }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; white-space: nowrap; }
  .log { height: 52vh; }
}
.ask-form { display: flex; gap: 8px; }
.ask-form input { flex: 1; min-width: 0; height: 44px; padding: 0 12px; border: 0; background: rgba(7, 6, 14, .8); box-shadow: inset 0 0 0 1px var(--line); font-size: 16px; }
.ask-form input:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--cyan); }
.cta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.mail { color: var(--dim); overflow-wrap: anywhere; user-select: all; }
.copy { border: 0; background: transparent; color: var(--cyan); cursor: pointer; font: inherit; text-decoration: underline; padding: 4px; }
.foot { margin: 0; text-transform: uppercase; font-size: 10px; }

/* ── широкий экран ───────────────────────────────── */
@media (min-width: 720px) {
  .formula { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .hero-fig { width: clamp(150px, 24vw, 260px); }
}
@media (min-width: 1000px) {
  .s-card { grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr); align-items: stretch; }
  /* формула встаёт под лид, слева от фигуры: на широком экране под заголовком не остаётся пустоты */
  .hero { grid-template-areas: "eye eye" "h1 fig" "lead fig" "form fig" ". fig" "proof proof"; grid-template-rows: auto auto auto auto 1fr auto;
    padding: 26px 24px 20px; column-gap: 18px; }
  h1 { font-size: clamp(48px, 4.6vw, 72px); }
  .lead { font-size: 16px; }
  .formula { grid-template-columns: minmax(0, 1fr); gap: 6px; }   /* формула читается сверху вниз: мозг + харнес + цвета = свой ИИ */
  .formula li { display: flex; align-items: baseline; gap: 12px; padding-block: 11px; }
  .formula span { margin-top: 0; }
  .hero-fig { width: clamp(170px, 15vw, 230px); }
  .stage { aspect-ratio: auto; flex: 1; min-height: 520px; }
  .s-ask { grid-template-columns: 300px minmax(0, 1fr); align-items: stretch; }
  .ask-side { flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; }
  .ask-side img { width: 220px; }
  .log { height: 46vh; }
}

@keyframes blink { 50% { opacity: .25; } }
@keyframes pop { 0% { transform: scale(.7) rotate(-6deg); } 100% { transform: none; } }
@keyframes slide { 0% { opacity: 0; transform: translateX(-6px); } 100% { opacity: 1; transform: none; } }
@keyframes sway { 0%, 100% { transform: rotate(-.8deg); } 50% { transform: rotate(.8deg) translateY(-3px); } }
@keyframes glitch {
  0%, 92%, 100% { transform: none; text-shadow: 2px 0 rgba(255, 61, 139, .75), -2px 0 rgba(52, 239, 255, .6); }
  93% { transform: translate(2px, 0) skewX(-6deg); text-shadow: -4px 0 rgba(255, 61, 139, .9), 4px 0 rgba(52, 239, 255, .8); }
  95% { transform: translate(-2px, 1px); text-shadow: 3px 0 rgba(255, 61, 139, .9), -3px 0 rgba(52, 239, 255, .8); }
  97% { transform: translate(1px, -1px) skewX(4deg); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
/* Три продукта поверх page.css: галактика на фоне, аватар в пол роста (60 % экрана), 3D-мозг, настройки.
   b2c и graph — облик NANO_FINAL/04_UI_SPECS (бабблгам-стекло на индиго), b2b — ночной город page.css. */

/* галактика — канон «космос + звёзды» (RIG/anim/cosmos.js): звёзды на холсте поверх туманности .fx, под всем контентом */
.fx { z-index: -2; }
#cosmos { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
body.no-galaxy #cosmos { display: none; }
body.no-galaxy .fx { background: var(--void); }

/* Канон NANO_FINAL/04_UI_SPECS (tokens.css) для всех трёх: индиго-ночь, один фиолетовый акцент, розовый/мята/золото — только сигналы.
   Углы — по канону: карточка 22, панель 16, чип 10, кнопка-пилюля; срезанных углов киберпанка нет. */
body {
  --void: #070b22; --deep: #0b1030; --panel: rgba(11, 16, 48, .62); --panel2: rgba(28, 33, 96, .5); --line: rgba(185, 166, 255, .22);
  --ink: #f4f0ff; --dim: #a7a1d4; --neon: #9b7bff; --cyan: #b9a6ff; --hot: #ffb3e6; --lav: #d9c3ff; --mint: #9ff7c1; --gold: #ffe79a;
  --ff-d: "Montserrat", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --ff-b: "Inter", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --ff-m: "Inter", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  background: var(--void); }
.fx { background: radial-gradient(70% 45% at 85% -5%, rgba(155, 123, 255, .26), transparent 70%),
    radial-gradient(60% 45% at -10% 100%, rgba(217, 195, 255, .1), transparent 70%), linear-gradient(#070b22, #0b1030); }
.fx::after { display: none; }
.mono { font-weight: 500; letter-spacing: .08em; text-transform: uppercase; font-size: 10.5px; color: var(--cyan); }
.cut, .tab, .btn, .formula li, .nano-say p, .msg.bot, .chips button { clip-path: none; }
.cut { border-radius: 22px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.cut::before, .cut::after { display: none; }
.tab { border-radius: 999px; text-transform: none; font-weight: 600; letter-spacing: .01em; }
.tab[aria-current="page"] { color: #fff; }
.tab[aria-current="page"] em { color: rgba(255, 255, 255, .7); }
.btn { border-radius: 999px; font-family: var(--ff-d); font-weight: 600; text-transform: none; letter-spacing: .01em; color: #fff;
  transition: transform .16s var(--ease), box-shadow .16s var(--ease); }
.btn:hover { transform: translateY(-1px); filter: none; box-shadow: 0 6px 20px rgba(155, 123, 255, .4); }
.btn.ghost { color: var(--cyan); box-shadow: inset 0 0 0 1px var(--line); }
.formula li, .nano-say p { border-radius: 16px; }
.chips button, .msg.bot, .msg.me { border-radius: 14px; }
.ask-form input { border-radius: 999px; padding-inline: 18px; }
.logo i { color: var(--neon); }
.bar { background: linear-gradient(rgba(7, 11, 34, .94) 70%, transparent); }

.gear { display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 50%; cursor: pointer; color: var(--ink);
  background: rgba(255, 255, 255, .06); box-shadow: inset 0 0 0 1px var(--line); transition: transform .28s; }
.gear:hover { transform: rotate(60deg); color: var(--neon); }

/* ── аватар в пол роста: 60 % экрана ── */
.s-ask { grid-template-columns: minmax(0, 1fr); }
.avatar { --aura: rgba(198, 182, 255, .42); --lx: 0; --ly: 0; position: relative; height: 60svh; min-height: 400px; max-height: 760px; overflow: hidden;
  border-radius: 22px; isolation: isolate; box-shadow: inset 0 0 0 1px var(--line);
  background: radial-gradient(70% 55% at 50% 28%, rgba(150, 120, 255, .26), transparent 72%), linear-gradient(rgba(16, 14, 52, .35), rgba(8, 8, 28, .55)); }
.avatar[data-state="listening"] { --aura: rgba(159, 243, 224, .5); }
.avatar[data-state="thinking"], .avatar[data-state="working"] { --aura: rgba(176, 150, 255, .7); }
.avatar[data-state="speaking"] { --aura: rgba(255, 154, 213, .5); }
.avatar[data-state="success"], .avatar[data-state="approve"] { --aura: rgba(140, 240, 190, .55); }
.avatar[data-state="idea"] { --aura: rgba(255, 214, 120, .55); }
.avatar[data-state="error"] { --aura: rgba(255, 120, 150, .5); }
.avatar[data-state="sleep"] { --aura: rgba(110, 110, 200, .3); }
.av-aura { position: absolute; inset: -10% -10% 20%; z-index: -1; background: radial-gradient(34% 34% at 50% 30%, var(--aura), transparent 72%);
  transition: background .6s var(--ease); }
.avatar[data-state="thinking"] .av-aura, .avatar[data-state="working"] .av-aura { animation: aura 1.4s ease-in-out infinite; }
/* живой стикер BUBBLEGUM_ANIM: весь холст по высоте, ноги уходят под пузырь — видно в пол роста; смена — перекрёстная, 280 мс */
.av-fig { position: absolute; left: 50%; top: 3%; height: var(--figH, 128%); width: auto; max-width: none; transform: translateX(-50%);
  opacity: 0; transition: opacity .28s var(--ease), filter .6s var(--ease); filter: drop-shadow(0 0 24px var(--aura)); }
.av-fig.on { opacity: 1; }
.avatar[data-state="sleep"] .av-fig { filter: drop-shadow(0 0 14px var(--aura)) saturate(.6) brightness(.8); }
.av-say { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; padding: 14px 16px;
  border-radius: 16px; max-height: 42%; overflow-y: auto; overscroll-behavior: contain;
  background: rgba(11, 16, 48, .88); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: inset 0 0 0 1px var(--line), 0 12px 34px rgba(0, 0, 0, .4); }
.av-body { min-width: 0; flex: 1; }
.av-name { display: flex; align-items: center; gap: 8px; margin: 0; }
.av-name b { font: 700 12px/1 var(--ff-d); letter-spacing: .18em; color: var(--cyan); }
.av-name .dot.on { background: var(--mint); box-shadow: 0 0 8px var(--mint); }
.av-name span { color: var(--dim); letter-spacing: .06em; }
#avText { margin: 5px 0 0; font-size: 15px; line-height: 1.48; overflow-wrap: anywhere; min-height: 1.5em; }
.av-say.wait #avText { color: var(--dim); font-style: italic; }
.av-say.wait #avText::after { content: " •••"; letter-spacing: .2em; animation: blink 1s steps(2) infinite; }
.av-src { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.av-src:empty { display: none; }
.av-src button { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 6px 10px 6px 8px; border: 0; border-radius: 999px; cursor: pointer;
  font-size: 12px; line-height: 1.2; color: var(--ink); background: rgba(255, 255, 255, .07); box-shadow: inset 0 0 0 1px var(--c, var(--line));
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.av-src button::before { content: ""; width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.s-ask .chat { gap: 10px; }
.s-ask .log { height: auto; min-height: 0; max-height: 46vh; }
.s-ask .c-head { padding-top: 8px; border-top: 1px solid var(--line); }
.s-ask .c-head h2 { font-size: 16px; }

/* ── 3D-мозг ── */
.s-brain { grid-template-columns: minmax(0, 1fr); gap: 12px; }
.br-head h2 { margin: 0; font: 700 24px/1.05 var(--ff-d); letter-spacing: .02em; text-wrap: balance; }
.br-head p { margin: 5px 0 0; font-size: 13px; }
.br-stage { position: relative; height: 58svh; min-height: 340px; max-height: 820px; border-radius: 22px; overflow: hidden;
  background: radial-gradient(60% 55% at 50% 50%, rgba(130, 100, 255, .14), transparent 72%); box-shadow: inset 0 0 0 1px var(--line); }
.br-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.br-msg { position: absolute; top: 12px; left: 14px; right: 14px; margin: 0; color: var(--cyan); pointer-events: none; }
.br-hint { position: absolute; bottom: 10px; left: 14px; margin: 0; color: var(--dim); pointer-events: none; }
.legend { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding: 2px 4px; }
.legend::-webkit-scrollbar { display: none; }
.legend button { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; border: 0; border-radius: 999px; cursor: pointer;
  font-size: 12.5px; line-height: 1; color: var(--ink); background: rgba(255, 255, 255, .05); box-shadow: inset 0 0 0 1px var(--line); }
.legend button i { width: 9px; height: 9px; border-radius: 50%; background: var(--c, conic-gradient(#ff8fc8, #8fb4ff, #9ff3e0, #ffd67a, #ff8fc8)); }
.legend button em { font-style: normal; font: 400 10.5px/1 var(--ff-m); color: var(--dim); }
.legend button[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px var(--c, var(--cyan)); background: rgba(255, 255, 255, .1); }
.br-full { justify-self: start; color: var(--cyan); text-decoration: none; padding: 6px 0; }
.note { --c: var(--lav); position: fixed; z-index: 30; left: var(--gut); right: var(--gutR); bottom: max(12px, env(safe-area-inset-bottom, 0px));
  max-width: 560px; margin-inline: auto; max-height: 52svh; overflow-y: auto; overscroll-behavior: contain; padding: 16px 16px 14px; border-radius: 22px;
  background: rgba(11, 14, 46, .92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: inset 0 0 0 1.5px var(--c), 0 -10px 40px rgba(0, 0, 0, .55); animation: up .28s ease-out; }
.n-x { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border: 0; border-radius: 50%; cursor: pointer; font-size: 22px; line-height: 1;
  color: var(--dim); background: rgba(255, 255, 255, .06); }
.n-c { display: flex; align-items: center; gap: 7px; margin: 0; color: var(--c); text-transform: uppercase; }
.n-c i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
.note h3 { margin: 6px 40px 0 0; font: 700 19px/1.2 var(--ff-d); text-wrap: balance; }
.n-s { margin: 8px 0 0; font-size: 14px; line-height: 1.5; opacity: .9; }
.n-l { margin: 12px 0 6px; color: var(--dim); text-transform: uppercase; font-size: 10px; }
.n-near { display: flex; flex-wrap: wrap; gap: 6px; }
.n-near button { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 6px 10px 6px 8px; border: 0; border-radius: 999px; cursor: pointer;
  font-size: 12px; color: var(--ink); background: rgba(255, 255, 255, .06); box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.n-near button::before { content: ""; width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--c); }
.n-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.n-face { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; object-position: 50% 12%; box-shadow: 0 0 0 2px var(--c); }
.n-ans { margin: 12px 0 0; padding: 12px; border-radius: 14px; font-size: 14px; line-height: 1.5; background: rgba(255, 255, 255, .05); white-space: pre-line; }
.n-ans.wait { color: var(--dim); font-style: italic; }

/* ── настройки ── */
.sheet { position: fixed; inset: 0; z-index: 50; display: grid; align-items: end; justify-items: center; background: rgba(4, 4, 16, .6);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); padding-left: var(--gut); padding-right: var(--gutR); }
.sheet-in { width: 100%; max-width: 520px; display: grid; gap: 10px; padding: 20px 18px max(18px, env(safe-area-inset-bottom, 0px)); border-radius: 24px 24px 0 0;
  background: rgba(14, 16, 52, .97); box-shadow: inset 0 0 0 1px var(--line), 0 -12px 40px rgba(0, 0, 0, .5); animation: up .28s ease-out; max-height: 88svh; overflow-y: auto; }
.sheet-in h2 { margin: 0 0 4px; font: 700 20px/1 var(--ff-d); }
.set-l { margin: 6px 0 0; color: var(--dim); text-transform: uppercase; font-size: 10px; }
.langs.big { gap: 6px; }
.langs.big button { flex: 1; padding: 11px 0; border-radius: 12px; font-size: 13px; background: rgba(255, 255, 255, .05); box-shadow: inset 0 0 0 1px var(--line); }
.langs.big button[aria-pressed="true"] { color: #fff; background: var(--neon); box-shadow: none; }
.sw { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 14px; border: 0; border-radius: 14px; cursor: pointer; color: var(--ink);
  background: rgba(255, 255, 255, .05); box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; text-align: left; }
.sw i { position: relative; width: 44px; height: 26px; flex: none; border-radius: 999px; background: rgba(255, 255, 255, .14); transition: background .16s; }
.sw i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .16s; }
.sw[aria-checked="true"] i { background: var(--neon); }
.sw[aria-checked="true"] i::after { transform: translateX(18px); }
.set-note { margin: 2px 0 0; font-size: 12px; }

@media (max-width: 999px) {
  .bar { gap: 8px 10px; }
  .tabs { order: 5; width: 100%; margin-left: 0; }
  .tabs .tab { flex: 1; justify-content: center; }
  .bar .langs:not(.big) { margin-left: auto; }
  h1 { font-size: clamp(28px, 7.4vw, 60px); }   /* Montserrat шире прежнего узкого шрифта: заголовок не наезжает на героя */
}
/* ноутбук: разговор — аватар слева во всю высоту окна, чат справа; мозг — сцена во всю ширину, карточка заметки справа */
@media (min-width: 1000px) {
  .s-ask { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 24px; align-items: start; }
  .avatar { position: sticky; top: 84px; height: calc(100svh - 108px); min-height: 520px; max-height: 900px; --figH: 108%; }
  .av-say { left: 16px; right: 16px; bottom: 16px; max-height: 46%; }
  #avText { font-size: 16px; }
  .s-ask .chat { padding: 22px; }
  .s-ask .log { max-height: calc(100svh - 470px); min-height: 160px; }
  .br-stage { height: calc(100svh - 250px); min-height: 480px; }
  .note { left: auto; right: max(40px, var(--gutR)); top: 172px; bottom: auto; width: 380px; margin: 0; max-height: calc(100svh - 290px); }
}
@keyframes aura { 0%, 100% { opacity: .85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
@keyframes up { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .av-fig, .av-aura { transition: none; animation: none; } }

</style>

<body data-aud="graph">

<canvas id="cosmos" aria-hidden="true"></canvas>

<header class="bar">

<main>
  <!-- ЭКРАН «Визитка» (b2b): визитка + квест -->
  <section class="screen s-card" id="s-card" data-screen="card" hidden>

<!-- настройки: язык, образ, галактика, голос -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="setT">

,"ru":"Мозг: что про PageRank?","zh":"大脑：PageRank","en":"Brain: PageRank?"},{"q":"градиентный спуск","q_en":"gradient descent","ru":"Мозг: градиентный спуск","zh":"大脑：梯度下降","en":"Brain: gradient descent"},{"id":"founder","ru":"Кто основатель?","zh":"创始人是谁？","en":"Who is the founder?"}],"intents":[{"id":"avatar","sprite":"20-idea","keys":{"ru":["аватар","что такое nano","что такое нано","кто ты","что ты так","своя модель","свой ии","собственный ии","харнес"],"en":["avatar","what is nano","who are you","own model","own ai","harness"],"zh":["化身","你是谁","自有","框架","什么是 nano","什么是nano"]},"ru":"Аватар — это второй мозг компании и харнес вокруг него. Мозг хранит знания и опыт: документы, решения, переписку, уроки. Харнес — агенты по цветам-доменам, скилы, проверки и кнопка «Одобрить». Вместе это ваш собственный ИИ: модель-движок можно сменить, а мозг и опыт остаются вашими.","zh":"化身就是公司的第二大脑，加上外面的一层智能体框架。大脑保存知识和经验：文档、决策、往来邮件、教训。框架是按颜色领域分工的智能体、技能、检查和「批准」按钮。合在一起，就是你们自己的 AI：底层模型可以随时更换，大脑和经验始终属于你们。","en":"The Avatar is your company's second brain plus a harness around it. The brain keeps knowledge and experience: documents, decisions, correspondence, lessons. The harness is agents per colour domain, skills, checks and an Approve button. Together they are your own AI: the model engine can be swapped, the brain and the experience stay yours."},{"id":"compete","sprite":"21-cool","keys":{"ru":["chatgpt","gpt","лучше","отлича","конкурент","notion","obsidian"],"en":["chatgpt","gpt","better","differ","compet","notion","obsidian"],"zh":["chatgpt","gpt","更好","好在哪","区别","竞争","优势"]},"ru":"ChatGPT отвечает и забывает. Notion и Obsidian хранят, но раскладывать надо самому. NANO помнит всю историю компании, сама раскладывает и связывает, а действует только по кнопке «Одобрить». Это измерено: темы человека совпадают с сообществами графа, ρ = 0,774.","zh":"ChatGPT 回答完就忘。Notion 和 Obsidian 能存，但要自己整理。NANO 记得公司的全部经历，自己归类、自己建立联系，只有你按下「批准」才会行动。这是量化过的：人的主题与图谱社区一致，ρ = 0.774。","en":"ChatGPT answers and forgets. Notion and Obsidian store, but you sort everything yourself. NANO remembers the company's whole history, files and links it on its own, and acts only on an Approve tap. It's measured: a person's topics match the graph's communities, ρ = 0.774."},{"id":"privacy","sprite":"05-ok","keys":{"ru":["данн","безопас","приват","сервер","облак","утечк","конфиденц"],"en":["data","secur","privacy","private","server","cloud","leak"],"zh":["数据","安全","隐私","服务器","泄露"]},"ru":"Мозг и агенты живут на вашем сервере или в вашем облаке. Модель выбираете и хостите вы. Наружу ничего не уходит без «Одобрить», каждый шаг — в журнале и откатывается.","zh":"大脑和智能体运行在你们自己的服务器或云上，模型由你们选择和托管。没有「批准」，任何东西都不会发出去；每一步都有日志，可以回滚。","en":"The brain and the agents live on your server or in your cloud. You choose and host the model. Nothing leaves without Approve, and every step is logged and can be rolled back."},{"id":"cheap","sprite":"16-wow","keys":{"ru":["дешев","дёшев","быстр","стоимость ответ","токен","скорост","задержк"],"en":["cheap","fast","cost per","token","speed","latency"],"zh":["便宜","又快","成本","速度","延迟"]},"ru":"Сначала отвечает ядро мозга прямо в странице — за доли секунды и бесплатно. Модель зовём только на новый вопрос и по матрице: простое — маленькой модели, сложное — большой. На 50 000 заметок поиск в 89 раз дешевле.","zh":"先由页面里的大脑核心作答，零点几秒，零成本。只有新问题才调用模型，并按矩阵分配：简单的交给小模型，复杂的交给大模型。在 5 万条笔记上，检索便宜 89 倍。","en":"The brain core inside the page answers first, in a fraction of a second and for free. A model is called only for a new question, routed by a matrix: simple goes to a small model, hard to a large one. On 50,000 notes, search is 89 times cheaper."},{"id":"pilot","sprite":"23-done","keys":{"ru":["пилот","начать","запуск","внедр","попроб"],"en":["pilot","start","onboard","try it","rollout","deploy"],"zh":["试点","开始","上线","部署","试用"]},"ru":"Пилот — 3 недели на ваших данных. Неделя 1: подключаем почту, задачи и документы, первый утренний бриф. Неделя 2: агенты отделов готовят черновики решений. Неделя 3: итоги по вашим метрикам и решение о запуске. Условия — на созвоне за 15 минут.","zh":"试点三周，用你们的真实数据。第 1 周：接入邮件、任务和文档，出第一份晨报。第 2 周：各部门智能体准备决策草稿。第 3 周：按你们的指标总结，决定是否上线。条件在 15 分钟的通话里谈。","en":"The pilot takes 3 weeks on your real data. Week 1: we connect mail, tasks and documents, first morning brief. Week 2: department agents draft decisions. Week 3: results on your metrics and a go/no-go. Terms on a 15-minute call."},{"id":"colours","sprite":"17-wink","keys":{"ru":["цвет","домен","отдел"],"en":["colour","color","domain","department"],"zh":["颜色","领域","部门"]},"ru":"8 цветов — 8 доменов мозга, у каждого свой агент: управление, деньги и продукт, наука, этика, ИИ и ИТ, ядро и память, интерфейс и соцсети, опыт и идеи. В компании цвета — это отделы.","zh":"8 种颜色就是大脑的 8 个领域，每个领域有自己的智能体：管理、财务与产品、科学、伦理、AI 与 IT、核心与记忆、界面与社交、经验与创意。在公司里，颜色就是部门。","en":"8 colours are the brain's 8 domains, each with its own agent: management, money and product, science, ethics, AI and IT, core and memory, UI and social, experience and ideas. In a company, colours are departments."},{"id":"founder","sprite":"01-hello","keys":{"ru":["основат","ильдар","кто сделал","команда","автор"],"en":["founder","ildar","team","who built","who made"],"zh":["创始人","团队","ildar","谁做的"]},"ru":"Ильдар Баязитов. Вычислительная математика МГУ (ВМК), магистратура по менеджменту в МГУ-ППИ в Шэньчжэне, GPA 3,95. Гран-при «Ломоносов-2026»; в SberDevices превращал часы ручной работы в минуты. Управляет 17 ИИ-агентами как отделом.","zh":"Ildar Bayazitov。莫斯科大学计算数学专业，深圳北理莫斯科大学管理学硕士，GPA 3.95。“罗蒙诺索夫-2026”大奖得主；在 SberDevices 把几个小时的手工活缩短到几分钟。他像管理一个部门一样管理 17 个 AI 智能体。","en":"Ildar Bayazitov. Computational mathematics at Moscow State University, a master's in management at MSU-BIT Shenzhen, GPA 3.95. Grand Prix of Lomonosov-2026; at SberDevices he turned hours of manual work into minutes. He runs 17 AI agents as a department."},{"id":"proof","sprite":"21-cool","keys":{"ru":["доказ","цифр","метрик","трекшн","результат", <script>
// Космос + звёзды — общий фон всех HTML и продукции (решение оператора 08.11.2026, канон designer/design-canon.md).
// Глубокий индиго + лавандовая туманность (CSS на body), тихое мерцание звёзд + лёгкий параллакс за мышью (этот canvas).
// Подключение: <canvas id="cosmos"></canvas> + COSMOS.mount(document.getElementById('cosmos'), {density, parallax})
// Уважает prefers-reduced-motion: рисует один кадр без мерцания и параллакса. Ничего не рисует поверх контента — canvas под всем (z-index:-1).
window.COSMOS = (() => {
  function mount(canvas, opts = {}) {
    const ctx = canvas.getContext('2d'); if (!ctx) return null;
    const density = opts.density || 1, par = opts.parallax == null ? 10 : opts.parallax;
    const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    let W = 0, H = 0, stars = [], mx = 0, my = 0, tx = 0, ty = 0, raf = 0;
    const glow = document.createElement('canvas'); glow.width = glow.height = 32;
    const g = glow.getContext('2d'), gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    gr.addColorStop(0, 'rgba(226,218,255,1)'); gr.addColorStop(.35, 'rgba(185,166,255,.55)'); gr.addColorStop(1, 'rgba(124,92,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
    function seed() {
      const n = Math.min(650, Math.round(W * H / 5200 * density)); stars = [];
      for (let i = 0; i < n; i++) {
        const big = Math.random() < .06;
        stars.push({ x: Math.random() * W, y: Math.random() * H, r: big ? 1.6 + Math.random() * 1.6 : .4 + Math.random() * 1.1,
          ph: Math.random() * 6.28, sp: .4 + Math.random() * 1.3, L: 1 + Math.floor(Math.random() * 3), big, a: .35 + Math.random() * .5 });
      }
    }
    function resize() {
      const dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); seed(); if (still) draw(0);
    }
    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      for (const s of stars) {
        const tw = still ? 1 : .55 + .45 * Math.sin(t * s.sp + s.ph);
        const x = s.x + mx * s.L * par / 3, y = s.y + my * s.L * par / 3;
        if (s.big) { const d = s.r * 9 * (.8 + .2 * tw); ctx.globalAlpha = s.a * tw; ctx.drawImage(glow, x - d / 2, y - d / 2, d, d); }
        ctx.globalAlpha = s.a * tw; ctx.fillStyle = s.big ? '#f3efff' : '#d8d2ff';
        ctx.beginPath(); ctx.arc(x, y, s.r, 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    function loop(now) { mx += (tx - mx) * .04; my += (ty - my) * .04; draw(now / 1000); raf = requestAnimationFrame(loop); }
    addEventListener('resize', resize); resize();
    if (!still) {
      addEventListener('mousemove', e => { tx = e.clientX / W - .5; ty = e.clientY / H - .5; });
      raf = requestAnimationFrame(loop);
    }
    return { destroy() { cancelAnimationFrame(raf); removeEventListener('resize', resize); } };
  }
  return { mount };
})();

// Оболочка страницы: язык (RU · 中文 · EN, по умолчанию русский; ?lang=en для ссылки инвестору), экраны по хешу
// (#card — визитка и квест, #ask — разговор с NANO, #brain — 3D-мозг), тексты визитки, цифры мозга, контакты.
// Игра, аватар, чат и мозг подписываются через window.B2B. Продукт (b2b · b2c · graph) и его экраны приходят из сборки.
(function () {
  const D = JSON.parse(document.getElementById('data').textContent);
  const BR = JSON.parse(document.getElementById('brainData').textContent);
  const C = D.copy, U = C.ui, LANGS = C.langs;
  const LOC = {ru: 'ru-RU', zh: 'zh-CN', en: 'en-US'};
  const SCREENS = D.screens && D.screens.length ? D.screens : ['card', 'ask', 'brain'];
  const store = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* приватное окно — язык просто не запомнится */ } }};
  let lang = (() => {
    const q = new URLSearchParams(location.search).get('lang');
    if (LANGS.includes(q)) return q;
    const s = store.get('avatar-lang');
    return LANGS.includes(s) ? s : C.default;
  })();
  const subs = {lang: [], screen: []};
  const num = n => Number(n).toLocaleString(LOC[lang]);
  const facts = () => ({NOTES: num(D.facts.notes), LINKS: num(D.facts.links), COMMITS: num(D.facts.commits),
    EMAIL: D.contact.email, WECHAT: D.contact.wechat, TEL: D.contact.tel_h, CORE: num(BR.t.length)});
  const fill = (s, extra) => { const f = Object.assign(facts(), extra || {});
    return String(s).replace(/\{(\w+)\}/g, (m, k) => (k in f ? f[k] : m)); };
  const t = (k, extra) => fill(U[lang][k] !== undefined ? U[lang][k] : U.ru[k], extra);
  const $ = s => document.querySelector(s);

  function formula() {
    const ops = ['', '+', '+', '='];
    $('#formula').innerHTML = '';
    U[lang].f.forEach(([b, s], i) => {
      const li = document.createElement('li');
      li.dataset.op = ops[i]; if (i === 3) li.className = 'out';
      li.innerHTML = '<b></b><span></span>'; li.firstChild.textContent = b; li.lastChild.textContent = s;
      $('#formula').append(li);
    });
  }
  function stats() {
    const v = [D.facts.notes, D.facts.links, D.facts.commits];
    $('#stats').innerHTML = '';
    U[lang].st.forEach((label, i) => {
      const d = document.createElement('div'); d.innerHTML = '<dt></dt><dd></dd>';
      d.firstChild.textContent = num(v[i]); d.lastChild.textContent = label; $('#stats').append(d);
    });
  }
  function contacts() {
    const c = D.contact;
    $('#ctaCall').href = 'mailto:' + c.email + '?subject=' + encodeURIComponent(t('mail_subject')) + '&body=' + encodeURIComponent(t('mail_body'));
    $('#mailText').textContent = c.email;
    document.querySelectorAll('[data-link]').forEach(a => { a.href = D.links[a.dataset.link] + (lang === 'ru' ? '' : '?lang=' + lang); });
  }
  function apply() {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
    document.title = U[lang].title;
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
    document.querySelectorAll('[data-ph]').forEach(el => { el.placeholder = t(el.dataset.ph); });
    document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    formula(); stats(); contacts();
    subs.lang.forEach(f => f(lang));
  }

  const screen = () => { const h = location.hash.slice(1); return SCREENS.includes(h) ? h : SCREENS[0]; };
  function route() {
    const name = screen();
    document.body.dataset.screen = name;
    document.querySelectorAll('[data-screen]').forEach(s => { s.hidden = s.dataset.screen !== name; });
    document.querySelectorAll('.tab').forEach(a => { if (a.dataset.tab === name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    window.scrollTo(0, 0);
    subs.screen.forEach(f => f(name));
  }

  document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang; store.set('avatar-lang', lang); apply();
  }));
  $('#copyMail').addEventListener('click', () => {
    const done = () => { $('#copyMail').textContent = t('copied'); setTimeout(() => { $('#copyMail').textContent = t('cta_copy'); }, 1600); };
    const pick = () => { const r = document.createRange(); r.selectNodeContents($('#mailText')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(D.contact.email).then(done, pick); else pick();
  });
  window.addEventListener('hashchange', route);

  // вкладки — только экраны этого продукта, номера подряд; один экран — без вкладок
  document.querySelectorAll('.tab').forEach(a => { a.hidden = !SCREENS.includes(a.dataset.tab); });
  SCREENS.forEach((n, i) => { const a = document.querySelector(`.tab[data-tab="${n}"] em`); if (a) a.textContent = String(i + 1).padStart(2, '0'); });
  document.querySelector('.tabs').hidden = SCREENS.length < 2;
  document.querySelector('.logo').href = '#' + SCREENS[0];

  const sprite = k => D.sprites[k] || D.sprites[D.alias[k]] || D.sprites.round;   // старые имена эмоций → BUBBLEGUM
  $('#heroImg').src = sprite('hero');
  document.body.dataset.aud = D.aud;

  // цвет домена: синий в мозге темнее остальных — на тёмном фоне берём светлее (как в квесте)
  const VIS = {BLUE: '#6f8cff'};
  const hex = k => VIS[k] || (D.colours[k] && D.colours[k].hex) || ((BR.c[k] || [])[2]) || '#9d97c6';
  const cname = (k, l) => { const c = C.colours[k]; return c ? c[l || lang][0] : ((BR.c[k] || [])[(l || lang) === 'ru' ? 0 : 1] || ''); };

  window.B2B = {D, BR, t, fill, num, sprite, hex, cname, get lang() { return lang; },
    onLang: f => subs.lang.push(f), onScreen: f => subs.screen.push(f),
    screen, screens: SCREENS, store, go: name => { if (location.hash === '#' + name) route(); else location.hash = '#' + name; }, boot() { apply(); route(); }};
})();

// 3D-мозг на шарах. Эталон формы — Desktop/PERFECT.jpg (плотный шар из ~500 шаров, домены пятнами; форму vault-app не перестраивать).
// Canvas 2D без библиотек: шар каждого цвета один раз рисуется в спрайт (глянец + сетка икосферы), кадр — ~560 drawImage по глубине.
// Укладка общая на страницу: у каждого цвета свой якорь на сфере, шары слетаются из облака, перекрытия расталкиваются, всё тянется к центру.
// Экземпляр = холст: шапка разговора (малый, без подписей) и экран «Мозг» (большой: вращение пальцем, выбор шара, подпись).
(function () {
  const B = window.B2B, BR = B.BR, N = BR.t.length, K = BR.k;
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const RELAX = 130;                       // шагов релаксации; идут по 3 за кадр — мозг «собирается» на глазах
  const all = [];

  // ── модель ─────────────────────────────────────────────
  const rng = seed => { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); };
  const M = (() => {
    const R = rng(11), maxd = Math.max(...BR.t.map(r => r[3]));
    const cnt = K.map((_, ci) => BR.t.filter(r => r[1] === ci).length);
    const order = K.map((_, i) => i).sort((a, b) => cnt[b] - cnt[a]);
    const anc = [], rank = [];
    order.forEach((ci, j) => { const y = 1 - (j + .5) * 2 / K.length, rr = Math.sqrt(1 - y * y), ph = j * 2.39996;
      anc[ci] = [Math.cos(ph) * rr, y, Math.sin(ph) * rr]; rank[ci] = j; });
    const r = new Float32Array(N), p = new Float32Array(N * 3), delay = new Float32Array(N);
    let vol = 0;
    for (let i = 0; i < N; i++) { r[i] = .8 + 1.55 * Math.sqrt(BR.t[i][3] / maxd); vol += r[i] ** 3; }
    const RAD = Math.cbrt(vol / .56);
    for (let i = 0; i < N; i++) {
      const ci = BR.t[i][1], a = anc[ci], sp = .5 + 1.2 * Math.sqrt(cnt[ci] / N);
      const x = a[0] + (R() - .5) * sp, y = a[1] + (R() - .5) * sp, z = a[2] + (R() - .5) * sp, l = Math.hypot(x, y, z) || 1, d = RAD * Math.cbrt(.1 + .9 * R());
      p[i * 3] = x / l * d; p[i * 3 + 1] = y / l * d; p[i * 3 + 2] = z / l * d;
      delay[i] = rank[ci] * .07 + R() * .3;
    }
    return {r, p, delay, anc, RAD, it: 0, t0: 0, maxr: .8 + 1.55};
  })();
  function relax(steps) {
    const {r, p, anc, RAD} = M;
    for (let s = 0; s < steps && M.it < RELAX; s++, M.it++) {
      for (let i = 0; i < N; i++) {
        const xi = p[i * 3], yi = p[i * 3 + 1], zi = p[i * 3 + 2], ri = r[i];
        for (let j = i + 1; j < N; j++) {
          const dx = p[j * 3] - xi; if (dx > 5 || dx < -5) continue;
          const dy = p[j * 3 + 1] - yi, dz = p[j * 3 + 2] - zi, mn = (ri + r[j]) * .97, d2 = dx * dx + dy * dy + dz * dz;
          if (d2 >= mn * mn || d2 < 1e-6) continue;
          const d = Math.sqrt(d2), k = (mn - d) / d * .5;
          p[i * 3] -= dx * k; p[i * 3 + 1] -= dy * k; p[i * 3 + 2] -= dz * k;
          p[j * 3] += dx * k; p[j * 3 + 1] += dy * k; p[j * 3 + 2] += dz * k;
        }
      }
      for (let i = 0; i < N; i++) {
        const a = anc[BR.t[i][1]], g = .985;
        p[i * 3] = p[i * 3] * g + (a[0] * RAD * .5 - p[i * 3]) * .006;
        p[i * 3 + 1] = p[i * 3 + 1] * g + (a[1] * RAD * .5 - p[i * 3 + 1]) * .006;
        p[i * 3 + 2] = p[i * 3 + 2] * g + (a[2] * RAD * .5 - p[i * 3 + 2]) * .006;
      }
    }
  }
  if (RM) relax(RELAX);

  // ── спрайты шаров ──────────────────────────────────────
  const mix = (h, w, t) => { const a = parseInt(h.slice(1), 16), b = parseInt(w.slice(1), 16);
    const c = s => Math.round(((a >> s) & 255) * (1 - t) + ((b >> s) & 255) * t);
    return `rgb(${c(16)},${c(8)},${c(0)})`; };
  const S = 128, SPR = {}, GLOW = {};
  function sprites(k) {
    if (SPR[k]) return;
    const h = B.hex(k), c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d'), R = S / 2 - 1;
    const gr = g.createRadialGradient(S * .36, S * .3, S * .03, S * .5, S * .5, R);
    gr.addColorStop(0, mix(h, '#ffffff', .7)); gr.addColorStop(.32, mix(h, '#ffffff', .18)); gr.addColorStop(.78, h); gr.addColorStop(1, mix(h, '#05030f', .6));
    g.fillStyle = gr; g.beginPath(); g.arc(S / 2, S / 2, R, 0, 7); g.fill();
    // сетка икосферы, как у шаров PERFECT: еле видная, даёт фактуру при любом размере
    g.save(); g.clip(); g.strokeStyle = 'rgba(8,6,26,.26)'; g.lineWidth = 1.1;
    for (const k2 of [-.62, -.25, .12, .48]) { const rx = R * Math.sqrt(1 - k2 * k2); g.beginPath(); g.ellipse(S / 2, S / 2 + k2 * R, rx, rx * .3, 0, 0, 7); g.stroke(); }
    for (const a of [.25, .8, 1.3, 1.9, 2.5]) { g.beginPath(); g.ellipse(S / 2, S / 2, Math.abs(Math.cos(a)) * R + .5, R, 0, 0, 7); g.stroke(); }
    g.restore();
    g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = 1.6; g.beginPath(); g.arc(S / 2, S / 2, R - 1, 0, 7); g.stroke();
    SPR[k] = c;

      if (d > 1.45) { float(L.x, L.y - L.R * 1.5, 'EARLY', DIM); return; }
      float(L.x, L.y - L.R * 1.5, Math.abs(d - 1) < .2 ? 'PERFECT' : 'GOOD', E.c); burst(L.x, L.y, E.c, 16); E.hit(); L.gap = .3;
    };
    return L;
  }

  const LV = {PINK: bubbles, BLUE: chain, GREEN: descent, LIGHT_RED: coins, RED: fires, LIGHT_BLUE: gate, PURPLE: memory, TEAL: rhythm};

  // ── ход игры ──────────────────────────────────────────
  function say(fn, spr) {
    st.sayFn = fn; $('#sayText').textContent = fn(); $('#sayImg').src = B.sprite(spr);
    const el = $('#say'); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  }
  function pips() {
    const ol = $('#pips'); ol.innerHTML = '';
    RING.forEach(k => { const li = document.createElement('li'); li.style.setProperty('--c', COL(k)); if (st.lit.has(k)) li.className = 'on'; ol.append(li); });
    $('#syncTag').textContent = `SYNC ${st.lit.size}/8`;
  }
  function goal() {
    const L = st.lvl, ol = $('#lvlGoal'); ol.innerHTML = '';
    for (let i = 0; i < L.goal; i++) { const li = document.createElement('li'); if (i < L.got) li.className = 'on'; ol.append(li); }
  }
  function levelText() {
    const k = st.key, [name] = D.copy.colours[k][B.lang];
    $('#lvlName').textContent = name; $('#lvlHint').textContent = '';
  }
  function start(k) {
    if (!st.t0) st.t0 = performance.now();
    st.mode = 'level'; st.key = k;
    const E = {c: COL(k), top: 58,
      hit() { const L = st.lvl; if (!L || L.done) return; L.got++; goal();
        if (L.got >= L.goal) { L.done = true; burst(W / 2, H / 2, E.c, 40); float(W / 2, H / 2, '+1', E.c); setTimeout(() => finish(k), 700); } },
      reset() { if (st.lvl) { st.lvl.got = 0; goal(); } }};
    st.lvl = LV[k](E); st.lvl.got = 0;
    $('#lvlBar').hidden = false; $('#lvlBar').style.setProperty('--c', E.c); stage.style.setProperty('--c', E.c);
    levelText(); goal(); cv.style.touchAction = 'none';
    say(() => D.copy.colours[k][B.lang][1], '20-idea');
  }
  function toMap() {
    st.mode = st.lit.size === 8 ? 'win' : 'map'; st.lvl = null; st.key = null;
    $('#lvlBar').hidden = true; cv.style.touchAction = '';
  }
  function finish(k) {
    if (st.key !== k) return;
    st.lit.add(k); toMap(); pips();
    const spr = REACT[st.react++ % REACT.length];
    say(() => B.t('lit', {D: D.copy.colours[k][B.lang][0], N: B.num(D.colours[k].notes)}), spr);
    if (st.lit.size === 8) finale();
  }
  function finale() {
    st.mode = 'win'; st.t1 = performance.now();
    const G = geo(); RING.forEach((k, i) => setTimeout(() => burst(G.pos[i].x, G.pos[i].y, COL(k), 24), i * 90));
    setTimeout(() => { $('#win').hidden = false; winText(); }, 900);
    say(() => B.t('win_s'), 'look-04-yay');
  }
  function winText() { const s = ((st.t1 - st.t0) / 1000).toLocaleString(B.lang === 'ru' ? 'ru-RU' : 'en-US', {maximumFractionDigits: 1}); $('#winTime').textContent = B.t('win_time', {S: s}); }
  function reset() {
    st.lit.clear(); st.t0 = st.t1 = 0; st.react = 0; $('#win').hidden = true; toMap(); st.mode = 'map'; pips();
    say(() => B.t('hello'), '01-hello');
  }

  function point(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  cv.addEventListener('pointerdown', e => {
    const [x, y] = point(e);
    if (st.mode === 'map') { const k = nodeAt(x, y); if (k && !st.lit.has(k)) start(k); return; }
    if (st.mode === 'level' && st.lvl) { e.preventDefault(); st.lvl.down(x, y); }
  });
  cv.addEventListener('pointermove', e => { if (st.mode === 'level' && st.lvl && st.lvl.move) { const [x, y] = point(e); st.lvl.move(x, y); } });
  cv.tabIndex = 0;
  cv.addEventListener('keydown', e => {
    if (e.key === 'Enter' && st.mode === 'map') { const k = NEXT.find(k => !st.lit.has(k)); if (k) start(k); }
    if (e.key === 'Escape' && st.mode === 'level') toMap();
  });
  $('#lvlBack').addEventListener('click', toMap);
  $('#again').addEventListener('click', reset);

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!W) resize();
    if (W && B.screen() === 'card') {
      g.clearRect(0, 0, W, H);
      if (st.mode === 'level' && st.lvl) { g.fillStyle = rgba(COL(st.key), .04); g.fillRect(0, 0, W, H); st.lvl.update(dt); st.lvl.draw(now); } else drawMap(now);
      drawFx(dt);
      if (st.t0) $('#qTimer').textContent = `${(((st.t1 || now) - st.t0) / 1000).toFixed(1)} s`;
    }
    requestAnimationFrame(frame);
  }

  B.onLang(() => { pips(); if (st.sayFn) $('#sayText').textContent = st.sayFn(); if (st.key) levelText(); if (!$('#win').hidden) winText(); });
  B.onScreen(name => { if (name === 'card') resize(); });
  B.game = {state: st, start, finish, nodeAt, geo};   // для QA
  pips(); say(() => B.t('hello'), '01-hello');
  requestAnimationFrame(frame);
})();

// Аватар в окне разговора — готовые живые стикеры BUBBLEGUM (NANO_FINAL/01_STICKERS/BUBBLEGUM_ANIM), без своих движений:
// состояние NANO = какой стикер играет (states.json), смена — мягкий переход двух слоёв. Пузырь закрывает ноги → видно в пол роста.
// Реплика проявляется словами (в китайском — знаками), под ней — источники из мозга (тап — заметка в 3D).
(function () {
  const B = window.B2B, $ = s => document.querySelector(s);
  const box = $('#avatar'); if (!box || !B.D.live) { B.avatar = {mood() {}, say() {}, wait() {}}; return; }
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const LIVE = B.D.live;   // состояние → стикер (make.py: AUD[aud].live)
  const layers = [$('#avA'), $('#avB')], cap = $('#avState'), text = $('#avText'), src = $('#avSrc'), bubble = $('#avSay');
  let front = 0, shown = '', timer = 0, typing = 0, line = null, sleepT = 0;

  function show(k) {
    if (k === shown) return; shown = k;
    const back = layers[1 - front], img = B.D.sprites['av-' + k];
    back.onload = () => { back.classList.add('on'); layers[front].classList.remove('on'); front = 1 - front; };

  function mood(s) {

    clearTimeout(timer); clearTimeout(sleepT);
    if (!['idle', 'listening', 'thinking', 'working'].includes(st)) timer = setTimeout(() => mood('idle'), 9000);
    if (st === 'idle') sleepT = setTimeout(() => { if (box.dataset.state === 'idle') mood('sleep'); }, 90000);
  }
  function say(str, sources, instant) {
    line = {str: String(str), sources: sources || []};
    bubble.classList.remove('wait'); clearInterval(typing);
    const zh = B.lang === 'zh', parts = zh ? Array.from(line.str) : line.str.split(/(\s+)/), by = zh ? 3 : 2;
    let n = 0;
    if (instant || RM) text.textContent = line.str;
    else { text.textContent = ''; typing = setInterval(() => { n += by; text.textContent = parts.slice(0, n).join(''); if (n >= parts.length) { clearInterval(typing); typing = 0; } }, 34); }
    chips(line.sources);
    if (!instant && B.voice) B.voice(line.str);
  }
  function wait(str) { clearInterval(typing); text.textContent = str; bubble.classList.add('wait'); src.innerHTML = ''; }
  function chips(list) {
    src.innerHTML = '';
    if (!list.length || !B.screens.includes('brain')) return;
    for (const i of list.slice(0, 3)) {
      const r = B.BR.t[i]; if (!r) continue;
      const b = document.createElement('button'); b.type = 'button'; b.style.setProperty('--c', B.hex(B.BR.k[r[1]]));
      b.textContent = B.chat ? B.chat.title(r[0], B.lang) : r[0];
      b.addEventListener('click', () => B.brain && B.brain.focus(i));
      src.append(b);
    }
  }
  bubble.addEventListener('click', e => { if (typing && line && e.target === text) { clearInterval(typing); typing = 0; text.textContent = line.str; } });
  B.onLang(() => { cap.textContent = B.t('st_' + box.dataset.state); });
  layers[0].src = B.D.sprites['av-' + LIVE.idle]; shown = LIVE.idle;
  mood('idle');
  B.avatar = {mood, say, wait, get line() { return line; }};
})();

// Настройки (шестерёнка в шапке): язык, галактика на фоне, голос NANO. Образ один — канон BUBBLEGUM.
// Фон — канон «космос + звёзды» (RIG/anim/cosmos.js). Всё хранится только в этом браузере; без хранилища — значения по умолчанию.

// Экран 2 — вопросы к аватару. Три ступени, от дешёвой к дорогой:
//  1) готовые ответы о продукте (copy.json → intents) — мгновенно, $0;
//  2) ядро мозга прямо в странице (#brainData: главные заметки по степени, собирает make.py) — мгновенно, $0;
//  3) живой мозг на сервере (ceo.nineloom.com/nano-api, ASSETS/nano-ask) — только на новое, ответ дописывается следующим пузырём.
// Живой мозг понимает ru и en; на 中文 спрашиваем по-английски и честно пишем это в плашке.
// Каждая реплика NANO идёт и в пузырь аватара (B.avatar: эмоция + источники из мозга), и в историю под ним.
(function () {
  const B = window.B2B, C = B.D.copy, $ = s => document.querySelector(s);
  const BR = B.BR, N = BR.t.length, AV = () => B.avatar;
  const API = {health: 'https://ceo.nineloom.com/nano-api/health', ask: 'https://ceo.nineloom.com/nano-api/ask'};
  const log = $('#log');
  const entries = [];     // пузыри перерисовываются при смене языка: у ответа ядра есть fn(lang), у живого — готовый текст
  const LIVE = {on: null};

  // ── поиск по ядру (основы — как в pitch-investor/realbrain.js) ──
  const low = s => String(s).toLowerCase().replace(/ё/g, 'е');
  const HAY = BR.t.map(r => low(r[0] + ' ' + (r[5] || ''))), SUM = BR.t.map(r => low(r[2]));
  const STOP = new Set(('что как где когда зачем почему какой какая какие это эта этот или в во на по за из у о об про для от до ли же ' +
    'ты вы мне меня мой моя мои твой ваш его ее их есть был была было расскажи скажи объясни знаешь мозг мозге мозгу такое такой ' +
    'what how why when where which who is are was the a an of to in on for about and or do does you your me my tell explain know brain').split(' '));
  const ENDS = 'ами ями ого его ому ему ах ях ов ев ой ей ам ям ом ем ую юю ая яя ое ее ые ие ий ый ия ии а я ы и у ю е о ь'.split(' ').sort((a, b) => b.length - a.length);
  const stem = w => { if (/^[а-я]/.test(w)) { for (const e of ENDS) if (w.endsWith(e) && w.length - e.length >= 4) return w.slice(0, -e.length); return w; }
    return w.length > 4 && w.endsWith('s') ? w.slice(0, -1) : w; };
  const stems = q => [...new Set((low(q).match(/[a-zа-я0-9]+/g) || []).filter(w => w.length >= 3 && !STOP.has(w)).map(stem))].slice(0, 8);
  function search(q, k = 3) {
    const st = stems(q); if (!st.length) return [];
    const out = [];
    for (let i = 0; i < N; i++) {
      let s = 0, cover = 0;
      for (const w of st) { const h = (HAY[i].includes(w) ? 3 : 0) + (SUM[i].includes(w) ? 1 : 0); if (h) { s += h; cover++; } }
      if (cover) out.push({i, s: s + 2 * (cover - 1) + 0.25 * Math.log1p(BR.t[i][3])});
    }
    return out.sort((a, b) => b.s - a.s).slice(0, k);
  }

  // ── готовые ответы: ключи всех языков (вопрос на английском в русском режиме тоже узнаём), отвечаем на текущем ──
  const INT = C.intents.map(it => ({...it, all: [].concat(...Object.values(it.keys)).map(low)}));
  function intent(q) {
    const s = ' ' + low(q) + ' ';
    let best = null, bn = 0;
    for (const it of INT) { if (it.weak) continue; const n = it.all.filter(k => s.includes(k)).length; if (n > bn) { best = it; bn = n; } }
    return best;
  }
  const weak = q => { const s = ' ' + low(q) + ' '; return INT.find(it => it.weak && it.all.some(k => s.includes(k))) || null; };

  // ── ответ ядра ──
  const cname = (ci, l) => { const k = BR.k[ci], c = C.colours[k]; return c ? c[l][0] : ((BR.c[k] || [])[l === 'ru' ? 0 : 1] || ''); };
  const title = (s, l) => { s = s.replace(/^(hub|хаб|moc)\s*[:—-]\s*/i, ''); const m = s.match(/^(.+?)\s*\(([^()]+)\)\s*$/);
    s = m ? (l !== 'ru' && /^[\x20-\x7e]+$/.test(m[2]) ? m[2] : m[1]) : s; return s.length > 46 ? s.slice(0, 45).replace(/\s+\S*$/, '') + '…' : s; };
  const quote = (s, l) => (l === 'ru' ? `«${s}»` : l === 'zh' ? `「${s}」` : `“${s}”`);
  const latin = s => { const a = (s.match(/[a-z]/gi) || []).length, c = (s.match(/[а-яё]/gi) || []).length; return a > 3 * c; };
  function compose(hits, l) {
    const r = BR.t[hits[0].i], sum = r[2] || '';
    const near = (r[4].length ? r[4] : hits.slice(1).map(x => x.i)).slice(0, 2).map(j => quote(title(BR.t[j][0], l), l));
    const v = {T: title(r[0], l), C: cname(r[1], l), S: sum};
    const head = l === 'zh' || !sum || (l === 'en' && !latin(sum)) ? B.t('brain_short', v) : B.t('brain', v);
    return head + (near.length ? B.t('near', {L: near.join(l === 'zh' ? '、' : ', ')}) : '');
  }

  // ── пузыри ──
  function render(e) {
    const d = e.el || (e.el = document.createElement('div'));
    d.className = 'msg ' + (e.me ? 'me' : 'bot') + (e.wait ? ' wait' : '');
    d.textContent = e.me ? e.text : (e.fn ? e.fn(B.lang) : e.text);
    const badge = e.badge && e.badge();
    if (badge) { const b = document.createElement('span'); b.className = 'b ' + e.kind; b.textContent = badge; d.append(b); }
    return d;
  }
  const said = e => (e.fn ? e.fn(B.lang) : e.text);
  function push(e) {
    entries.push(e); log.append(render(e)); log.scrollTop = log.scrollHeight;
    if (!e.me) { if (e.wait) { if (!e.quiet) AV().wait(said(e)); } else AV().say(said(e), e.src); }
    return e;
  }
  function drop(e) { const i = entries.indexOf(e); if (i >= 0) entries.splice(i, 1); if (e.el) e.el.remove(); }
  // эмоция по стикеру ответа: стикер — портрет в пузыре, состояние — аура и движение фигуры
  const MOOD = {'20-idea': 'idea', '12-facepalm': 'error', '18-question': 'error', '23-done': 'success', '05-ok': 'approve', '17-wink': 'approve', '11-think': 'thinking'};
  function face(k) { AV().mood(MOOD[k] || 'speaking', k); }
  // источники живого ответа → шары ядра по заголовку
  const BYT = new Map(BR.t.map((r, i) => [low(r[0]), i]));
  const srcOf = j => ((j && j.src) || []).map(x => BYT.get(low(x.t || ''))).filter(i => i != null);
  const ms = t => (t < 10 ? t.toFixed(1) : Math.round(t)).toLocaleString(B.lang === 'ru' ? 'ru-RU' : 'en-US');
  const coreBadge = t => () => B.t('b_core', {MS: ms(t)});

  function live(q, after) {
    // после ответа ядра живой мозг дописывает тихо: реплика ядра остаётся читаемой, меняется только состояние
    AV().mood(after ? 'thinking' : 'working');
    const wait = push({wait: true, quiet: !after, fn: () => B.t('think')}), t0 = performance.now();
    const ctl = window.AbortController ? new AbortController() : null, to = setTimeout(() => ctl && ctl.abort(), 25000);
    const l = B.lang === 'ru' ? 'ru' : 'en';
    const done = (text, ok, src) => {
      clearTimeout(to); drop(wait);
      if (text) { const s = ((performance.now() - t0) / 1000).toFixed(1); face(ok ? '05-ok' : '18-question'); push({text, src, kind: 'live', badge: ok ? () => B.t('b_live', {S: s}) : null}); }
      else if (after) { face('18-question'); push({fn: () => B.t('fallback'), kind: 'core', badge: coreBadge(0)}); }
      else AV().mood('idea');
    };
    // text/plain — «простой» запрос без OPTIONS: на телефоне ответ приходит на круг раньше
    fetch(API.ask, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({q, lang: l}), signal: ctl ? ctl.signal : undefined})
      .then(r => r.json()).then(j => { if (j && j.text) done(j.text, !!j.ok, srcOf(j)); else done(null); })
      .catch(() => done(null));
  }
  // вопрос живому мозгу без чата (карточка заметки на экране «Мозг»)
  function fetchLive(q) {
    const ctl = window.AbortController ? new AbortController() : null, to = setTimeout(() => ctl && ctl.abort(), 25000);
    return fetch(API.ask, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({q, lang: B.lang === 'ru' ? 'ru' : 'en'}), signal: ctl ? ctl.signal : undefined})
      .then(r => r.json()).then(j => (j && j.text ? j.text : null)).catch(() => null).finally(() => clearTimeout(to));
  }

  function ask(q, shown) {
    q = String(q || '').trim().slice(0, 400); if (!q) return;
    push({me: true, text: shown || q});
    const t0 = performance.now(), it = intent(q);
    if (it) { const t = performance.now() - t0; face(it.sprite); push({fn: l => B.fill(it[l]), kind: 'core', badge: coreBadge(t)}); return; }
    const hits = search(q), good = hits.length && hits[0].s >= 3;
    if (good) {
      const h0 = hits[0].i, src = [h0, ...(BR.t[h0][4].length ? BR.t[h0][4] : hits.slice(1).map(x => x.i)).slice(0, 2)];
      const t = performance.now() - t0; face('20-idea'); push({fn: l => compose(hits, l), src, kind: 'core', badge: coreBadge(t)});
      if (LIVE.on) live(q, false);
      return;
    }
    const w = weak(q);
    if (w) { const t = performance.now() - t0; face(w.sprite); push({fn: l => B.fill(w[l]), kind: 'core', badge: coreBadge(t)}); return; }
    if (LIVE.on === false) { face('18-question'); push({fn: () => B.t('fallback'), kind: 'core', badge: coreBadge(performance.now() - t0)}); return; }
    live(q, true);
  }
  function answerIntent(id, shown) {
    const it = INT.find(x => x.id === id); if (!it) return;
    push({me: true, text: shown});
    const t0 = performance.now(), txt = l => B.fill(it[l]);
    txt(B.lang); face(it.sprite); push({fn: txt, kind: 'core', badge: coreBadge(performance.now() - t0)});
  }

  // ── подсказки, статус, форма ──
  function chips() {
    const box = $('#chips'); box.innerHTML = '';
    for (const c of C.chips) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = c[B.lang];
      if (c.q) b.className = 'brain';
      b.addEventListener('click', () => (c.id ? answerIntent(c.id, c[B.lang]) : ask(B.lang === 'ru' ? c.q : (c.q_en || c.q), c[B.lang])));
      box.append(b);
    }
  }
  function status() {
    const dot = $('#liveDot'); if (!dot) return;
    dot.className = 'dot' + (LIVE.on === true ? ' on' : LIVE.on === false ? ' off' : '');
    dot.title = B.t(LIVE.on === false ? 'live_off' : 'live');
  }
  $('#askForm').addEventListener('submit', e => { e.preventDefault(); const i = $('#q'); ask(i.value); i.value = ''; i.blur(); });
  $('#q').addEventListener('focus', () => AV().mood('listening'));
  $('#q').addEventListener('input', () => { if ($('#avatar').dataset.state !== 'listening') AV().mood('listening'); });
  $('#q').addEventListener('blur', () => { setTimeout(() => { if ($('#avatar') && $('#avatar').dataset.state === 'listening') AV().mood('idle'); }, 200); });

  fetch(API.health, {cache: 'no-store'}).then(r => (r.ok ? r.json() : null))
    .then(j => { LIVE.on = !!(j && j.llm); status(); }).catch(() => { LIVE.on = false; status(); });

  B.onLang(() => {
    chips(); status(); for (const e of entries) render(e);
    const last = [...entries].reverse().find(e => !e.me && !e.wait); if (last) AV().say(said(last), last.src, true);
  });
  B.onScreen(name => { if (name === 'ask') { log.scrollTop = log.scrollHeight; } });
  B.chat = {ask, search, intent, entries, live: LIVE, title, fetchLive};   // title/fetchLive — экрану «Мозг», остальное — QA
  push({fn: () => B.t('welcome')});
})();

// Экран «Мозг»: ядро мозга шарами в 3D (sphere.js, эталон PERFECT), поиск по ядру, легенда цветов-доменов,
// карточка заметки (тап по шару): сводка, связи, вопрос NANO — в чат, а если чата в продукте нет — живому мозгу прямо в карточке.
(function () {
  const B = window.B2B, BR = B.BR, K = BR.k, $ = s => document.querySelector(s);
  const cv = $('#brainCv'); if (!cv) return;
  const title = i => B.chat.title(BR.t[i][0], B.lang);
  const note = $('#note'), msg = $('#brMsg');
  let cur = -1, only = null, asked = 0;
  const sp = B.Sphere(cv, {fit: .48, label: title, spin: .12,
    onPick: i => { if (i >= 0) open(i); else { sp.clear(); close(); } }});

  function open(i, keep) {
    cur = i; const r = BR.t[i], k = K[r[1]];
    if (!keep) sp.show([i], r[4].slice(0, 8));
    note.style.setProperty('--c', B.hex(k));
    $('#nC').textContent = B.cname(k); $('#nT').textContent = title(i); $('#nS').textContent = r[2] || '';
    $('#nS').hidden = !r[2];
    const near = $('#nNear'); near.innerHTML = '';
    for (const j of r[4].slice(0, 6)) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = title(j); b.style.setProperty('--c', B.hex(K[BR.t[j][1]]));
      b.addEventListener('click', () => open(j)); near.append(b);
    }
    $('#nNear').previousElementSibling.hidden = !r[4].length;
    $('#nFace').src = B.sprite('round');
    $('#nAns').hidden = true; asked++;
    note.hidden = false;
  }
  function close() { note.hidden = true; cur = -1; }
  $('#nX').addEventListener('click', () => { close(); sp.clear(); });

  $('#nAsk').addEventListener('click', () => {
    if (cur < 0) return;
    const q = B.t('br_q', {T: title(cur)});
    if (B.screens.includes('ask')) { close(); B.go('ask'); setTimeout(() => B.chat.ask(q), 120); return; }
    const ans = $('#nAns'), ticket = asked;
    ans.hidden = false; ans.textContent = B.t('br_wait'); ans.classList.add('wait'); sp.setThink(true);
    B.chat.fetchLive(q).then(t => {
      sp.setThink(false); if (ticket !== asked) return;
      ans.classList.remove('wait'); ans.textContent = t || B.t('fallback');
    });
  });

  function legend() {
    const box = $('#legend'); box.innerHTML = '';
    const mk = (ci, label, n) => {
      const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-pressed', String(only === ci));
      if (ci != null) b.style.setProperty('--c', B.hex(K[ci]));
      b.innerHTML = '<i></i><span></span><em></em>'; b.children[1].textContent = label; b.children[2].textContent = n;
      b.addEventListener('click', () => { only = only === ci ? null : ci; sp.setOnly(only); close(); legend(); });
      box.append(b);
    };
    mk(null, B.t('br_all'), B.num(BR.t.length));
    K.map((k, ci) => [ci, BR.t.filter(r => r[1] === ci).length]).filter(x => x[1]).sort((a, b) => b[1] - a[1])
      .forEach(([ci, n]) => mk(ci, B.cname(K[ci]), n));
  }

  $('#brForm').addEventListener('submit', e => {
    e.preventDefault(); const inp = $('#brQ'), q = inp.value.trim(); if (!q) return; inp.blur();
    if (only != null) { only = null; sp.setOnly(null); legend(); }
    const hits = B.chat.search(q, 12);
    if (!hits.length) { sp.clear(); close(); msg.textContent = B.t('br_none'); sp.setThink(true); setTimeout(() => sp.setThink(false), 1200); return; }
    const ids = hits.map(h => h.i);
    sp.show(ids, BR.t[ids[0]][4].slice(0, 4)); open(ids[0], true);
    msg.textContent = B.t('br_found', {K: B.num(ids.length)});
  });

  B.brain = {sphere: sp, open, focus(i) { B.go('brain'); setTimeout(() => open(i), 60); }};
  B.onLang(() => { legend(); if (cur >= 0) open(cur, true); msg.textContent = ''; });
  B.onScreen(name => { if (name !== 'brain') close(); });
})();

window.B2B.boot();

</script>
</body>
</html>
